<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>水理学 実践ラボ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>/* Layout: practice lab. Home = design-flow strip + case cards. Case view = brief, inputs | drawing, calc table, checks with utilisation gauges, cost & stars. Riso palette shared with the lab series. */
:root{--paper:#F4F3EF;--ink:#1C3A7E;--navy:#12286B;--blue:#3286BE;--red:#C62422;--mid:#93BCD6;--sheet:#FFFFFF;--line:#D9D6CC;--muted:#5E6B86;--soft:#EAF2F8;
 --f-disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;--f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;color-scheme:light}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f-body);margin:0}
body{-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:2px solid var(--navy)}
.logo{font-family:var(--f-disp);font-size:18px;color:var(--navy);white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo b{color:var(--red);font-weight:400}
#crumb{font-weight:900;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{font-size:13px;font-weight:900;color:var(--red);white-space:nowrap}
main{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,6vw,52px);line-height:1.15;margin:0;color:var(--navy);text-wrap:balance}
h1 b{color:var(--red);font-weight:400}
.lead{font-size:15px;line-height:1.85;max-width:66ch;margin:10px 0 14px}
a{color:var(--blue);font-weight:700}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 18px}
.flow div{background:var(--sheet);border:2px solid var(--navy);padding:5px 10px;font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center}
.flow div b{background:var(--red);color:#fff;width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px}
.flow i{font-style:normal;color:var(--red);font-weight:900}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.case{background:var(--sheet);border:2px solid var(--navy);padding:10px 12px 12px;text-align:left;cursor:pointer;font-family:var(--f-body);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.case:hover{background:var(--soft)}
.case .no{font-size:11px;font-weight:900;color:var(--red);letter-spacing:.08em}
.case .fg svg{display:block;width:100%;height:auto;max-height:90px;border:1px solid var(--line)}
.case b{font-size:17px;font-weight:900}
.case .ds{font-size:12px;color:var(--muted)}
.case .st,.stars{color:var(--red);letter-spacing:.1em;font-size:16px}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;border-top:2px solid var(--navy);padding-top:12px;font-size:14px}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:12px}
.chead .no{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.08em}
.chead h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;color:var(--navy)}
section{background:var(--sheet);border:2px solid var(--navy);padding:10px 14px 14px;margin-bottom:14px;min-width:0}
section h3{font-size:14px;font-weight:900;color:var(--navy);margin:0 0 8px;display:flex;align-items:center;gap:8px}
section h3 span{background:var(--red);color:#fff;width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px}
.req p{font-size:15px;line-height:1.85;margin:0 0 6px}
.req .cl{font-size:12px;color:var(--muted);font-weight:700}
.req ul{margin:4px 0 0;padding-left:20px;font-size:14px;line-height:1.85;background:var(--soft);padding:6px 10px 6px 28px;border-left:4px solid var(--blue)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.cols section{margin-bottom:14px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.drw{position:sticky;top:56px}
@media (max-width:820px){.drw{position:static}}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.6}
.ip{display:block;margin-bottom:12px}
.ip>b{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.ip small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tg{font-size:10px;font-weight:900;padding:1px 6px;border:1.5px solid currentColor}
.tg.d{color:#fff;background:var(--red);border-color:var(--red)} .tg.c{color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opts button{font-family:var(--f-body);font-weight:700;font-size:13px;border:2px solid var(--navy);background:var(--sheet);color:var(--navy);padding:5px 10px;cursor:pointer;min-height:34px}
.opts button.on{background:var(--navy);color:var(--paper)}
#fig svg{display:block;width:100%;height:auto;border:1px solid var(--line)}
.calc table{width:100%;border-collapse:collapse;font-size:14px}
.calc td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.calc td.f{color:var(--muted)}
.calc td.v{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--navy)}
.mm{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.05em}
@media (max-width:560px){.calc tr{display:grid;grid-template-columns:1fr auto auto;column-gap:6px;border-bottom:1px solid var(--line);padding:5px 0}.calc td{border:0;padding:1px 2px}.calc td:first-child{grid-column:1/-1;font-weight:700}.calc td.f{grid-column:1}}
.ck{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.ck{grid-template-columns:minmax(0,1fr) 44px}.ck .gauge{grid-column:1/-1;grid-row:2}}
.ckl b{display:block;font-size:14px}.ckl span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge{position:relative;height:14px;background:var(--soft);border:1.5px solid var(--navy)}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.ck.ng .gauge i{background:var(--red)}
.gauge em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy)}
.ckv{font-weight:900;font-size:15px;text-align:center;padding:3px 0;color:#fff;background:var(--blue)}
.ck.ng .ckv{background:var(--red)}
.verdict{margin-top:10px;font-weight:900;font-size:15px;padding:8px 10px;border:2px solid var(--blue);color:var(--blue)}
.verdict.ng{border-color:var(--red);color:var(--red);background:#fdf0ef}
.cbox{display:flex;flex-wrap:wrap;gap:10px 30px}
.cbox small{display:block;font-size:12px;color:var(--muted)}.cbox b{font-size:17px}
.cost p{font-size:14px;line-height:1.8;margin:8px 0 0}
.ans summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:14px;margin-top:8px}
.ans p{background:var(--soft);padding:6px 10px}
.ulinks{display:flex;flex-wrap:wrap;gap:8px}
.ulinks a{border:2px solid var(--blue);padding:4px 10px;text-decoration:none;font-size:13px;background:var(--sheet)}
.real{font-size:14px;line-height:1.8;margin:10px 0 0;background:var(--paper);padding:8px 10px;border-left:4px solid var(--red)}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.b{font-family:var(--f-body);font-weight:900;font-size:14px;border:2px solid var(--navy);background:var(--sheet);color:var(--navy);padding:8px 14px;cursor:pointer}
.b.main{background:var(--red);border-color:var(--red);color:#fff}

.pctl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;margin-bottom:8px}.pctl>b{font-size:13px;padding-top:8px}
.pctl .opts{margin-top:0}.pctl .opts button{font-size:12px;min-height:30px;padding:3px 8px}
#plot svg{display:block;width:100%;max-width:640px;height:auto;border:1px solid var(--line)}
.pleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:6px}.pleg i{display:inline-block;width:14px;height:4px;margin-right:5px;vertical-align:middle}
.pnote{font-size:14px;margin:8px 0 0}
@media (max-width:560px){.pctl{grid-template-columns:1fr}.pctl>b{padding-top:2px}}
</style></head><body>

<script>
const URLS={"kozo": "../kozo/", "jiban": "../jiban/", "suiri": "../suiri/", "kozoR": "../kozo-riron/", "jibanR": "../jiban-riron/", "suiriR": "../suiri-riron/"};
const DC={n:'#12286B',r:'#C62422',b:'#3286BE',m:'#93BCD6',s:'#D8CFBE',g:'#5E6B86',w:'#fff'};

   return `<line x1="${x1}" y1="${y1}" x2="${x2-6*Math.cos(a)}" y2="${y2-6*Math.sin(a)}" stroke="${c}" stroke-width="${w}"/><polygon points="${x2},${y2} ${p1} ${p2}" fill="${c}"/>`; },
 T:(x,y,s,c=DC.n,fs=13,an='middle',b=700)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${fs}" font-weight="${b}" text-anchor="${an}" font-family="'Zen Kaku Gothic New',sans-serif">${s}</text>`,
 M:(x,y,s,c=DC.n,fs=15,an='middle')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${fs}" font-style="italic" font-weight="700" text-anchor="${an}" font-family="'Times New Roman',serif">${s}</text>`,
 R:(x,y,w,h,f=DC.m,st=DC.n,sw=2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`,

 C:(x,y,r,f=DC.w,st=DC.n,w=2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${st}" stroke-width="${w}"/>`,

 G:(x1,x2,y)=>{ let s=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${DC.n}" stroke-width="2"/>`; for(let x=x1+4;x<=x2;x+=7) s+=`<line x1="${x}" y1="${y}" x2="${x-6}" y2="${y+7}" stroke="${DC.n}" stroke-width="1"/>`; return s; },
 Pin:(x,y)=>dg.P(`M${x},${y} l-11,18 h22z`,DC.w)+dg.G(x-16,x+16,y+18),
 Rol:(x,y)=>dg.P(`M${x},${y} l-11,14 h22z`,DC.w)+dg.C(x-6,y+18,3.5)+dg.C(x+6,y+18,3.5)+dg.G(x-16,x+16,y+22),
 Fix:(x,y1,y2,side=-1)=>{ let s=dg.L(x,y1,x,y2,DC.n,3); for(let y=y1+3;y<=y2;y+=7) s+=dg.L(x,y,x+side*7,y+6,DC.n,1); return s; },
 W:(x1,x2,y,c=DC.r,n,lab)=>{ n=n||Math.max(3,Math.round((x2-x1)/22)); let s=dg.L(x1,y-28,x2,y-28,c,2); for(let i=0;i<=n;i++){ const x=x1+(x2-x1)*i/n; s+=dg.A(x,y-28,x,y-2,c,1.6);} return s+(lab?dg.M((x1+x2)/2,y-34,lab,c,14):''); },
 Dim:(x1,x2,y,lab,c=DC.n)=>dg.L(x1,y,x2,y,c,1.2)+dg.L(x1,y-6,x1,y+6,c,1.2)+dg.L(x2,y-6,x2,y+6,c,1.2)+`<rect x="${(x1+x2)/2-String(lab).length*4-4}" y="${y-9}" width="${String(lab).length*8+8}" height="16" fill="#fff"/>`+dg.M((x1+x2)/2,y+5,lab,c,14),
 Mo:(x,y,r,lab,ccw=false,c=DC.b)=>{ const s=ccw?0:1; const a0=-2.4,a1=1.4; const x0=x+r*Math.cos(a0),y0=y+r*Math.sin(a0),xe=x+r*Math.cos(a1),ye=y+r*Math.sin(a1);
   const [sx,sy,ex,ey]=ccw?[xe,ye,x0,y0]:[x0,y0,xe,ye]; const t=ccw?a0:a1; const tx=ccw?Math.sin(t):-Math.sin(t), ty=ccw?-Math.cos(t):Math.cos(t);
   return `<path d="M${sx},${sy} A${r},${r} 0 1 ${s} ${ex},${ey}" fill="none" stroke="${c}" stroke-width="2.2"/>`+dg.A(ex-tx*6,ey-ty*6,ex+tx*2,ey+ty*2,c,2.2)+(lab?dg.M(x+r+8,y-r+4,lab,c,14,'start'):''); },
};

const LAB={key:'suiri-jissen',h1:'水理学を、<b>本物の設計</b>で使う。',
 lead:'水路や水道管の設計者は、「あふれないか」「流れが速すぎて削られないか」「蛇口まで水が届くか」を確かめます。だめなら寸法を変えてやり直し、最後にいちばん経済的な案を選ぶ。この流れを、本物の案件で体験します。',
 note:'数値は学習用に簡略化しています（粗度係数・摩擦係数は代表値）。実際の設計は、土地改良事業計画設計基準・水道施設設計指針・下水道施設計画設計指針などに従います。',
 links:[['水理学ラボ（謎と問題）',URLS.suiri],['水理学 理論ラボ（体系図と導出）',URLS.suiriR]]};
const CASES=(()=>{ const {S,L,A,T,M,R,P,C,B,G,Dim}=dg; const n=DC.n,r=DC.r,b=DC.b;
// 長方形水路の等流水深をマニングの式から二分法で求める
const normalDepth=(Q,Bw,I,nn)=>{ let lo=0.001,hi=20; for(let k=0;k<80;k++){ const h=(lo+hi)/2, A_=Bw*h, R_=A_/(Bw+2*h); const q=A_/nn*R_**(2/3)*Math.sqrt(I); if(q>Q) hi=h; else lo=h; } return (lo+hi)/2; };
return [
{id:'canal',title:'田んぼの用水路',client:'○○土地改良区',
 thumb:S(160,70,P('M20,14 L40,60 L120,60 L140,14',DC.s,n,2),P('M30,38 L130,38 L120,60 L40,60Z',DC.m,'none',0),L(30,38,130,38,b,2)),
 story:'川から取った水を、田んぼまで運ぶ用水路をつくり直す。コンクリートの長方形水路にするか、安い土の水路にするか。あふれず、底や壁が削られない断面を決めよう。',
 req:['計画の流量 Q を、等流（同じ深さで流れ続ける）で流す','水面から壁の上端まで、余裕高 0.2 m 以上（波立ってもあふれない）','流速：0.6 m/s 以上（泥がたまらない）、コンクリートは 3.0 m/s 以下・土は 1.0 m/s 以下（削られない）','フルード数 Fr＜1（常流。波が立ちにくい）'],
 inputs:[{k:'Q',label:'計画の流量',opts:[[0.5,'0.5 m³/s'],[1,'1.0 m³/s'],[2,'2.0 m³/s']],def:1},{k:'I',label:'水路の勾配',opts:[[0.0005,'1/2000（ゆるい）'],[0.001,'1/1000'],[0.003,'1/333（急）']],def:0.001},{d:1,k:'mat',label:'水路の材料',help:'粗度係数 n：表面のざらざら。',opts:[['c','コンクリート（n＝0.015）'],['e','土のまま（n＝0.025）']],def:'c'},{d:1,k:'Bw',label:'水路の幅',opts:[[0.6,'0.6 m'],[0.8,'0.8 m'],[1.0,'1.0 m'],[1.5,'1.5 m'],[2.0,'2.0 m']],def:1.0},{d:1,k:'Hw',label:'壁の高さ',opts:[[0.6,'0.6 m'],[0.8,'0.8 m'],[1.0,'1.0 m'],[1.2,'1.2 m'],[1.5,'1.5 m']],def:1.0}],
 calc(s){ const nn=s.mat==='c'?0.015:0.025; const h=normalDepth(s.Q,s.Bw,s.I,nn); const A_=s.Bw*h, Pw=s.Bw+2*h, R_=A_/Pw, v=s.Q/A_, Fr=v/Math.sqrt(9.8*h); const fb=s.Hw-h; const vmax=s.mat==='c'?3.0:1.0;
   const cost=s.mat==='c'?(s.Bw+2*s.Hw)*0.15*60+s.Bw*5:(s.Bw+2*s.Hw)*8; // 千円/m
   return {rows:[['粗度係数',mm('n'),nn,''],['等流水深（マニングの式で Q が流れる深さ）',mm('Q＝A·(1/n)R<sup>2/3</sup>I<sup>1/2</sup>'),nf(h,3),'m'],['流れの断面積',mm('A＝B·h'),nf(A_,3),'m²'],['径深',mm('R＝A/(B＋2h)'),nf(R_,3),'m'],['流速',mm('v＝Q/A'),nf(v),'m/s'],['フルード数',mm('Fr＝v/√(gh)'),nf(Fr),''],['余裕高',mm('壁の高さ − h'),nf(fb,3),'m']],
     checks:[['あふれないか（余裕高）',0.2/Math.max(0.001,fb),0.2,fb>=0.2,`余裕 ${nf(fb,2)} ／ 必要 0.20 m`],['泥がたまらないか',0.6/v,0.6,v>=0.6,`流速 ${nf(v)} ／ 最低 0.6 m/s`],['削られないか',v/vmax,vmax,v<=vmax,`流速 ${nf(v)} ／ 上限 ${vmax} m/s`],['波が立たないか（常流）',Fr/1,1,Fr<1,`Fr ${nf(Fr)} ／ 1 未満`]],
     cost, costTxt:`約 ${nf(cost,1)} 千円/m`, h, v, Fr, fb};
 },
 fig(s,q){ const k=90, w=s.Bw*k, H=s.Hw*k, x0=170-w/2, yb=200; const hh=Math.min(q.h*k,H+20); const over=q.fb<0.2; const ec=s.mat==='e';
   return S(340,260,R(0,yb,340,40,DC.s,'none',0),R(0,yb-H-10,x0-12,H+10,DC.s,'none',0),R(x0+w+12,yb-H-10,340-x0-w-12,H+10,DC.s,'none',0),
     ec?'':R(x0-12,yb-H,12,H+12,'#e6e6e6',n,2)+R(x0+w,yb-H,12,H+12,'#e6e6e6',n,2)+R(x0-12,yb,w+24,12,'#e6e6e6',n,2),
     R(x0,yb-hh,w,hh,over?'#f6c9c7':DC.m,'none',0),L(x0,yb-hh,x0+w,yb-hh,over?r:b,2.5),
     Dim(x0,x0+w,yb+30,`B＝${s.Bw} m`),L(x0+w+22,yb-hh,x0+w+22,yb,b,1.2),M(x0+w+26,yb-hh/2+4,`h＝${nf(q.h,2)}`,b,13,'start'),L(x0-22,yb-H,x0-22,yb,n,1.2),M(x0-26,yb-H/2,`${s.Hw}`,n,13,'end'),
     T(170,24,over?'あふれる！':`流速 ${nf(q.v)} m/s`,over?r:b,15),T(170,44,q.Fr>=1?'射流：波が立つ':'常流：おだやか',q.Fr>=1?r:n,12));
 },
 links:[['等流のつりあい',URLS.suiriR+'#d-manning'],['マニングの式',URLS.suiriR+'#d-manning-1'],['限界水深とフルード数',URLS.suiriR+'#d-energy-1'],['水理学ラボ「等流」',URLS.suiri+'#u7']],

     checks:[['落差（流しきれるか）',h/0.5,0.5,h<=0.5,`${nf(h,2)} ／ 上限 0.50 m`],['滞留時間（分解する時間）',1/Math.max(T,1e-6),1,T>=1,`${nf(T,2)} ／ 必要 1 時間`],['表面積（微生物の量）',Sreq/Sa,Sreq,Sa>=Sreq,`${nf(Sa/1e4,1)} ／ 必要 ${nf(Sreq/1e4,1)} 万 m²`],['目詰まり（礫の大きさ）',dmin/s.d,dmin,s.d>=dmin,`${s.d*1000} ／ 最小 ${dmin*1000} mm`]],
     cost, costTxt:`礫 ${nf(Vol,0)} m³ ／ 約 ${nf(cost,1)} 百万円`, h, T, v, turb:bb*v*v/i};
 },
 fig(s,q){ const Lp=Math.min(260,s.Lb*1.3), Dp=s.Dp*40, x0=40, y0=60; const ok=q.h<=0.5; const rr=Math.max(2.2,s.d*60);
   let gr=''; for(let y=y0+rr;y<y0+Dp;y+=rr*2.1) for(let x=x0+rr+((Math.round((y-y0)/(rr*2.1))%2)?rr:0);x<x0+Lp;x+=rr*2.1) gr+=C(x,y,rr,DC.s,n,0.8);
   const hd=Math.min(40,q.h*60);
   return S(340,230,L(x0-30,y0-6,x0,y0-6,b,2.5),L(x0+Lp,y0-6+hd,x0+Lp+30,y0-6+hd,b,2.5),P(`M${x0},${y0-6} L${x0+Lp},${y0-6+hd}`,'none',ok?b:r,1.5,'5 4'),R(x0,y0,Lp,Dp,'#fff',n,1.5),gr,
     A(x0-28,y0+Dp/2,x0-4,y0+Dp/2,b,2),A(x0+Lp+4,y0+Dp/2,x0+Lp+28,y0+Dp/2,b,2),T(x0+Lp/2,y0-14,`落差 ${nf(q.h,2)} m`,ok?b:r,12),Dim(x0,x0+Lp,y0+Dp+24,`L＝${s.Lb} m`),
     T(170,y0+Dp+56,`滞留 ${nf(q.T,1)} 時間 ／ 渦の抵抗 ${nf(q.turb*100,0)}%`,n,12),T(170,y0+Dp+74,q.turb>0.5?'礫の中は、ほぼ乱流（i∝v²）':'礫の中は、ほぼダルシー流（i∝v）',q.turb>0.5?r:b,11));
 },
 links:[['粒の大きさで流れ方が変わる',URLS.suiriR+'#d-gravel-0'],['フォルヒハイマー則とエルガン式',URLS.suiriR+'#d-gravel-2'],['粒径別に同じ水を流す',URLS.suiriR+'#d-gravel-3'],['ダルシーの法則',URLS.jibanR+'#d-perm-0']],
 real:'日本では1980年代から、多摩川の支川（野川など）や江戸川などで礫間接触酸化施設がつくられ、BOD（汚れの量）を半分以下にしてきました。礫の層は、何年かで泥がたまるので、逆向きに水を流したり空気を吹き込んだりして洗います。下水道が整った今は、役目を終えた施設もあります。'},

// ---- 実践ラボ：本物を設計する流れ（依頼 → 条件 → 計算 → 照査 → 図面 → コスト） ----
const $=s=>document.querySelector(s);
const nf=(x,d=2)=>{ if(!isFinite(x)) return '—'; const a=Math.abs(x); const dd=a>=1000?0:a>=100?1:a>=10?d-1<0?0:Math.max(0,d-1):d; return (Math.round(x*10**dd)/10**dd).toLocaleString('ja-JP'); };
const mm=s=>`<span class="mm">${s}</span>`;
let JS={}; try{ JS=JSON.parse(localStorage.getItem(LAB.key)||'{}'); }catch(e){ JS={}; }
const jsave=()=>{ try{ localStorage.setItem(LAB.key,JSON.stringify(JS)); }catch(e){} };
function combos(c,base){ let out=[Object.assign({},base)]; c.inputs.filter(x=>x.d).forEach(inp=>{ const n=[]; out.forEach(o=>inp.opts.forEach(v=>n.push(Object.assign({},o,{[inp.k]:v[0]})))); out=n; }); return out; }
// 条件（d なし）は固定したまま、設計で決める項目（d:1）だけを総当たりして、最も安い安全な案を探す
function best(c,s){ const base={}; c.inputs.filter(x=>!x.d).forEach(x=>base[x.k]=s[x.k]); const key=JSON.stringify(base); c._best=c._best||{}; if(key in c._best) return c._best[key]; let bc=null; combos(c,base).forEach(t=>{ const r=c.calc(t); if(r.checks.every(x=>x[3])&&(!bc||r.cost<bc.cost)) bc={s:t,cost:r.cost}; }); return c._best[key]=bc; }
function stars(c){ return (JS[c.id]||{}).st||0; }
// ---- 諸量の変化のグラフ ----
const PCOLS=['#C62422','#3286BE','#12286B','#C8A02A','#4E9A5B','#8E5BB5'];
const numv=x=>{ const v=+String(x).replace(/,/g,''); return isFinite(v)?v:NaN; };
const PS={};
function niceTicks(lo,hi,n=5){ if(!(hi>lo)){ hi=lo+1; } const st=Math.pow(10,Math.floor(Math.log10((hi-lo)/n))); const err=(hi-lo)/n/st; const step=st*(err>=7.5?10:err>=3.5?5:err>=1.5?2:1); const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toPrecision(12)); return out; }
function drawPlot(c,s,r){
  const xs=c.inputs.filter(x=>x.opts.every(o=>typeof o[0]==='number')); if(!xs.length){ $('.plot').style.display='none'; return; }
  const st=PS[c.id]=PS[c.id]||{x:(xs.find(x=>x.d&&x.cont!==false)||xs[0]).k,y:'ck'};
  const ys=[['ck','照査の使用率'],...r.rows.map((row,i)=>[i,row[0]]).filter(([i])=>isFinite(numv(r.rows[i][2]))),['cost','コスト']];
  if(!ys.find(y=>String(y[0])===String(st.y))) st.y='ck';
  $('#px').innerHTML=xs.map(x=>`<button data-px="${x.k}" class="${x.k===st.x?'on':''}">${x.label}</button>`).join('');
  $('#py').innerHTML=ys.map(([k,l])=>`<button data-py="${k}" class="${String(k)===String(st.y)?'on':''}">${l}</button>`).join('');
  $('#px').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.x=b.dataset.px; drawPlot(c,s,c.calc(s)); });
  $('#py').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st.y=b.dataset.py; drawPlot(c,s,c.calc(s)); });
  const inp=c.inputs.find(x=>x.k===st.x); const vals=inp.opts.map(o=>o[0]); const disc=inp.cont===false;
  const lo=Math.min(...vals), hi=Math.max(...vals); const X=disc?vals:[...Array(61)].map((_,i)=>lo+(hi-lo)*i/60);
  const pts=X.map(x=>{ const t=Object.assign({},s,{[st.x]:x}); const rr=c.calc(t); return {x,rr,ok:rr.checks.every(z=>z[3])}; });
  let series;
  if(st.y==='ck') series=r.checks.map((ck,j)=>({name:ck[0],ys:pts.map(p=>p.rr.checks[j][1])}));
  else if(st.y==='cost') series=[{name:'コスト',ys:pts.map(p=>p.rr.cost)}];
  else { const i=+st.y; series=[{name:r.rows[i][0]+(r.rows[i][3]?`（${r.rows[i][3]}）`:''),ys:pts.map(p=>numv(p.rr.rows[i][2]))}]; }
  const W=340,H=230,l=46,rt=12,tp=14,bt=40; const all=series.flatMap(z=>z.ys).filter(isFinite); let y0=Math.min(0,...all), y1=Math.max(...all); if(st.y==='ck'){ y0=0; y1=Math.max(1.3,Math.min(5,y1)); }
  if(!(y1>y0)) y1=y0+1; y1+= (y1-y0)*0.05;
  const xi=disc?(v=>l+(W-l-rt)*(vals.indexOf(v)+0.5)/vals.length):(v=>l+(W-l-rt)*(v-lo)/((hi-lo)||1)); const yi=v=>tp+(H-tp-bt)*(1-(Math.min(y1,Math.max(y0,v))-y0)/(y1-y0));
  let g='';
  // OK band
  if(disc) pts.forEach(p=>{ if(p.ok){ const w=(W-l-rt)/vals.length; g+=`<rect x="${xi(p.x)-w/2}" y="${tp}" width="${w}" height="${H-tp-bt}" fill="#d7e6f1"/>`; } });
  else { let a=null; pts.forEach((p,i)=>{ if(p.ok&&a==null) a=p.x; if((!p.ok||i===pts.length-1)&&a!=null){ const e=p.ok?p.x:pts[i-1].x; g+=`<rect x="${xi(a)}" y="${tp}" width="${Math.max(2,xi(e)-xi(a))}" height="${H-tp-bt}" fill="#d7e6f1"/>`; a=null; } }); }
  niceTicks(y0,y1).forEach(v=>{ g+=`<line x1="${l}" x2="${W-rt}" y1="${yi(v)}" y2="${yi(v)}" stroke="#D9D6CC"/><text x="${l-5}" y="${yi(v)+4}" font-size="10" text-anchor="end" fill="#5E6B86">${nf(v)}</text>`; });
  if(st.y==='ck') g+=`<line x1="${l}" x2="${W-rt}" y1="${yi(1)}" y2="${yi(1)}" stroke="#C62422" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-rt}" y="${yi(1)-4}" font-size="10" text-anchor="end" fill="#C62422" font-weight="700">1.0（ここを超えると NG）</text>`;
  (disc?vals:niceTicks(lo,hi,4)).forEach(v=>{ const lab=disc?(inp.opts.find(o=>o[0]===v)[1]):nf(v); g+=`<text x="${xi(v)}" y="${H-bt+14}" font-size="10" text-anchor="middle" fill="#5E6B86">${lab}</text>`; });
  g+=`<line x1="${l}" x2="${W-rt}" y1="${H-bt}" y2="${H-bt}" stroke="#12286B"/><line x1="${l}" x2="${l}" y1="${tp}" y2="${H-bt}" stroke="#12286B"/><text x="${(l+W-rt)/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="#12286B" font-weight="700">${inp.label}</text>`;
  series.forEach((z,j)=>{ const col=PCOLS[j%PCOLS.length]; const pp=pts.map((p,i)=>[xi(p.x),yi(z.ys[i])]).filter((q,i)=>isFinite(z.ys[i]));
    g+=disc?pp.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${col}"/>`).join('')+`<polyline points="${pp.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3"/>`:`<polyline points="${pp.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    const cy=st.y==='ck'?r.checks[j][1]:st.y==='cost'?r.cost:numv(r.rows[+st.y][2]); if(isFinite(cy)) g+=`<circle cx="${xi(s[st.x])}" cy="${yi(cy)}" r="5.5" fill="#fff" stroke="${col}" stroke-width="3"/>`; });
  g+=`<line x1="${xi(s[st.x])}" x2="${xi(s[st.x])}" y1="${tp}" y2="${H-bt}" stroke="#12286B" stroke-dasharray="2 3"/>`;
  $('#plot').innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="pfig" role="img"><rect width="${W}" height="${H}" fill="#fff"/>${g}</svg><div class="pleg">${series.map((z,j)=>`<span><i style="background:${PCOLS[j%PCOLS.length]}"></i>${z.name}</span>`).join('')}</div>`;
  const okx=pts.filter(p=>p.ok).map(p=>p.x);
  $('#pnote').innerHTML=okx.length?`${inp.label}は、ほかが今のままなら <b>${disc?okx.map(v=>inp.opts.find(o=>o[0]===v)[1]).join('・'):nf(Math.min(...okx))+' 〜 '+nf(Math.max(...okx))}</b> で全部 OK。`:`${inp.label}だけを変えても、全部 OK にはなりません。ほかの条件も変えてみよう。`;
}
function home(){
  location.hash=''; const tot=CASES.reduce((a,c)=>a+stars(c),0);
  $('#crumb').textContent=''; $('#prog').textContent=`★ ${tot} / ${CASES.length*3}`;
  $('#main').innerHTML=`<h1>${LAB.h1}</h1><p class="lead">${LAB.lead}</p>
   <div class="flow">${['依頼を読む','条件を決める','計算する','照査する（安全か）','図面を見る','コストを比べる'].map((x,i)=>`<div><b>${i+1}</b>${x}</div>`).join('<i>→</i>')}</div>
   <div class="cgrid">${CASES.map((c,i)=>`<button class="case" data-c="${i}"><span class="no">案件 ${String(i+1).padStart(2,'0')}</span><span class="fg">${c.thumb||''}</span><b>${c.title}</b><span class="ds">${c.client}</span><span class="st">${'★'.repeat(stars(c))}${'☆'.repeat(3-stars(c))}</span></button>`).join('')}</div>
   <div class="links">${LAB.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} →</a>`).join('')}</div>
   <p class="foot">${LAB.note}</p>`;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openCase(+b.dataset.c));
  window.scrollTo(0,0);
}
function openCase(i){
  const c=CASES[i]; location.hash='c'+(i+1); $('#crumb').textContent=c.title;
  const s=Object.assign({},...c.inputs.map(x=>({[x.k]:x.def!=null?x.def:x.opts[0][0]})), (JS[c.id]||{}).s||{});
  $('#main').innerHTML=`<div class="chead"><span class="no">案件 ${String(i+1).padStart(2,'0')}</span><h2>${c.title}</h2></div>
   <section class="req"><h3><span>1</span>依頼</h3><p class="cl">依頼主：${c.client}</p><p>${c.story}</p><ul>${c.req.map(x=>`<li>${x}</li>`).join('')}</ul></section>
   <div class="cols"><section class="inp"><h3><span>2</span>条件を決める</h3><p class="hint">「条件」は現場で決まっていること。いろいろ変えて試せます。「設計で決める」が、あなたが選ぶ部材や寸法です。</p>${c.inputs.map(x=>`<label class="ip"><b><span class="tg ${x.d?'d':'c'}">${x.d?'設計で決める':'条件'}</span>${x.label}</b>${x.help?`<small>${x.help}</small>`:''}<div class="opts" data-k="${x.k}">${x.opts.map(o=>`<button data-v="${o[0]}" class="${s[x.k]==o[0]?'on':''}">${o[1]}</button>`).join('')}</div></label>`).join('')}</section>
   <section class="drw"><h3><span>5</span>図面</h3><div id="fig"></div></section></div>
   <section class="calc"><h3><span>3</span>計算する</h3><div id="rows"></div></section>
   <section class="chk"><h3><span>4</span>照査する（安全か）</h3><div id="checks"></div></section>
   <section class="cost"><h3><span>6</span>コストを比べる</h3><div id="cost"></div></section>
   <section class="plot"><h3><span>7</span>変えるとどうなる？（グラフ）</h3><p class="hint">横軸に条件を1つ選ぶと、ほかを今の値のままにして、その条件を少しずつ変えたときの変化を描きます。● が今の設計、青い帯が「全部 OK」になる範囲です。</p>
    <div class="pctl"><b>横軸</b><div class="opts" id="px"></div><b>縦軸</b><div class="opts" id="py"></div></div><div id="plot"></div><p class="pnote" id="pnote"></p></section>
   <section class="why"><h3>この設計で使った勉強</h3><div class="ulinks">${c.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('')}</div>${c.real?`<p class="real"><b>本物では：</b>${c.real}</p>`:''}</section>
   <div class="nav">${i>0?`<button class="b" id="pv">← 前の案件</button>`:''}<button class="b" id="hm">案件の一覧</button>${i<CASES.length-1?`<button class="b main" id="nx">次の案件 →</button>`:''}</div>`;
  const upd=()=>{ const r=c.calc(s); const ok=r.checks.every(x=>x[3]); const bc=best(c,s);
    $('#fig').innerHTML=c.fig(s,r);
    $('#rows').innerHTML=`<table>${r.rows.map(([l,f,v,u])=>`<tr><td>${l}</td><td class="f">${f}</td><td class="v">${v}</td><td>${u||''}</td></tr>`).join('')}</table>`;
    $('#checks').innerHTML=r.checks.map(([l,v,lim,okk,txt])=>{ const ratio=Math.max(0,Math.min(1.6,v)); return `<div class="ck ${okk?'ok':'ng'}"><div class="ckl"><b>${l}</b><span>${txt}</span></div><div class="gauge"><i style="width:${ratio/1.6*100}%"></i><em style="left:${1/1.6*100}%"></em></div><div class="ckv">${okk?'OK':'NG'}</div></div>`; }).join('')+`<div class="verdict ${ok?'ok':'ng'}">${ok?'すべて OK。この設計で安全です。':'NG があります。条件を変えて、全部 OK にしよう。'}</div>`;
    let st=0; if(ok){ st=2; if(bc&&r.cost<=bc.cost*1.0001) st=3; }
    else st=1;
    const prev=stars(c); JS[c.id]={s:Object.assign({},s),st:Math.max(prev,st)}; jsave(); $('#prog').textContent=`★ ${CASES.reduce((a,x)=>a+stars(x),0)} / ${CASES.length*3}`;
    drawPlot(c,s,r);
    $('#cost').innerHTML=`<div class="cbox"><div><small>この設計</small><b>${r.costTxt}</b></div><div><small>評価</small><b class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</b></div></div><p>${ok?(st===3?'<b>最も安い安全な設計です。</b>実務でも、安全を満たす中でいちばん経済的な案を選びます。':'安全ですが、もっと安くできる組み合わせがあります（★3は最安の安全な設計）。'):(bc?'まずは全部の照査を OK にしよう（★2）。':'<b>この条件では、どの部材を選んでも安全になりません。</b>実務なら、構造の形式そのものを見直します。条件を変えてみよう。')}</p>${bc&&!(ok&&st===3)?`<details class="ans"><summary>降参：最も安い安全な案を見る</summary><p>${c.inputs.filter(x=>x.d).map(x=>`${x.label}：<b>${(x.opts.find(o=>o[0]==bc.s[x.k])||[])[1]}</b>`).join('　')}</p></details>`:''}`;
  };
  document.querySelectorAll('.inp .opts').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=g.dataset.k; const v=b.dataset.v; s[k]=isNaN(+v)?v:+v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); upd(); }));
  upd();
  $('#hm').onclick=home; const pv=$('#pv'); if(pv) pv.onclick=()=>openCase(i-1); const nx=$('#nx'); if(nx) nx.onclick=()=>openCase(i+1);
  window.scrollTo(0,0);
}
$('#logo').onclick=()=>home();
function route(){ const mt=location.hash.match(/^#c(\d+)$/); if(mt&&CASES[+mt[1]-1]) openCase(+mt[1]-1); else home(); }
window.addEventListener('hashchange',()=>{ const mt=location.hash.match(/^#c(\d+)$/); if(mt){ const i=+mt[1]-1; if($('#crumb').textContent!==CASES[i].title) openCase(i);} });
route();
