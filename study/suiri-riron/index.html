<title>水理学 理論ラボ</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* Layout: a study hub. Home = syllabus grid of 16 units; unit view = key points (left) + generated problem card (right). Shared risograph palette of the lab series. */
:root{
  --paper:#F4F3EF; --ink:#1C3A7E; --navy:#12286B; --blue:#3286BE; --red:#C62422; --mid:#93BCD6;
  --sheet:#FFFFFF; --line:#D9D6CC; --muted:#5E6B86; --soft:#EAF2F8;
  --f-disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f-body)}
body{-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--navy)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.logo{font-family:var(--f-disp);font-size:18px;color:var(--navy);white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo b{color:var(--red);font-weight:400}
#crumb{font-weight:900;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,6vw,54px);line-height:1.1;margin:0;color:var(--navy);text-wrap:balance}
h1 b{color:var(--red);font-weight:400}
.lead{font-size:15px;line-height:1.8;max-width:64ch;margin:10px 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:var(--f-body);font-weight:900;font-size:13px;border:2px solid var(--navy);background:var(--sheet);color:var(--navy);padding:5px 12px;cursor:pointer}
.chip.on{background:var(--navy);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.unit{background:var(--sheet);border:2px solid var(--navy);padding:10px 12px 12px;text-align:left;cursor:pointer;font-family:var(--f-body);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.unit .no{font-size:11px;font-weight:900;color:var(--red);letter-spacing:.08em;display:flex;justify-content:space-between;gap:6px}
.unit .nm{font-weight:900;font-size:17px}
.unit .ds{font-size:12px;color:var(--muted);line-height:1.6}
.unit .bar{height:5px;background:var(--line);margin-top:6px}
.unit .bar i{display:block;height:100%;background:var(--blue)}
.tag{font-size:10px;font-weight:900;padding:0 5px;border:1.5px solid currentColor;letter-spacing:0}
.tag.k{color:var(--red)} .tag.d{color:var(--blue)} .tag.c{color:var(--muted)}
.games{margin-top:22px;border-top:2px solid var(--navy);padding-top:12px}
.games h2{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:0 0 8px;color:var(--navy)}
.games ul{margin:0;padding-left:18px;line-height:1.9;font-size:14px}
a{color:var(--blue);font-weight:700}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}
/* unit view */
.uhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:12px}
.uhead h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;color:var(--navy)}
.ucols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:18px;align-items:start}
@media (max-width:820px){.ucols{grid-template-columns:minmax(0,1fr)}.pcard{order:-1}}
.points{background:var(--sheet);border:2px solid var(--navy);padding:10px 14px}
.points h3,.pcard h3{font-size:13px;font-weight:900;color:var(--red);letter-spacing:.06em;margin:0 0 6px}
.points ul{margin:0;padding-left:18px;font-size:14px;line-height:1.85}
.points li{margin-bottom:2px}
.f{font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:700;font-size:1.08em;white-space:nowrap}
.life{margin-top:10px;border-top:2px solid var(--navy);padding-top:6px}
.life h3{margin:6px 0 4px!important}
.life p{margin:0;font-size:14px;line-height:1.8;background:var(--soft);padding:6px 9px;border-left:4px solid var(--blue)}
.points .game{margin-top:8px;font-size:13px;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.pcard{background:var(--sheet);border:2px solid var(--navy);padding:10px 14px 14px}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.types .chip{font-size:12px;padding:3px 9px}
.fig{background:var(--paper);border:1.5px solid var(--line);margin:4px 0 8px}
.fig svg{display:block;width:100%;height:auto;max-height:300px}
.q{font-size:15px;line-height:1.8;margin:0 0 8px}
.ansrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:6px 0}
.ansrow label{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.ansrow input{font-family:var(--f-body);font-size:17px;font-weight:700;width:110px;padding:5px 8px;border:2px solid var(--navy);background:var(--paper);color:var(--ink)}
.ansrow input.ok{border-color:var(--red);background:#FBEDEC}
.ansrow input.ng{border-color:var(--muted);background:#EEEFF3}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button.b{font-family:var(--f-body);font-weight:900;font-size:14px;border:2px solid var(--navy);background:var(--paper);color:var(--navy);padding:7px 14px;cursor:pointer;min-height:38px}
button.b.main{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,input:focus-visible,.unit:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.res{font-family:var(--f-disp);font-size:20px;margin-top:8px}
.res.ok{color:var(--red)} .res.ng{color:var(--muted)}
.sol{margin-top:8px;border-left:4px solid var(--blue);padding:4px 0 4px 10px;font-size:14px;line-height:1.85}
.sol b{color:var(--navy)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:520px){.logo{font-size:15px}}
.nqmwrap{margin-top:12px;border-top:2px solid var(--navy);padding-top:8px}
.nqmwrap h3{font-size:13px;font-weight:900;color:var(--red);letter-spacing:.06em;margin:0 0 4px}
.nqm{display:grid;gap:6px}
.dgm{background:var(--paper);border:1.5px solid var(--line);padding:4px 6px}
.dgt{font-weight:900;font-size:13px}.dgt small{font-weight:700;color:var(--muted);font-size:11px;margin-left:4px}
.dgm svg{display:block;width:100%;height:auto;max-height:320px}
.dgm.flat svg{max-height:60px}
.pf{margin-top:10px;border-top:2px solid var(--navy);padding-top:6px}
.pf h3{margin:6px 0 2px!important}.pf .pfl{margin:0 0 6px;font-size:12px;color:#5E6B86}
.pf details{border:1.5px solid var(--navy);background:#fff;margin:5px 0}
.pf summary{cursor:pointer;padding:6px 9px;font-weight:700;font-size:14px;color:var(--navy)}
.pf details[open] summary{background:var(--soft);border-bottom:1px solid var(--mid)}
.pf .pfb .f{white-space:normal;font-style:normal}
.pf .pfb{padding:8px 10px;font-size:14px;line-height:1.9}
.pf .pff svg{display:block;width:100%;max-width:320px;margin:0 auto 6px;border:1px solid var(--mid)}
.miss{border:3px solid var(--red);background:#fdf3f2;padding:8px 10px;margin-bottom:10px}
.miss h3{margin:0 0 4px!important;color:var(--red)!important;font-size:14px}
.mlink{display:block;text-decoration:none;color:var(--ink);padding:5px 0;border-top:1px dashed #e3b5b3}
.mlink:first-of-type{border-top:0}.mlink b{display:block;color:var(--navy);font-size:14px}.mlink span{font-size:12.5px;line-height:1.6;display:block}
.mlink:hover b{text-decoration:underline}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.xcard{background:var(--sheet);border:2px solid var(--red);padding:10px 14px 12px}
.xw h3{font-size:16px!important;font-weight:900;color:var(--navy)!important;margin:0 0 4px!important;letter-spacing:0!important}
.xw h3::before{content:"体験";font-size:11px;color:#fff;background:var(--red);padding:1px 6px;margin-right:8px;vertical-align:2px}
.xlead{font-size:13px;line-height:1.75;margin:0 0 6px;color:var(--ink)}
.xfig{background:var(--paper);border:1.5px solid var(--line)}
.xfig svg{display:block;width:100%;height:auto;max-height:340px}
.xfig .two{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);gap:4px}
.xctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px;margin:8px 0 4px}
.xs{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 8px;font-size:12px;font-weight:700}
.xs span{grid-column:1/-1;color:var(--muted)}
.xs input[type=range]{width:100%;accent-color:var(--red);min-width:0}
.xs b{font-size:13px;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.xs select{grid-column:1/-1;font-family:var(--f-body);font-weight:700;font-size:13px;border:1.5px solid var(--navy);background:var(--sheet);color:var(--ink);padding:3px}
.xctl .b{align-self:end;justify-self:start}
.kv{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 14px;font-size:13px;margin:6px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted);font-weight:700}.kv b{color:var(--navy)}.kv b.ng{color:var(--red)}
.xnote{font-size:13px;line-height:1.8;margin:4px 0 0;background:var(--soft);padding:6px 9px;border-left:4px solid var(--blue)}
.warn{font-size:13px;font-weight:700;color:var(--red);margin:6px 0}
@media (max-width:820px){.rcol{order:-1}}

</style>

<header>
  <button class="logo" id="logo" title="目次へ">水理学<b>理論ラボ</b></button>
  <div id="crumb"></div>
  <div id="prog"></div>
</header>
<main id="main"></main>

<script>
"use strict";
// ================= helpers =================
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function nf(x,dd){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const a=Math.abs(x); let d= dd!=null? dd : (a>=1000?0: a>=100?1: a>=1?2: 3); let s=(Math.round(x*10**d)/10**d).toString(); if(s==='-0') s='0'; return s; }
const F=s=>`<span class="f">${String(s).replace(/_([A-Za-z0-9\u4e00-\u9fff]+)/g,'<sub>$1</sub>')}</span>`;
const sq=x=>x*x, cube=x=>x*x*x;
const PI=Math.PI;

// ================= SVG figure builder (world coords, y up) =================
function Fig(x0,y0,x1,y1,W=520){
  const s=W/(x1-x0), H=Math.round((y1-y0)*s); const out=[];
  const X=x=>((x-x0)*s).toFixed(1), Y=y=>((y1-y)*s).toFixed(1);
  const col={n:'#12286B',r:'#C62422',b:'#3286BE',m:'#5E6B86',g:'#B9AD95',e:'#D8CFBE'};
  const o={
    s,
    line(a,b,c,d,w=5,cl='n',dash){ out.push(`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col[cl]||cl}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`); return o; },
    poly(pts,cl='n',w=5,fill='none'){ out.push(`<polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="${fill}" stroke="${col[cl]||cl}" stroke-width="${w}" stroke-linejoin="round"/>`); return o; },
    rect(x,y,w,h,fill='#12286B',stroke='none'){ out.push(`<rect x="${X(x)}" y="${Y(y+h)}" width="${(w*s).toFixed(1)}" height="${(h*s).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`); return o; },
    circ(x,y,r,fill='#fff',cl='n',w=2.5){ out.push(`<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${fill}" stroke="${col[cl]||cl}" stroke-width="${w}"/>`); return o; },
    text(x,y,t,cl='n',size=14,anchor='middle',dy=0){ out.push(`<text x="${X(x)}" y="${(+Y(y)+dy).toFixed(1)}" fill="${col[cl]||cl}" font-size="${size}" font-weight="900" text-anchor="${anchor}" dominant-baseline="middle" font-family="Zen Kaku Gothic New, sans-serif">${t}</text>`); return o; },
    // support at (x,y): pin, roller, fixedL/fixedR (wall), fixedB (ground)
    sup(t,x,y){ const px=+X(x), py=+Y(y), u=13;
      if(t==='pin'||t==='roller'){ out.push(`<path d="M${px},${py+3} L${px-u},${py+u*1.5} L${px+u},${py+u*1.5}Z" fill="#12286B"/>`);
        if(t==='roller') out.push(`<circle cx="${px-u*.55}" cy="${py+u*1.5+4}" r="3.5" fill="#12286B"/><circle cx="${px+u*.55}" cy="${py+u*1.5+4}" r="3.5" fill="#12286B"/>`);
        const yb=py+u*1.5+(t==='roller'?8:0); out.push(`<line x1="${px-u*1.4}" y1="${yb+1}" x2="${px+u*1.4}" y2="${yb+1}" stroke="#12286B" stroke-width="3"/>`); for(let i=-3;i<=2;i++) out.push(`<line x1="${px+i*8}" y1="${yb+3}" x2="${px+i*8+6}" y2="${yb+9}" stroke="#B9AD95" stroke-width="1.5"/>`); }
      else if(t==='fixedL'||t==='fixedR'){ const d=t==='fixedL'?-1:1; out.push(`<line x1="${px}" y1="${py-22}" x2="${px}" y2="${py+22}" stroke="#12286B" stroke-width="3.5"/>`); for(let i=-22;i<20;i+=7) out.push(`<line x1="${px}" y1="${py+i}" x2="${px+d*9}" y2="${py+i+7}" stroke="#B9AD95" stroke-width="1.5"/>`); }
      else if(t==='fixedB'){ out.push(`<line x1="${px-20}" y1="${py}" x2="${px+20}" y2="${py}" stroke="#12286B" stroke-width="3.5"/>`); for(let i=-20;i<18;i+=7) out.push(`<line x1="${px+i}" y1="${py+2}" x2="${px+i+7}" y2="${py+10}" stroke="#B9AD95" stroke-width="1.5"/>`); }
      return o; },
    hinge(x,y){ return o.circ(x,y,5.5,'#fff','n',2.5); },
    node(x,y){ return o.circ(x,y,4,'#12286B','n',1); },
    // arrow ending at (x,y) with direction (dx,dy) world; length in px
    P(x,y,dx,dy,label,cl='r',len=46,lp='tail'){ const px=+X(x),py=+Y(y), d=Math.hypot(dx,dy), ux=dx/d, uy=-dy/d; const tx=px-ux*len, ty=py-uy*len;
      out.push(`<line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${(px-ux*7).toFixed(1)}" y2="${(py-uy*7).toFixed(1)}" stroke="${col[cl]}" stroke-width="3"/>`);
      const a=Math.atan2(uy,ux); out.push(`<path d="M${px},${py} L${(px-11*Math.cos(a-.42)).toFixed(1)},${(py-11*Math.sin(a-.42)).toFixed(1)} L${(px-11*Math.cos(a+.42)).toFixed(1)},${(py-11*Math.sin(a+.42)).toFixed(1)}Z" fill="${col[cl]}"/>`);
      if(label){ const lx=tx-ux*12, ly=ty-uy*12; out.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${col[cl]}" font-size="14" font-weight="900" text-anchor="${Math.abs(ux)>.5?(ux>0?'end':'start'):'middle'}" dominant-baseline="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); }
      return o; },
    W(xa,xb,y,label,h=.9,cl='r',tri=false){ const n=Math.max(4,Math.round((xb-xa)*s/34)); const top=[]; for(let i=0;i<=n;i++){ const x=xa+(xb-xa)*i/n, hh= tri? h*i/n : h; if(hh*s>8) o.P(x,y,0,-1,null,cl,hh*s,'tail'); top.push([x,y+hh]); }
      o.poly(top,cl,2); if(label) o.text((xa+xb)/2+(tri?(xb-xa)*.12:0),y+h+(16/s),label,cl,14); return o; },
    M(x,y,cw,label,cl='r'){ const px=+X(x),py=+Y(y),r=20; const a0=cw?200:-20, a1=cw?-20:200; const p=a=>[px+r*Math.cos(a*PI/180),py-r*Math.sin(a*PI/180)];
      const [sx,sy]=p(cw?160:20),[ex,ey]=p(cw?20:160); out.push(`<path d="M${sx.toFixed(1)},${sy.toFixed(1)} A${r},${r} 0 0 ${cw?1:0} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${col[cl]}" stroke-width="3"/>`);
      const tx= cw? 1:-1; out.push(`<path d="M${ex.toFixed(1)},${ey.toFixed(1)} l${(-7*tx).toFixed(1)},-9 l${(9*tx).toFixed(1)},-1Z" fill="${col[cl]}"/>`);
      if(label) out.push(`<text x="${px}" y="${py-r-12}" fill="${col[cl]}" font-size="14" font-weight="900" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); return o; },
    dim(xa,xb,y,label){ const a=+X(xa),b=+X(xb),yy=+Y(y); out.push(`<line x1="${a}" y1="${yy}" x2="${b}" y2="${yy}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${a}" y1="${yy-6}" x2="${a}" y2="${yy+6}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${b}" y1="${yy-6}" x2="${b}" y2="${yy+6}" stroke="#5E6B86" stroke-width="1.2"/>`);
      out.push(`<text x="${(a+b)/2}" y="${yy-8}" fill="#5E6B86" font-size="13" font-weight="700" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); return o; },
    dimV(x,ya,yb,label){ const xx=+X(x),a=+Y(ya),b=+Y(yb); out.push(`<line x1="${xx}" y1="${a}" x2="${xx}" y2="${b}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${xx-6}" y1="${a}" x2="${xx+6}" y2="${a}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${xx-6}" y1="${b}" x2="${xx+6}" y2="${b}" stroke="#5E6B86" stroke-width="1.2"/>`);
      out.push(`<text x="${xx-8}" y="${(a+b)/2}" fill="#5E6B86" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); return o; },
    raw(sv){ out.push(sv); return o; },
    svg(){ return `<svg viewBox="-30 -30 ${W+60} ${H+60}" xmlns="http://www.w3.org/2000/svg" role="img">${out.join('')}</svg>`; },
    X,Y
  };
  return o;
}
// common beam figure: supports [{x,t}], loads, dims
let lastBeam=null;
function beamDia(L,sups,loads,opt){ const ext=opt.ext||0; if((opt.dims||[]).some(d=>String(d[2]).includes('k='))) return null;
  const st={pts:[[0,0],[L+ext,0]],sup:[],hinges:[],loads:[]};
  for(const s of sups){ if(s.t==='hinge') st.hinges.push(s.x); else st.sup.push({s:s.x,t:s.t.startsWith('fixed')?'fixed':s.t,lab:s.lab||''}); }
  for(const l of loads){ const v=parseFloat(String(l.label).replace(/^[^0-9.\-]*/,'')); if(!isFinite(v)||l.tri) return null;
    if(l.t==='P') st.loads.push({k:'P',s:l.x,v,dir:'down'}); else if(l.t==='w') st.loads.push({k:'w',s0:l.x0,s1:l.x1,v,dir:'down'}); else if(l.t==='M') st.loads.push({k:'M',s:l.x,v:l.cw?v:-v}); }
  const ok=[...st.sup.map(x=>x.s),...st.hinges,...st.loads.flatMap(l=>l.k==='w'?[l.s0,l.s1]:[l.s])].every(x=>Math.abs(x*4-Math.round(x*4))<1e-9); return ok?st:null; }
function beamFig(L,sups,loads,opt={}){
  lastBeam=beamDia(L,sups,loads,opt);
  const ext=opt.ext||0; const f=Fig(-.6,-1.6,L+ext+.6,2.4);
  f.line(0,0,L+ext,0,7);
  for(const s of sups){ if(s.t==='hinge') f.hinge(s.x,0); else f.sup(s.t,s.x,0); if(s.lab) f.text(s.x,0,s.lab,'n',14,'middle',s.t==='fixedL'?-30:44); }

const XW={};
function xwBase(root,title,lead){ root.innerHTML=`<div class="xw"><h3>${title}</h3>${lead?`<p class="xlead">${lead}</p>`:''}<div class="xfig"></div><div class="xctl"></div><div class="xout"></div></div>`;
  return {fig:root.querySelector('.xfig'),ctl:root.querySelector('.xctl'),out:root.querySelector('.xout')}; }
function xwSliders(el,defs,on){ const st={}; el.innerHTML=defs.map(d=>{ st[d.k]=d.v; return d.opts? `<label class="xs"><span>${d.l}</span><select data-k="${d.k}">${d.opts.map(o=>`<option value="${o[0]}" ${o[0]===d.v?'selected':''}>${o[1]}</option>`).join('')}</select></label>`
   : `<label class="xs"><span>${d.l}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}" data-k="${d.k}"><b data-o="${d.k}"></b></label>`; }).join('');
  const fmt=d=>{ const v=st[d.k]; return (d.f?d.f(v):nf(v))+(d.u?' '+d.u:''); };
  const upd=()=>{ defs.forEach(d=>{ const o=el.querySelector(`[data-o="${d.k}"]`); if(o) o.textContent=fmt(d); }); on(st); };
  el.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{ const d=defs.find(x=>x.k===inp.dataset.k); st[d.k]= d.opts? (isNaN(+inp.value)?inp.value:+inp.value) : +inp.value; upd(); }));
  queueMicrotask(upd); return st; }
function axes(o){ // {W,H,x0,x1,y0,y1,xl,yl,ml,mb,mt,mr,yDown,xt,yt}
  const ml=o.ml??48, mr=o.mr??14, mt=o.mt??14, mb=o.mb??34; const W=o.W||520,H=o.H||300;
  const X=x=>ml+(x-o.x0)/(o.x1-o.x0)*(W-ml-mr); const Y= o.yDown? (y=>mt+(y-o.y0)/(o.y1-o.y0)*(H-mt-mb)) : (y=>H-mb-(y-o.y0)/(o.y1-o.y0)*(H-mt-mb));
  let s=`<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" fill="#fff" stroke="#D9D6CC"/>`;
  (o.xt||[]).forEach(t=>{ s+=`<line x1="${X(t)}" y1="${mt}" x2="${X(t)}" y2="${H-mb}" stroke="#EEE" /><text x="${X(t)}" y="${H-mb+14}" font-size="11" fill="#5E6B86" text-anchor="middle">${t}</text>`; });
  (o.yt||[]).forEach(t=>{ s+=`<line x1="${ml}" y1="${Y(t)}" x2="${W-mr}" y2="${Y(t)}" stroke="#EEE" /><text x="${ml-5}" y="${Y(t)+4}" font-size="11" fill="#5E6B86" text-anchor="end">${t}</text>`; });
  if(o.xl) s+=`<text x="${(ml+W-mr)/2}" y="${H-4}" font-size="12" font-weight="700" fill="#5E6B86" text-anchor="middle">${o.xl}</text>`;
  if(o.yl) s+=`<text x="12" y="${(mt+H-mb)/2}" font-size="12" font-weight="700" fill="#5E6B86" text-anchor="middle" transform="rotate(-90 12 ${(mt+H-mb)/2})">${o.yl}</text>`;
  return {X,Y,s,W,H,ml,mr,mt,mb}; }
const svgWrap=(W,H,s)=>`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Zen Kaku Gothic New, sans-serif">${s}</svg>`;
const pl=(pts,X,Y,cl='#12286B',w=2.5,dash)=>`<polyline points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${cl}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`;
const tx=(x,y,t,cl='#12286B',sz=12,an='middle',w=900)=>`<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${cl}" font-size="${sz}" font-weight="${w}" text-anchor="${an}" dominant-baseline="middle" paint-order="stroke" stroke="#fff" stroke-width="3">${t}</text>`;
const ar=(x1,y1,x2,y2,cl='#C62422',w=2.5)=>{ const a=Math.atan2(y2-y1,x2-x1); return `<line x1="${x1}" y1="${y1}" x2="${x2-8*Math.cos(a)}" y2="${y2-8*Math.sin(a)}" stroke="${cl}" stroke-width="${w}"/><path d="M${x2},${y2} L${x2-11*Math.cos(a-.4)},${y2-11*Math.sin(a-.4)} L${x2-11*Math.cos(a+.4)},${y2-11*Math.sin(a+.4)}Z" fill="${cl}"/>`; };
const D2R=Math.PI/180;
// 水面記号：▽（頂点が水面）と水面下の短い2本線
const wsm=(x,y,c='#3286BE')=>`<g class="wsm"><path d="M${(x-8).toFixed(1)},${(y-13).toFixed(1)} L${(x+8).toFixed(1)},${(y-13).toFixed(1)} L${(+x).toFixed(1)},${(y-1).toFixed(1)}Z" fill="#fff" stroke="${c}" stroke-width="1.8"/><line x1="${(x-9).toFixed(1)}" y1="${(y+4).toFixed(1)}" x2="${(x+9).toFixed(1)}" y2="${(y+4).toFixed(1)}" stroke="${c}" stroke-width="1.6"/><line x1="${(x-5).toFixed(1)}" y1="${(y+8).toFixed(1)}" x2="${(x+5).toFixed(1)}" y2="${(y+8).toFixed(1)}" stroke="${c}" stroke-width="1.6"/></g>`;
// 地盤記号：線と、土の側（side=1：進行方向の右）への斜線
const gnd=(x1,y1,x2,y2,side=1,c='#12286B',step=9)=>{ const L=Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/L, uy=(y2-y1)/L; const nx=-uy*side, ny=ux*side; let s=`<line x1="${(+x1).toFixed(1)}" y1="${(+y1).toFixed(1)}" x2="${(+x2).toFixed(1)}" y2="${(+y2).toFixed(1)}" stroke="${c}" stroke-width="2.2"/>`;
  for(let d=5;d<L-1;d+=step){ const px=x1+ux*d, py=y1+uy*d; s+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(px+nx*6-ux*6).toFixed(1)}" y2="${(py+ny*6-uy*6).toFixed(1)}" stroke="${c}" stroke-width="1.1"/>`; } return s; };

// ================= 水理学 体験 =================
XW.hydrostatic=root=>{ const b=xwBase(root,'深さと水圧','水槽の中の点◯を動かすと、その点の水圧が出ます。壁の青い三角形は、深さごとの水圧の大きさです。');
  xwSliders(b.ctl,[{k:'H',l:'水深 H',min:1,max:10,step:.5,v:6,u:'m'},{k:'z',l:'点の深さ',min:0,max:10,step:.25,v:3,u:'m'},{k:'liq',l:'液体',v:1,opts:[[1,'水（比重1.0）'],[.8,'油（比重0.8）'],[1.03,'海水（比重1.03）'],[13.6,'水銀（比重13.6）']]}],st=>{
   const z=Math.min(st.z,st.H), W=520,H=300, sc=250/10, x0=150,y0=20+(10-st.H)*sc; let s=`<rect x="${x0}" y="20" width="260" height="${250}" fill="none" stroke="#12286B" stroke-width="3"/><rect x="${x0}" y="${y0}" width="260" height="${st.H*sc}" fill="${st.liq>10?'#C0C4CC':'#93BCD6'}"/>`;
   const pm=st.liq*9.8*st.H, wmax=110; s+=`<polygon points="${x0},${y0} ${x0-wmax},${y0+st.H*sc} ${x0},${y0+st.H*sc}" fill="rgba(50,134,190,.3)" stroke="#3286BE" stroke-width="2"/>`;
   for(let k=1;k<=5;k++){ const yy=y0+st.H*sc*k/5; s+=ar(x0-wmax*k/5-2,yy,x0,yy,'#3286BE',1.5); }
   const pz=st.liq*9.8*z; s+=`<circle cx="${x0+150}" cy="${y0+z*sc}" r="7" fill="#fff" stroke="#C62422" stroke-width="3"/>`+tx(x0+165,y0+z*sc,`p＝${nf(pz)} kN/m²`,'#C62422',13,'start');
   [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>s+=ar(x0+150-d[0]*30,y0+z*sc-d[1]*30,x0+150-d[0]*10,y0+z*sc-d[1]*10,'#C62422',2));
   s+=tx(x0-wmax/2,y0+st.H*sc+14,`底 ${nf(pm)} kN/m²`,'#3286BE',12);
   s+=wsm(x0+225,y0); b.fig.innerHTML=svgWrap(W,H+10,s);
   b.out.innerHTML=`<p class="xnote">水圧は深さに比例し、どの向きにも同じ大きさで押す（赤い矢印）。水深10 m で約98 kN/m²、1 m² の面に約10トンの重さに相当する力。ダムや水門、地下室の壁はこの三角形の圧力で設計する。潜水で耳が痛くなるのも同じ。</p>`; }); };

XW.force=root=>{ const b=xwBase(root,'水門にかかる力と作用点','水深を変えると、全水圧の大きさと作用点（赤い矢印）が変わります。下流側にも水があると差し引きになります。');
  xwSliders(b.ctl,[{k:'H1',l:'上流の水深',min:1,max:8,step:.25,v:5,u:'m'},{k:'H2',l:'下流の水深',min:0,max:8,step:.25,v:0,u:'m'},{k:'B',l:'水門の幅',min:1,max:10,step:.5,v:3,u:'m'}],st=>{
   const H2=Math.min(st.H2,st.H1), P1=.5*9.8*st.H1**2*st.B, P2=.5*9.8*H2**2*st.B, P=P1-P2; const y=(P1*st.H1/3-P2*H2/3)/(P||1);
   const W=520,H=290,sc=30,gx=260,gy=270; let s=`<rect x="${gx-120}" y="${gy-st.H1*sc}" width="120" height="${st.H1*sc}" fill="#93BCD6"/><rect x="${gx+10}" y="${gy-H2*sc}" width="150" height="${H2*sc}" fill="#93BCD6"/><rect x="${gx}" y="${gy-8.5*sc}" width="10" height="${8.5*sc}" fill="#12286B"/><line x1="40" y1="${gy}" x2="480" y2="${gy}" stroke="#12286B" stroke-width="2"/>`;
   const k=10; s+=`<polygon points="${gx},${gy-st.H1*sc} ${gx-st.H1*k},${gy} ${gx},${gy}" fill="rgba(198,36,34,.2)" stroke="#C62422"/>`; if(H2>0) s+=`<polygon points="${gx+10},${gy-H2*sc} ${gx+10+H2*k},${gy} ${gx+10},${gy}" fill="rgba(198,36,34,.2)" stroke="#C62422"/>`;
   if(P>1e-6) s+=ar(gx-110,gy-y*sc,gx-2,gy-y*sc,'#C62422',4)+tx(gx-114,gy-y*sc,`${nf(P)} kN`,'#C62422',14,'end');
   s+=tx(gx+30,gy-y*sc,`底から ${nf(y)} m`,'#C62422',12,'start');
   s+=wsm(gx-60,gy-st.H1*sc); if(H2>0.1) s+=wsm(gx+120,gy-H2*sc); s+=gnd(40,gy,gx,gy)+gnd(gx+10,gy,480,gy); b.fig.innerHTML=svgWrap(W,H,s);
   b.out.innerHTML=`<div class="kv"><span>上流側 ½ρgH₁²B</span><b>${nf(P1)} kN</b><span>下流側</span><b>${nf(P2)} kN</b><span>正味の力</span><b>${nf(P)} kN</b></div><p class="xnote">水深が2倍になると力は4倍（${F('H²')} に比例）。作用点は底から H/3 で、水門の下の方ほど強く押される。洪水時に水門を開け閉めするのが重いのも、ダムの下ほど分厚いのもこのため。</p>`; }); };

XW.buoy=root=>{ const b=xwBase(root,'浮かんだ箱は、傾いても戻る？','箱を傾けると、沈んだ部分の中心（浮心 B）が移動します。重心 G より上にメタセンタ M があれば元に戻ります。');
  xwSliders(b.ctl,[{k:'Bw',l:'箱の幅',min:2,max:8,step:.25,v:5,u:'m'},{k:'r',l:'箱の比重（重さ）',min:.2,max:.8,step:.02,v:.5},{k:'KG',l:'重心の高さ（底から）',min:.5,max:4,step:.1,v:1.5,u:'m'},{k:'th',l:'傾ける角度',min:0,max:20,step:1,v:10,u:'°'}],st=>{
   const Hh=4, d=st.r*Hh, KB=d/2, BM=st.Bw**2/(12*d), GM=KB+BM-st.KG; const th=st.th*D2R; const ok=GM>0;
   const W=520,H=300,sc=28, cx=260, wl=170;    // box in body coords: x in [-B/2,B/2], y from 0 (bottom) to H; place so that bottom at depth d (approx)
   const P=(x,y)=>{ const yy=y-d; const X=x*Math.cos(th)-yy*Math.sin(th), Y=x*Math.sin(th)+yy*Math.cos(th); return [cx+X*sc, wl-Y*sc]; };
   let s=`<rect x="0" y="${wl}" width="${W}" height="${H-wl}" fill="#93BCD6"/>`; const c=[P(-st.Bw/2,0),P(st.Bw/2,0),P(st.Bw/2,Hh),P(-st.Bw/2,Hh)];
   s+=`<polygon points="${c.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="rgba(216,207,190,.9)" stroke="#12286B" stroke-width="3"/>`;
   const G=P(0,st.KG); const Bu=P(0,KB); const Mw=P(0,KB+BM); const Bx=Mw[0], By=Bu[1];
   s+=`<line x1="${Bx}" y1="${By}" x2="${Bx}" y2="${By-120}" stroke="#3286BE" stroke-dasharray="5 4"/>`;
   s+=ar(G[0],G[1]-2,G[0],G[1]+50,'#C62422',3)+tx(G[0]-10,G[1],'G','#C62422',14,'end')+`<circle cx="${G[0]}" cy="${G[1]}" r="5" fill="#C62422"/>`;
   s+=ar(Bx,By+50,Bx,By+2,'#3286BE',3)+`<circle cx="${Bx}" cy="${By}" r="5" fill="#3286BE"/>`+tx(Bx+10,By+8,'B','#3286BE',14,'start');
   s+=`<circle cx="${Mw[0]}" cy="${Mw[1]}" r="5" fill="#12286B"/>`+tx(Mw[0]+10,Mw[1],'M','#12286B',14,'start');
   s+=tx(W-10,24,ok?'元に戻る（安定）':'ひっくり返る（不安定）',ok?'#12286B':'#C62422',16,'end');
   s+=wsm(60,wl); b.fig.innerHTML=svgWrap(W,H,s);
   b.out.innerHTML=`<div class="kv"><span>喫水 d</span><b>${nf(d)} m</b><span>KB＝d/2</span><b>${nf(KB)} m</b><span>BM＝B²/(12d)</span><b>${nf(BM,3)} m</b><span>GM</span><b class="${ok?'':'ng'}">${nf(GM,3)} m</b></div><p class="xnote">幅を広げると BM が大きくなり安定する。重心を上げる（荷物を高く積む）と不安定になる。船の設計、ケーソン（港の防波堤に使う大きなコンクリートの箱）を海に浮かべて運ぶときの安全確認に使う。</p>`; }); };

XW.bern=root=>{ const b=xwBase(root,'細い管で、水は速く・圧力は低く','途中が細くなった管（ベンチュリ管）です。立てた細い管（ピエゾメータ）の水位が、その場所の圧力水頭を表します。');
  xwSliders(b.ctl,[{k:'Q',l:'流量',min:0,max:60,step:1,v:25,u:'L/s'},{k:'d2',l:'くびれの直径',min:5,max:20,step:.5,v:10,u:'cm'},{k:'loss',l:'摩擦損失',v:0,opts:[[0,'なし（理想）'],[1,'あり']]}],st=>{
   const D1=.2, Q=st.Q/1000; const xs=[]; for(let i=0;i<=60;i++) xs.push(i/60);
   const dia=x=> x<.35||x>.75? D1 : (x<.5? D1+(st.d2/100-D1)*(x-.35)/.15 : x<.6? st.d2/100 : st.d2/100+(D1-st.d2/100)*(x-.6)/.15);
   const E0=3.0; const v=x=>Q/(Math.PI*dia(x)**2/4); const hl=x=>st.loss?0.5*x*(v(0)**2/(2*9.8))*3+ (x>.6? .15*(v(.55)**2/(2*9.8))*Math.min(1,(x-.6)/.15):0):0;
   const W=520,H=300, X=x=>40+x*440, Y=h=>250-h*55;
   let s=`<line x1="${X(0)}" y1="${Y(E0)}" x2="${X(1)}" y2="${Y(E0-hl(1))}" stroke="#C62422" stroke-width="2" stroke-dasharray="7 4"/>`+tx(X(1),Y(E0-hl(1))-10,'エネルギー線','#C62422',11,'end');
   const hgl=xs.map(x=>[x,E0-hl(x)-v(x)**2/(2*9.8)]); s+=`<polyline points="${hgl.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#3286BE" stroke-width="2"/>`+tx(X(.02),Y(hgl[0][1])-10,'動水勾配線（ピエゾ水位）','#3286BE',11,'start');
   const top=xs.map(x=>[X(x),Y(0)-dia(x)*120]), bot=xs.map(x=>[X(x),Y(0)+dia(x)*120]); s+=`<polygon points="${[...top,...bot.reverse()].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="#93BCD6" stroke="#12286B" stroke-width="2.5"/>`;
   [.15,.55,.9].forEach((x,i)=>{ const hp=E0-hl(x)-v(x)**2/(2*9.8); const yt=Y(0)-dia(x)*120; s+=`<rect x="${X(x)-5}" y="${Math.min(yt,Y(hp))}" width="10" height="${Math.abs(yt-Y(hp))}" fill="#3286BE"/><rect x="${X(x)-6}" y="${Y(E0)-6}" width="12" height="${yt-Y(E0)+6}" fill="none" stroke="#12286B" stroke-width="1.5"/>`+tx(X(x),Y(0)+48,`v＝${nf(v(x))} m/s`,'#12286B',11)+tx(X(x),Y(0)+64,`p/ρg＝${nf(hp)} m`,'#3286BE',11); });
   const vt=v(.55); const cav= E0-vt*vt/19.6 < -10.3+0.25;
   b.fig.innerHTML=svgWrap(W,H,s);
   b.out.innerHTML=`<p class="xnote">${F('z + p/ρg + v²/2g = 一定')}。くびれで速度水頭 v²/2g が増えた分だけ、圧力水頭が下がる。2か所の圧力差から流量を測るのがベンチュリ流量計。圧力が下がりすぎると水が沸騰したように泡立ち（キャビテーション）、ポンプや水門を傷める。${cav?'<b style="color:#C62422">この条件ではくびれの圧力が真空に近く、キャビテーションが起きる。</b>':''}${st.loss?' 損失ありでは、エネルギー線が下流へ向かって下がる。':''}</p>`; }); };

XW.momentum=root=>{ const b=xwBase(root,'水の流れが押す力','噴流が板に当たると、水の運動量が変わった分だけ板を押します。板の角度（はね返し方）を変えてみてください。');
  xwSliders(b.ctl,[{k:'v',l:'噴流の速さ',min:2,max:30,step:1,v:15,u:'m/s'},{k:'d',l:'噴流の直径',min:2,max:15,step:.5,v:5,u:'cm'},{k:'a',l:'水が曲げられる角度',min:0,max:180,step:5,v:90,u:'°'}],st=>{
   const A=Math.PI*(st.d/100)**2/4, Q=A*st.v, Fv=1000*Q*st.v*(1-Math.cos(st.a*D2R))/1000; const W=520,H=260, px=330,py=130;
   let s=`<rect x="20" y="${py-st.d*1.2}" width="${px-30}" height="${st.d*2.4}" fill="#93BCD6"/>`+ar(40,py,px-30,py,'#12286B',2);
   const a=st.a*D2R; for(const sgn of [1,-1]){ const ex=px-10+Math.cos(Math.PI-a)*-1*0, dx=-Math.cos(a), dy=Math.sin(a)*sgn; s+=`<line x1="${px-12}" y1="${py}" x2="${px-12+dx*120}" y2="${py-dy*120}" stroke="#93BCD6" stroke-width="${st.d*1.2}" stroke-linecap="round"/>`; }
   s+=`<rect x="${px-10}" y="${py-70}" width="14" height="140" fill="#12286B"/>`+ar(px+4,py,px+4+Math.min(160,Fv*2+20),py,'#C62422',4)+tx(px+10+Math.min(160,Fv*2+20),py-16,`${nf(Fv,3)} kN`,'#C62422',14,'end');
   b.fig.innerHTML=svgWrap(W,H,s);
   b.out.innerHTML=`<div class="kv"><span>流量 Q</span><b>${nf(Q*1000)} L/s</b><span>板を押す力 ρQv(1−cosθ)</span><b>${nf(Fv,3)} kN</b></div><p class="xnote">90°に曲げると ${F('ρQv')}、180°はね返すと2倍。水車（ペルトン水車）のバケットが水をはね返す形なのはこのため。消防ホースの反動、曲がった水道管を固定するコンクリート（スラストブロック）の設計にも使う。</p>`; }); };

XW.pipe=root=>{ const b=xwBase(root,'2つの水槽を管でつなぐ','水位差がそのまま「入口・摩擦・出口」の損失に使われます。管を長く・細くすると流量がどう変わるか見てください。');
  xwSliders(b.ctl,[{k:'H',l:'水位差 H',min:1,max:30,step:.5,v:10,u:'m'},{k:'L',l:'管の長さ L',min:10,max:1000,step:10,v:200,u:'m'},{k:'D',l:'管の直径 D',min:5,max:60,step:1,v:20,u:'cm'},{k:'f',l:'摩擦損失係数 f',min:.01,max:.05,step:.001,v:.025}],st=>{
   const D=st.D/100, k=.5+st.f*st.L/D+1, v=Math.sqrt(2*9.8*st.H/k), Q=Math.PI*D*D/4*v, hv=v*v/19.6; const Re=v*D/1e-6;
   const W=520,H=280, x1=110,x2=410, top=40, sc=200/30, y1=top, y2=top+st.H*sc; let s=`<rect x="20" y="${y1}" width="90" height="230" fill="#93BCD6" stroke="#12286B" stroke-width="2"/><rect x="${x2}" y="${y2}" width="90" height="${270-y2}" fill="#93BCD6" stroke="#12286B" stroke-width="2"/>`;
   s+=`<rect x="${x1}" y="255" width="${x2-x1}" height="${Math.max(4,st.D/3)}" fill="#93BCD6" stroke="#12286B"/>`;

XW.manning=root=>{ const b=xwBase(root,'水路の形と流れやすさ','長方形水路の幅と水深を変えます。同じ断面積でも、水に接する長さ（潤辺）が短いほど流れやすい。');
  xwSliders(b.ctl,[{k:'b',l:'水路の幅 b',min:.5,max:8,step:.1,v:4,u:'m'},{k:'h',l:'水深 h',min:.2,max:4,step:.05,v:1,u:'m'},{k:'n',l:'水路の材料',v:.015,opts:[[.012,'なめらかなコンクリート（n＝0.012）'],[.015,'コンクリート（n＝0.015）'],[.025,'土の水路（n＝0.025）'],[.035,'自然の川（n＝0.035）']]},{k:'I',l:'勾配',min:1,max:20,step:.5,v:2,f:v=>'1/'+nf(1000/v,0)}],st=>{

XW.energy=root=>{ const b=xwBase(root,'同じ流量に、水深が2つある','比エネルギー E と水深 h の曲線です。水深を動かすと、同じ E で「深くて遅い」常流と「浅くて速い」射流の2つがあることがわかります。');

   const hc=Math.cbrt(st.q**2/9.8), E=h=>h+st.q**2/(2*9.8*h*h); const A=axes({W:520,H:320,x0:0,x1:4,y0:0,y1:3,xl:'比エネルギー E（m）',yl:'水深 h（m）',xt:[0,1,2,3,4],yt:[0,1,2,3]});

XW.jump=root=>{ const b=xwBase(root,'跳水でエネルギーを消す','射流（浅くて速い）が常流に変わる場所で水面が急に高くなります。ダムの下流でこれを起こし、川底が掘れるのを防ぎます。');
  let anim=null; const st=xwSliders(b.ctl,[{k:'h1',l:'跳水前の水深 h₁',min:.1,max:1,step:.02,v:.3,u:'m'},{k:'v1',l:'跳水前の流速 v₁',min:2,max:15,step:.25,v:8,u:'m/s'}],()=>{});
  function draw(){ const Fr=st.v1/Math.sqrt(9.8*st.h1); const h2= Fr>1? st.h1/2*(Math.sqrt(1+8*Fr*Fr)-1):st.h1; const dE=(h2-st.h1)**3/(4*st.h1*h2), E1=st.h1+st.v1**2/19.6;
    const W=520,H=240, sc=Math.min(60,170/Math.max(h2,st.h1)), by=220, xj=220, t=performance.now()/1000; let pts=[];
    for(let x=0;x<=W;x+=4){ let h; if(x<xj) h=st.h1; else if(x<xj+90){ const u=(x-xj)/90; h=st.h1+(h2-st.h1)*(1-Math.pow(1-u,2))+ (Fr>1? Math.sin(x*.25+t*8)*0.04*(h2-st.h1)*(1-u):0); } else h=h2; pts.push([x,by-h*sc]); }
    let s=`<polygon points="0,${by} ${pts.map(p=>p[0]+','+p[1].toFixed(1)).join(' ')} ${W},${by}" fill="#93BCD6"/><line x1="0" y1="${by}" x2="${W}" y2="${by}" stroke="#12286B" stroke-width="3"/>`;
    if(Fr>1) for(let k=0;k<6;k++){ const x=xj+15+k*12, y=by-(st.h1+(h2-st.h1)*.6)*sc+Math.sin(t*6+k)*6; s+=`<circle cx="${x}" cy="${y}" r="${4+Math.sin(t*5+k*2)*2}" fill="#fff" opacity=".8"/>`; }
    s+=tx(60,by-st.h1*sc-14,`h₁＝${nf(st.h1)} m`,'#12286B',12)+tx(W-60,by-h2*sc-14,`h₂＝${nf(h2,3)} m`,'#12286B',12);

  const loop=()=>{ if(!root.isConnected){ cancelAnimationFrame(anim); return; } draw(); anim=requestAnimationFrame(loop); }; loop(); };

XW.orifice=root=>{ const b=xwBase(root,'水槽の水はどう減る？','底の穴から水が抜けていく様子です。水位が下がるほど流れ出る勢いが弱まり、減り方がゆっくりになります。');
  let anim=null,t0=null,h=4; const st=xwSliders(b.ctl,[{k:'A',l:'水槽の断面積',min:1,max:10,step:.5,v:4,u:'m²'},{k:'a',l:'穴の直径',min:2,max:20,step:1,v:8,u:'cm'},{k:'H',l:'はじめの水深',min:1,max:5,step:.25,v:4,u:'m'}],()=>{ t0=null; });

    if(t0==null) t0=now; const tt=Math.min(T,(now-t0)/1000*T/8); const sq=Math.max(0,Math.sqrt(st.H)-k*tt/2); h=sq*sq;
    const W=520,H=260, sc=200/5; let s=`<rect x="40" y="${240-5*sc}" width="140" height="${5*sc}" fill="none" stroke="#12286B" stroke-width="3"/><rect x="40" y="${240-h*sc}" width="140" height="${h*sc}" fill="#93BCD6"/>`;

    const A=axes({W:290,H:250,x0:0,x1:T,y0:0,y1:st.H,xl:'時間（秒）',yl:'水深（m）',ml:40,xt:[0,Math.round(T/2),Math.round(T)],yt:[0,st.H]}); let g2=A.s; const c=[]; for(let i=0;i<=50;i++){ const ti=T*i/50; const q=Math.max(0,Math.sqrt(st.H)-k*ti/2); c.push([ti,q*q]); } g2+=pl(c,A.X,A.Y,'#12286B',2.5)+`<circle cx="${A.X(tt)}" cy="${A.Y(h)}" r="6" fill="#C62422"/>`;

    anim=requestAnimationFrame(frame); }
  anim=requestAnimationFrame(frame); };

XW.well=root=>{ const b=xwBase(root,'井戸で汲み上げると、地下水位が下がる','井戸から揚水すると、まわりの地下水位が円すい形に下がります（水位降下錐）。揚水量を増やしてみてください。');

XW.hydro=root=>{ const b=xwBase(root,'舗装が増えると、洪水はどう変わる？','同じ雨でも、森や田畑が舗装や屋根に変わると、川に流れ出る量が増え、早くピークが来ます（模式的なハイドログラフ）。');
  xwSliders(b.ctl,[{k:'u',l:'舗装・屋根の割合',min:0,max:100,step:5,v:20,u:'%'},{k:'r',l:'雨の強さ',min:10,max:100,step:5,v:50,u:'mm/h'},{k:'A',l:'流域面積',min:.5,max:10,step:.5,v:2,u:'km²'},{k:'pond',l:'調整池',v:0,opts:[[0,'なし'],[1,'あり']]}],st=>{
   const f=.3+(.9-.3)*st.u/100; const Qp=f*st.r*st.A/3.6, Qp0=.3*st.r*st.A/3.6; const tp=90-50*st.u/100; const hyd=(qp,tp,t)=>{ const x=t/tp; return qp*Math.pow(x*Math.exp(1-x),3); };
   const A=axes({W:520,H:280,x0:0,x1:360,y0:0,y1:Math.max(Qp0,Qp)*1.15+1,xl:'雨が降り始めてからの時間（分）',yl:'川の流量（m³/s）',xt:[0,60,120,180,240,300,360],yt:[0,Math.round(Math.max(Qp0,Qp)/2),Math.round(Math.max(Qp0,Qp))]});
   let s=A.s; const c0=[],c1=[],c2=[]; for(let t=0;t<=360;t+=3){ c0.push([t,hyd(Qp0,90,t)]); c1.push([t,hyd(Qp,tp,t)]); }
   s+=pl(c0,A.X,A.Y,'#3286BE',2,'6 4')+tx(A.X(250),A.Y(hyd(Qp0,90,250))-12,'開発前（森林）','#3286BE',11);
   s+=pl(c1,A.X,A.Y,'#C62422',3);
   if(st.pond){ let S=0; const lim=Qp0*1.05; for(const [t,q] of c1){ let out=q; if(q>lim){ S+=(q-lim)*180; out=lim; } else if(S>0){ const rel=Math.min(S,(lim-q)*180); S-=rel; out=q+rel/180; } c2.push([t,out]); } s+=pl(c2,A.X,A.Y,'#12286B',3)+tx(A.X(200),A.Y(lim)-12,'調整池でピークを抑える','#12286B',11); }

   b.out.innerHTML=`<div class="kv"><span>平均流出係数 f</span><b>${nf(f,3)}</b><span>ピーク流量（合理式）</span><b>${nf(Qp)} m³/s</b><span>開発前との比</span><b>${nf(Qp/Qp0)}倍</b></div><p class="xnote">${F('Q = (1/3.6)frA')}。都市の川があふれやすくなったのはこのため。調整池・雨水貯留施設（学校の校庭や公園の地下）・透水性舗装で、ピークを下げて遅らせる。東京の首都圏外郭放水路や環状七号線地下調節池は、その大規模な例。</p>`; }); };

XW.wave=root=>{ const b=xwBase(root,'津波は浅くなると遅く、高くなる','海の深さによって津波の速さが変わります。陸に近づくと遅くなり、後ろの波が追いついて高くなります。');
  let anim=null,t0=null; const st=xwSliders(b.ctl,[{k:'d',l:'沖の水深',min:500,max:6000,step:100,v:4000,u:'m'},{k:'a',l:'沖での波の高さ',min:.5,max:3,step:.1,v:1,u:'m'}],()=>{ t0=null; });
  function frame(now){ if(!root.isConnected){ cancelAnimationFrame(anim); return; } if(t0==null) t0=now; const W=520,H=260;
    const depth=x=> x<300? st.d : x<420? st.d+(10-st.d)*(x-300)/120 : 10; // x in km 0..450
    const X=x=>20+x/450*480, Yd=dd=>120+Math.sqrt(dd)/Math.sqrt(6000)*120;
    // travel: integrate dt = dx / sqrt(g h)
    const sim=(now-t0)/1000*600; let pos=0,tt=0; const dx=2; while(pos<440 && tt+dx*1000/Math.sqrt(9.8*depth(pos))<=sim){ tt+=dx*1000/Math.sqrt(9.8*depth(pos)); pos+=dx; }
    if(pos>=440 && sim>tt+200) t0=now;
    const hd=depth(pos), amp=st.a*Math.pow(st.d/hd,.25); let s=`<polygon points="${[...Array(91).keys()].map(i=>{ const x=i*5; return X(x)+','+Yd(depth(x)); }).join(' ')} ${X(450)},${H} ${X(0)},${H}" fill="#D8CFBE"/>`;
    const pts=[]; for(let x=0;x<=450;x+=2){ const w=Math.exp(-(((x-pos)/(8+0.05*Math.sqrt(depth(x))))**2)); pts.push([X(x),120-w*Math.min(60,amp*8)]); }

  {t:'p＝ρgh',f:'column',b:`水面から深さ h の点のまわりに、底面積 A・高さ h の水の柱を考える（点線）。この柱は止まっているので、上下の力がつりあう。<br>・下向き：柱の水の重さ ${F('W = ρ × (Ah) × g')}（水面の上は大気圧で、ゲージ圧では0）<br>・上向き：底面を下の水が押す力 ${F('pA')}<br>・横向きの力は左右で打ち消し合うので、上下には効かない。<br>つりあい ${F('pA = ρgAh')} の両辺を A で割ると ${F('p = ρgh')}。圧力は「その点より上にある水の柱の重さ÷面積」。`},
  {t:'圧力は向きによらず同じ（パスカルの原理）',f:'wedge',b:`水中に小さな三角柱（底辺 dx、高さ dz、斜辺 ds、斜面の角度 θ）を取り出す。止まっている水にはずれる向きの力（せん断力）がないので、各面には面に垂直な圧力だけが働く。<br>・横方向：${F('p_x · dz = p · ds · sinθ')}。${F('dz = ds · sinθ')} なので ${F('p_x = p')}。<br>・縦方向：${F('p_z · dx = p · ds · cosθ + ½ρg·dx·dz')}（最後は三角柱の重さ）。${F('dx = ds·cosθ')} を入れて ${F('p_z = p + ½ρg·dz')}。三角柱を小さくして ${F('dz → 0')} とすると ${F('p_z = p')}。<br>θ は自由に選べるので、どの向きの面にも同じ圧力が働く。`},
  {t:'同じ高さの点は同じ圧力',b:`同じ液体の中の、同じ高さの2点を結ぶ水平な細い柱を考える。横方向に働くのは両端の圧力だけ（重さは下向きなので横には効かない）。つりあい ${F('p_1 A = p_2 A')} から ${F('p_1 = p_2')}。容器の形がどんなに複雑でも、液体でつながっていれば成り立つ。`},
  {t:'U字管マノメータ Δp＝(ρm−ρ)gΔh',b:`管の点A（圧力 p<sub>A</sub>）と点B（p<sub>B</sub>）をU字管でつなぎ、下に水銀（密度 ρ<sub>m</sub>）を入れる。水銀の低い側の液面の高さで、左右の圧力が等しい（同じ液体・同じ高さ）。<br>左：${F('p_A + ρg(h + Δh)')}、右：${F('p_B + ρgh + ρ_m gΔh')}（h は共通部分の高さ）。<br>等しいとおいて ${F('p_A − p_B = (ρ_m − ρ)gΔh')}。`},
  {t:'大気圧は水柱で約10.3 m',b:`大気圧 101.3 kN/m² を ${F('p = ρgh')} に入れると ${F('h = 101300/(1000 × 9.8) ≒ 10.3 m')}。だから吸い上げポンプでは、理論上10 m 程度より高く水を吸い上げられない。`},
 ],
 force:[
  {t:'全水圧 P＝ρg h_G A',f:'strip',b:`面を小さな帯 dA に分ける。深さ h の帯が受ける力は ${F('dP = p·dA = ρgh·dA')}。全部足すと ${F('P = ∫ρgh dA = ρg∫h dA')}。<br>図心（面の重心）の定義は ${F('h_G = ∫h dA / A')} なので ${F('∫h dA = h_G A')}。よって ${F('P = ρg h_G A')}：「図心の深さの水圧 × 面積」。`},
  {t:'鉛直な壁 P＝½ρgH²B、作用点は底から H/3',b:`水面から底までの壁（高さ H、幅 B）は、図心の深さ ${F('h_G = H/2')}、面積 ${F('A = HB')}。${F('P = ρg(H/2)(HB) = ½ρgH²B')}。<br>圧力は深さに比例するので、分布は三角形（底で ρgH）。合力は三角形の重心を通るので、水面から 2H/3、底から H/3 の位置。`},
  {t:'作用点 h_C＝h_G＋I_G/(h_G A)',b:`水面の線のまわりのモーメントで考える。合力 P が深さ h<sub>C</sub> に働くとすると ${F('P·h_C = ∫h·dP = ρg∫h² dA')}。<br>${F('∫h² dA')} は水面の線まわりの断面二次モーメント。平行軸の定理で ${F('I_G + h_G²A')}。<br>${F('h_C = ρg(I_G + h_G²A) / (ρg h_G A) = h_G + I_G/(h_G A)')}。第2項は必ず正なので、作用点は図心より深い。`},
  {t:'両側に水がある P＝½ρgB(H₁²−H₂²)',b:`上流側から ${F('½ρgH_1²B')}、下流側から逆向きに ${F('½ρgH_2²B')}。向きが反対なので差し引きが正味の力。`},
 ],
 buoy:[
  {t:'浮力＝押しのけた水の重さ（アルキメデス）',b:`物体を取り除いて、同じ形の「水のかたまり」に置きかえて考える。その水のかたまりは周りの水の中で止まっているので、周りの水圧の合力は、ちょうどかたまりの重さ ${F('ρgV')} と同じ大きさで上向き。<br>周りの水圧は、中身が物体でも水でも同じ（圧力は深さだけで決まる）。だから物体にも ${F('B = ρgV')} の上向きの力が働く。<br>直方体なら：底面の上向き ${F('ρg h_2 A')} − 上面の下向き ${F('ρg h_1 A')} ＝ ${F('ρg(h_2 − h_1)A = ρgV')} と直接確かめられる。`},
  {t:'喫水 d＝(ρb/ρw)H',b:`浮かんで止まっているとき、重さ＝浮力。底面積 A の直方体で ${F('ρ_b g A H = ρ_w g A d')}。両辺を ${F('ρ_w g A')} で割ると ${F('d = (ρ_b/ρ_w)H')}。`},
  {t:'メタセンタ高さ GM＝I/V−CG',f:'heel',b:`浮体を小さな角度 θ 傾けると、片側のくさびが水から出て、反対側のくさびが沈む（どちらも体積は同じ）。水線から x の位置の幅 dA の部分は、深さ ${F('xθ')} だけ沈む（または浮く）。<br>浮心の横移動：${F('V · BB′ = ∫x · (xθ) dA = θ ∫x² dA = θI')} → ${F('BB′ = Iθ/V')}。<br>新しい浮心を通る鉛直線と、浮体の中心線の交点が M。小さな θ では ${F('BM = BB′/θ = I/V')}。<br>重心 G が M より下（${F('GM = BM − BG > 0')}）なら、浮力と重さが元に戻す向きの偶力 ${F('W·GM·sinθ')} をつくる。ここで ${F('BG = CG')}（C＝浮心）。`},
  {t:'直方体 I/V＝B²/(12d)',b:`長さ L、幅 B の水線面の断面二次モーメントは ${F('I = LB³/12')}、水中の体積は ${F('V = LBd')}。割ると ${F('B²/(12d)')}。幅が広いほど急に大きくなる（B²）。`},
 ],
 bern:[
  {t:'連続の式 Q＝A₁v₁＝A₂v₂',b:`水はほとんど縮まない。時間 dt の間に断面1を通る体積 ${F('A_1 v_1 dt')} と、断面2を通る体積 ${F('A_2 v_2 dt')} は等しくないと、間に水がたまるか消えてしまう。だから ${F('A_1 v_1 = A_2 v_2')}。`},
  {t:'ベルヌーイの定理',f:'tube',b:`流れに沿った細い管（流管）を考える。時間 dt の間に、断面1から体積 dV の水が入り、断面2から同じ dV が出る。<br>・圧力がする仕事：入口で ${F('p_1 dV')}（押し込む）、出口で ${F('−p_2 dV')}（押し返される）。<br>・運動エネルギーの変化：${F('½ρdV(v_2² − v_1²)')}、位置エネルギーの変化：${F('ρdV g(z_2 − z_1)')}。<br>摩擦がなければ「仕事＝エネルギーの増加」：${F('(p_1 − p_2)dV = ½ρdV(v_2²−v_1²) + ρdVg(z_2−z_1)')}。<br>dV で割り、1と2を左右に分けて ρg で割ると ${F('z_1 + p_1/(ρg) + v_1²/(2g) = z_2 + p_2/(ρg) + v_2²/(2g)')}。どの断面でも同じ値＝一定。`},
  {t:'速くなると圧力が下がる',b:`高さが同じ（${F('z_1 = z_2')}）なら ${F('p_2 = p_1 − ½ρ(v_2² − v_1²)')}。v<sub>2</sub>＞v<sub>1</sub> なら p<sub>2</sub>＜p<sub>1</sub>。エネルギーの合計は変わらないので、運動エネルギーが増えた分、圧力のエネルギーが減る。`},
  {t:'トリチェリ v＝√(2gh)',b:`水面（大気圧で p＝0、広いので v≒0、高さ h）と、穴から出た直後の噴流（大気中で p＝0、高さ0）にベルヌーイを使う。${F('h + 0 + 0 = 0 + 0 + v²/(2g)')} → ${F('v = √(2gh)')}。高さ h から物を落としたときの速さと同じ。`},
  {t:'ベンチュリ管の流量',b:`断面1と2（細い）で ${F('p_1 − p_2 = ½ρ(v_2² − v_1²)')}、連続の式 ${F('v_2 = v_1(A_1/A_2)')}。代入して ${F('p_1 − p_2 = ½ρv_1²((A_1/A_2)² − 1)')}。<br>v<sub>1</sub> について解き ${F('Q = A_1 v_1 = A_1√(2(p_1 − p_2)/(ρ((A_1/A_2)² − 1)))')}。圧力差を測れば流量がわかる。`},
 ],
 momentum:[
  {t:'運動量の式 ΣF＝ρQ(v₂−v₁)',b:`ニュートンの運動の法則「力×時間＝運動量の変化」を、流れのある区間（検査体積）に使う。時間 dt の間に、質量 ${F('ρQ dt')} の水が速度 v<sub>1</sub> で入り、同じ質量が v<sub>2</sub> で出ていく。区間内の運動量の変化は ${F('ρQ dt (v_2 − v_1)')}。<br>これが区間の水に働く力の合計 × dt に等しいので ${F('ΣF = ρQ(v_2 − v_1)')}（向きを含めたベクトルの式）。`},
  {t:'噴流が板を押す力 F＝ρQv',b:`噴流の向きを＋とする。板に当たる前 ${F('v_1 = v')}、横へ散った後は噴流方向の成分 ${F('v_2 = 0')}。水が板から受ける力は ${F('ρQ(0 − v) = −ρQv')}（逆向き）。作用・反作用で、板は ${F('ρQv')} で押される。角度 θ に曲げられると ${F('v_2 = v cosθ')} なので ${F('ρQv(1 − cosθ)')}、180°はね返すと ${F('2ρQv')}。`},
  {t:'スルースゲートに働く力',b:`水門の上流の断面1と下流の断面2の間の水について、流れの向きの力を書く。上流の静水圧 ${F('½ρgh_1²')}（＋）、下流の静水圧 ${F('½ρgh_2²')}（−）、水門が水を押し返す力 F（−）。<br>${F('½ρg(h_1² − h_2²) − F = ρq(v_2 − v_1)')} → ${F('F = ½ρg(h_1² − h_2²) − ρq(v_2 − v_1)')}。静水圧の差から、水が勢いをつけるのに使った分を引いたものが水門の力。`},
 ],
 pipe:[
  {t:'レイノルズ数 Re＝vD/ν',b:`流れを乱そうとする慣性の力（${F('ρv²')} 程度）と、流れをならす粘性の力（${F('μv/D')} 程度）の比。${F('ρv² ÷ (μv/D) = ρvD/μ = vD/ν')}（${F('ν = μ/ρ')}）。この比が小さいと粘性が勝って層流、大きいと乱れが勝って乱流になる。境目の約2000という値は、レイノルズの実験で決まった値。`},
  {t:'摩擦損失 h_f＝f(L/D)v²/(2g)',b:`長さ L の管の中の水について、流れの向きの力のつりあいを書く。両端の圧力差がする力 ${F('Δp · πD²/4')} と、管の壁の摩擦（せん断応力 τ₀）${F('τ_0 · πDL')} がつりあう：${F('Δp = 4τ_0 L/D')}。<br>実験から、乱流の壁の摩擦は速度の2乗に比例するので ${F('τ_0 = (f/8)ρv²')} と書く（f が摩擦損失係数）。代入して ${F('h_f = Δp/(ρg) = f (L/D) v²/(2g)')}。<br>層流ではハーゲン・ポアズイユの式から ${F('f = 64/Re')} と計算できる。`},
  {t:'入口損失0.5、出口損失1.0',b:`出口：管から広い水槽に出ると、水の速さは0になる。運動エネルギー ${F('v²/2g')} はすべて渦になって消えるので、損失係数は1.0。入口：角ばった入口では流れが一度縮まってから広がり、実験的に ${F('0.5 v²/2g')} 程度が失われる（入口を丸くすると小さくなる）。`},
  {t:'2つの水槽 H＝(0.5＋fL/D＋1.0)v²/(2g)',b:`上の水槽の水面（p＝0、v≒0、高さ H）から下の水槽の水面（p＝0、v≒0、高さ0）へ、損失を含めたベルヌーイの式を書く：${F('H = 0 + h_入口 + h_f + h_出口')}。それぞれを代入すると式になる。水位差はすべて損失に使われる。`},
 ],
 manning:[
  {t:'等流のつりあい τ₀＝ρgRI',b:`勾配 I（角度 θ、${F('sinθ ≒ I')}）の水路で、長さ L の水のかたまりを考える。等流（深さが変わらない）なら、両端の水圧は打ち消し合い、重さの斜面方向成分と底・壁の摩擦がつりあう。<br>${F('ρgAL · I = τ_0 · S · L')} → ${F('τ_0 = ρg(A/S)I = ρgRI')}。ここで径深 ${F('R = A/S')} が自然に出てくる。`},
  {t:'マニングの式 v＝(1/n)R^{2/3}I^{1/2}',b:`乱流の摩擦は ${F('τ_0 ∝ ρv²')}。上の式とあわせると ${F('v² ∝ RI')}、つまり ${F('v = C√(RI)')}（シェジーの式）。<br>係数 C は、実際の水路の観測から ${F('C = R^{1/6}/n')} とおくとよく合うことがわかった（マニング）。代入して ${F('v = (1/n)R^{1/6}R^{1/2}I^{1/2} = (1/n)R^{2/3}I^{1/2}')}。n は壁の粗さを表す、実験で決める値。`},
  {t:'一番流しやすい長方形は b＝2h',b:`断面積 A を一定にして、潤辺 ${F('S = b + 2h = A/h + 2h')} を最小にすれば、R が最大になり流速が最大になる。<br>h で微分して0とおく：${F('dS/dh = −A/h² + 2 = 0')} → ${F('A = 2h²')}。${F('A = bh')} なので ${F('b = 2h')}。このとき ${F('R = A/S = 2h²/(4h) = h/2')}。`},
 ],
 energy:[
  {t:'比エネルギー E＝h＋v²/(2g)',b:`開水路の断面では、水圧は静水圧と同じ分布。底から z の点では ${F('p/(ρg) = h − z')} なので、${F('z + p/(ρg) = h')}（どの深さの点でも同じ）。ベルヌーイの「位置水頭＋圧力水頭」が水深 h になり、${F('E = h + v²/(2g)')}。水路の底を基準にしたエネルギー。`},
  {t:'同じ流量で水深が2つある',b:`単位幅流量 q で ${F('v = q/h')} なので ${F('E = h + q²/(2gh²)')}。h が大きいと第1項、小さいと第2項が大きくなるので、E は途中で最小になる U 字形の曲線。最小値より大きい E には、深い解（常流）と浅い解（射流）の2つの水深がある。`},
  {t:'限界水深 h_c＝(q²/g)^{1/3}、E_min＝1.5h_c',b:`E を h で微分して0：${F('dE/dh = 1 − q²/(gh³) = 0')} → ${F('h_c³ = q²/g')}。<br>このとき ${F('q²/(2gh_c²) = (gh_c³)/(2gh_c²) = h_c/2')}。よって ${F('E_min = h_c + h_c/2 = 1.5h_c')}。速度水頭が水深の半分。`},
  {t:'フルード数 Fr＝v/√(gh)',b:`限界水深では ${F('q² = gh_c³')}、つまり ${F('v² = q²/h_c² = gh_c')} → ${F('v/√(gh_c) = 1')}。h＞h<sub>c</sub>（常流）では v が小さく ${F('Fr < 1')}、h＜h<sub>c</sub>（射流）では ${F('Fr > 1')}。<br>${F('√(gh)')} は浅い水面を伝わる小さな波の速さ（波と津波の単元で証明）。Fr＜1 なら波は流れに逆らって上流へ伝われ、Fr＞1 なら押し流されて上流に伝わらない。`},
 ],
 jump:[
  {t:'共役水深 h₂/h₁＝½(√(1＋8Fr₁²)−1)',b:`跳水の前（1）と後（2）の間の水に運動量の式を使う。跳水の中では大きなエネルギー損失があるのでベルヌーイは使えないが、運動量の式は使える。単位幅で：<br>${F('½ρgh_1² − ½ρgh_2² = ρq(v_2 − v_1)')}、${F('v = q/h')} を入れると ${F('½g(h_1² − h_2²) = q²(h_1 − h_2)/(h_1 h_2)')}。<br>${F('h_1 ≠ h_2')} なので両辺を ${F('(h_1 − h_2)')} で割り ${F('½g(h_1 + h_2) = q²/(h_1 h_2)')}。<br>h<sub>2</sub> の2次方程式 ${F('h_2² + h_1 h_2 − 2q²/(gh_1) = 0')} を解き、${F('Fr_1² = q²/(gh_1³)')} を使うと ${F('h_2 = (h_1/2)(√(1 + 8Fr_1²) − 1)')}。`},
  {t:'損失 ΔE＝(h₂−h₁)³/(4h₁h₂)',b:`${F('ΔE = (h_1 + q²/(2gh_1²)) − (h_2 + q²/(2gh_2²))')}。上の結果 ${F('q²/g = h_1 h_2(h_1 + h_2)/2')} を代入すると、${F('q²/(2g) · (1/h_1² − 1/h_2²) = (h_1 + h_2)²(h_2 − h_1)/(4h_1 h_2)')}。<br>${F('ΔE = (h_2 − h_1)[(h_1 + h_2)² − 4h_1 h_2]/(4h_1 h_2) = (h_2 − h_1)³/(4h_1 h_2)')}。`},
 ],
 orifice:[
  {t:'オリフィス Q＝Ca√(2gh)',b:`理論流速はトリチェリの ${F('√(2gh)')}。実際は①穴を出た流れが縮む（縮流係数 C<sub>c</sub>≒0.61〜0.64）、②摩擦でわずかに遅くなる（流速係数 C<sub>v</sub>≒0.97〜0.99）。両方をまとめた流量係数 ${F('C = C_c C_v ≒ 0.6')} をかける。`},
  {t:'長方形せき Q＝(2/3)CB√(2g)H^{3/2}',f:'weir',b:`越流部を、上流の水面から深さ y、厚さ dy の細い帯に分ける。帯から出る水の速さはトリチェリで ${F('√(2gy)')}、流量は ${F('dQ = B√(2gy) dy')}。<br>y＝0 から H まで足すと ${F('Q = B√(2g)∫_0^H y^{1/2} dy = B√(2g) · (2/3)H^{3/2}')}。実際の縮流などを流量係数 C で補正する。`},
  {t:'直角三角せき Q＝(8/15)C√(2g)H^{5/2}',b:`切り欠きが直角（片側45°）なので、上流水面から深さ y での幅は ${F('2(H − y)')}。<br>${F('Q = ∫_0^H 2(H − y)√(2gy) dy = 2√(2g)[H · (2/3)H^{3/2} − (2/5)H^{5/2}] = 2√(2g) · (4/15)H^{5/2} = (8/15)√(2g)H^{5/2}')}。`},
  {t:'排水時間 t＝2A(√H₁−√H₂)/(Ca√(2g))',b:`水深 h のとき、短い時間 dt に出ていく水は ${F('Ca√(2gh) dt')}。そのぶん水槽の水位が dh 下がる：${F('A dh = −Ca√(2gh) dt')}。<br>${F('dt = −A/(Ca√(2g)) · h^{−1/2} dh')} を H<sub>1</sub> から H<sub>2</sub> まで積分すると ${F('t = (2A/(Ca√(2g)))(√H_1 − √H_2)')}。`},
 ],
 well:[
  {t:'ダルシーの法則 v＝ki',b:`ダルシー（1856年）が砂の柱に水を流す実験で見つけた、実験の法則。流量は水頭差に比例し、流れる距離に反比例する。地盤力学の透水の単元と同じ式。`},

  const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TH_=typeof TH!=='undefined'&&TH;
  // 本文の索引

  const G=(typeof GLOSS!=='undefined'?GLOSS:[]).map(([t,y,d,to])=>({t,y,d,to,k:norm(t+' '+y),kd:norm(d)}));

  const css=document.createElement('style'); css.textContent=`
#srbtn{font:inherit;font-weight:900;font-size:13px;border:2px solid #12286B;background:#fff;color:#12286B;padding:4px 10px;cursor:pointer;white-space:nowrap}
#srbox{position:fixed;inset:0;z-index:50;background:rgba(18,40,107,.35);display:none}

.srh{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid #D9D6CC;padding:6px 10px;margin-bottom:6px;cursor:pointer;color:#1C3A7E}
.srh b{font-size:14px}.srh i{font-style:normal;font-size:11px;font-weight:900;color:#fff;background:#3286BE;padding:1px 6px;margin-right:6px}.srh span{display:block;font-size:12px;color:#5E6B86;line-height:1.6}
mark{background:#f6d36b;color:inherit;padding:0 1px}
.srchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.srchips button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid #93BCD6;background:#fff;color:#12286B;padding:3px 8px;cursor:pointer}`;
  document.head.appendChild(css);
  const hdr=document.querySelector('header'); const prog=document.getElementById('prog');
  const btn=document.createElement('button'); btn.id='srbtn'; btn.textContent='用語検索'; btn.title='用語・式・導出を探す';
  if(prog) prog.before(btn); else if(hdr) hdr.appendChild(btn);
  const box=document.createElement('div'); box.id='srbox';
  box.innerHTML=`<div id="srp" role="dialog" aria-label="用語検索"><div class="row"><input id="srq" type="search" placeholder="例：節点方程式、層方程式、有効応力、フルード数" autocomplete="off"><button id="srx">閉じる</button></div><div id="srr"></div></div>`;
  document.body.appendChild(box);
  const q=box.querySelector('#srq'), out=box.querySelector('#srr');
  const hl=(s,w)=>{ const e=esc(s); if(!w) return e; const ns=norm(s); const i=ns.indexOf(w); if(i<0) return e; return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+w.length))+'</mark>'+esc(s.slice(i+w.length)); };
  const snip=(s,w)=>{ const ns=norm(s); const i=ns.indexOf(w); if(i<0) return esc(s.slice(0,70)); const a=Math.max(0,i-30), b=Math.min(s.length,i+w.length+40); return (a>0?'…':'')+hl(s.slice(a,b),w)+(b<s.length?'…':''); };
  function go(to){
    close();
    if(/^u\d+$/.test(to)){ if(TH_){ window.open(TH_.main+'#'+to,'_blank','noopener'); return; } location.hash='#'+to; return; }
    if(location.hash==='#'+to){ const el=document.getElementById(to); if(el) el.scrollIntoView({block:'start'}); return; }
    location.hash='#'+to;
    setTimeout(()=>{ const el=document.getElementById(to); if(el){ el.scrollIntoView({block:'start'}); el.style.outline='3px solid #C62422'; setTimeout(()=>el.style.outline='',1800); } },120);
  }
  function render(){
    const w=norm(q.value.trim());
    if(!w){ out.innerHTML=`<h4>よく探される用語</h4><div class="srchips">${G.slice(0,60).map(g=>`<button data-w="${esc(g.t)}">${esc(g.t)}</button>`).join('')}</div>`;
      out.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ q.value=b.dataset.w; render(); }); return; }
    const gs=G.map(g=>({g,sc:g.k.startsWith(w)?3:g.k.includes(w)?2:g.kd.includes(w)?1:0})).filter(o=>o.sc).sort((a,b)=>b.sc-a.sc).slice(0,20);
    const hs=IDX.map(o=>({o,sc:o.kt.includes(w)?2:o.kx.includes(w)?1:0})).filter(o=>o.sc).sort((a,b)=>b.sc-a.sc).slice(0,30);
    out.innerHTML=(gs.length?`<h4>用語の意味（${gs.length}）</h4>`+gs.map(({g})=>`<button class="srg" data-to="${g.to}"><b>${hl(g.t,w)}</b><small>${hl(g.y,w)}</small><span>${hl(g.d,w)}</span><em>${/^d-/.test(g.to)?'導出を見る →':'単元を開く →'}</em></button>`).join(''):'')

    out.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>go(b.dataset.to));
  }
  function open(){ box.classList.add('on'); render(); setTimeout(()=>q.focus(),30); }
  function close(){ box.classList.remove('on'); }
  btn.onclick=open; box.querySelector('#srx').onclick=close; box.onclick=e=>{ if(e.target===box) close(); };

  window.SEARCH={open,go};
})();
