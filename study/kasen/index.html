<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>河川工学ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F3EF;--ink:#1C3A7E;--navy:#12286B;--blue:#3286BE;--red:#C62422;--mid:#93BCD6;--soft:#EAF2F8;--soil:#D8CFBE;--muted:#5E6B86;--sheet:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--navy);background:var(--paper);position:sticky;top:0;z-index:5}
.logo{font-family:"Dela Gothic One";font-size:18px;color:var(--navy);background:none;border:0;padding:0}
.logo b{color:var(--red);font-weight:400}
.star-total{margin-left:auto;font-weight:900;color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:16px}
.hero{border:3px solid var(--navy);background:var(--sheet);padding:18px;position:relative;overflow:hidden}
.hero h1{font-family:"Dela Gothic One";font-weight:400;font-size:clamp(24px,5vw,40px);margin:0 0 8px;color:var(--navy);line-height:1.25}
.hero h1 b{color:var(--red);font-weight:400}
.hero p{margin:6px 0;line-height:1.8}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-weight:900;font-size:14px}
.flow span{background:var(--soft);border:2px solid var(--navy);padding:4px 8px}
.flow i{font-style:normal;color:var(--red)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media(max-width:760px){.fields{grid-template-columns:1fr}}
.field h2{font-family:"Dela Gothic One";font-weight:400;font-size:20px;margin:0 0 6px;color:var(--navy)}
.field h2 small{font-family:"Zen Kaku Gothic New";font-size:12px;color:var(--muted);margin-left:6px}
.mc{display:block;width:100%;text-align:left;border:3px solid var(--navy);background:var(--sheet);padding:0;margin-bottom:10px;color:var(--ink);position:relative}
.mc svg{display:block;width:100%;height:auto;border-bottom:2px solid var(--navy)}
.mc .mt{padding:8px 10px}
.mc .mt b{display:block;font-size:16px;color:var(--navy)}
.mc .mt span{font-size:13px;line-height:1.6;display:block;margin-top:2px}
.mc .stars{position:absolute;top:6px;right:8px;background:var(--paper);border:2px solid var(--navy);padding:0 6px;font-weight:900;color:var(--red)}
.mc.locked{opacity:.5;cursor:not-allowed}

.mc:not(.locked):hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--navy)}
/* mission */
.mv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.mv{grid-template-columns:1fr}}
.scene{position:sticky;top:64px;border:3px solid var(--navy);background:var(--sheet)}
@media(max-width:860px){.scene{position:sticky;top:52px;z-index:3}}
.scene svg{display:block;width:100%;height:auto}
.scene svg [data-s],.scene svg [data-rm]{transition:opacity .7s}
.stagebar{display:flex;gap:0;border-top:2px solid var(--navy);font-size:12px;font-weight:700}
.stagebar span{flex:1;text-align:center;padding:4px 2px;color:var(--muted);border-right:1px solid var(--mid)}
.stagebar span.on{background:var(--navy);color:#fff}
.panel{border:3px solid var(--navy);background:var(--sheet);padding:14px}
.panel h2{font-family:"Dela Gothic One";font-weight:400;font-size:20px;margin:0 0 4px;color:var(--navy)}
.kicker{font-size:12px;font-weight:900;color:var(--red);letter-spacing:.05em}
.panel p{line-height:1.85;margin:8px 0}
.nazo{background:var(--navy);color:#fff;padding:12px;font-size:17px;font-weight:900;line-height:1.6;margin:8px 0}
.nazo small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:4px}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{border:2px solid var(--navy);background:var(--paper);padding:10px;text-align:left;font-weight:700;color:var(--ink)}
.opt:hover{background:var(--soft)}
.opt.ok{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.ng{background:#f6dcdb;border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid var(--navy);background:var(--paper);padding:7px 12px;border-radius:999px;font-weight:700;color:var(--ink)}
.chip.gone{text-decoration:line-through;opacity:.45;background:var(--soft)}
.chip.keep{background:#f6dcdb;border-color:var(--red);animation:shake .3s}
.msg{border-left:5px solid var(--blue);background:var(--soft);padding:8px 10px;line-height:1.8;margin:8px 0;font-size:14px}
.msg.ng{border-color:var(--red);background:#fbeaea}
.next{background:var(--red);color:#fff;border:0;padding:11px 18px;font-weight:900;font-size:16px;margin-top:6px}
.next:disabled{background:#c9c4b8}
.ghost{background:none;border:2px solid var(--navy);padding:8px 12px;font-weight:700;color:var(--navy)}
.given{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;background:var(--paper);border:1px dashed var(--navy);padding:8px 10px;font-size:14px;margin:8px 0}
.given b{color:var(--navy)}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.ans input{width:130px;font:inherit;font-size:18px;padding:6px 8px;border:2px solid var(--navy)}
.f{font-family:"Times New Roman",serif;font-style:italic;font-weight:700}
details.pf{border:1.5px solid var(--navy);margin:8px 0;background:var(--paper)}
details.pf summary{padding:6px 9px;font-weight:700;cursor:pointer;color:var(--navy)}
details.pf div{padding:4px 10px 8px;line-height:1.85;font-size:14px}
.dots{display:flex;gap:5px;margin:0 0 8px}
.dots i{width:22px;height:6px;background:var(--mid)}
.dots i.on{background:var(--red)}.dots i.done{background:var(--navy)}
.clear{text-align:center;border:3px double var(--red);padding:10px;margin:6px 0}
.clear .big{font-family:"Dela Gothic One";font-size:28px;color:var(--red)}
.clear .st{font-size:30px;color:var(--red);letter-spacing:4px}
.real{border:2px solid var(--navy);padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.8}
.real.walk{border-color:var(--red);background:#fdf3f2}
.real h3{margin:0 0 4px;font-size:15px;color:var(--navy)}
.foot{font-size:12px;color:var(--muted);margin:24px 0 8px;line-height:1.8}
.foot a,.real a{color:var(--blue)}
.series{border:2px solid var(--navy);background:var(--sheet);padding:10px 14px;margin-top:16px}
.series h2{font-size:16px;margin:0 0 4px;color:var(--navy)}
.series li{line-height:1.9}
.cmap{margin-top:16px;border:3px solid var(--navy);background:var(--sheet);padding:12px}
.cmap h2,.mh{font-family:"Dela Gothic One";font-weight:400;font-size:22px;color:var(--navy);margin:0 0 8px}
.mh{margin:20px 0 8px}
#mapbox{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:760px){#mapbox{grid-template-columns:1fr}}
#cmap{display:block;width:100%;height:auto}
.fcard h3{margin:0 0 6px;color:var(--navy);font-size:20px}.fcard h3 small{font-size:12px;color:var(--muted);margin-left:8px}
.fcard p{line-height:1.8;margin:6px 0;font-size:14px}.fcard ul{margin:4px 0;padding-left:20px;font-size:14px;line-height:1.8}
.fcard a,.real a{color:var(--blue)}
.uses{font-size:12px;margin-top:5px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.uses span{background:var(--soft);border:1px solid var(--navy);padding:1px 6px;font-weight:700;color:var(--navy)}
.uses i{font-style:normal;color:var(--red);font-weight:900}
.fields{grid-template-columns:repeat(3,1fr)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mgrid .mc{display:flex;flex-direction:column;margin:0;height:100%}
.mgrid .mt{display:flex;flex-direction:column;gap:4px;flex:1;padding:10px 12px 12px}
.mgrid .mt b{font-size:17px;line-height:1.4}
.mgrid .mt>span{font-size:13.5px;line-height:1.6;margin:0}
.ftag{align-self:flex-start;font-style:normal;font-size:11.5px;font-weight:900;color:#fff;background:var(--navy);padding:2px 8px;letter-spacing:.05em}
.mgrid .mt .uses2{margin-top:auto;padding-top:8px;border-top:1px dashed var(--mid);font-size:12px;color:var(--muted);font-weight:700}
.mgrid .mt .uses2::before{content:"使う勉強　";color:var(--red)}
.mc.locked .mt>span:nth-of-type(1)::after{content:"（同じ分野の1つ目をクリアで開く）";color:var(--red)}
.road{border:3px solid var(--navy);background:var(--soft);padding:10px 12px;margin:10px 0}
.road h3{margin:0 0 2px;color:var(--navy);font-size:16px}.road p{font-size:13px;margin:2px 0 8px}
.road ol{list-style:none;margin:0;padding:0;counter-reset:r;position:relative}
.road ol::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;border-left:3px dotted var(--red)}
.road li{counter-increment:r;position:relative;padding:4px 0 8px 38px;line-height:1.6}
.road li::before{content:counter(r);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.road li a{font-weight:900;color:var(--navy)}.road li span{display:block;font-size:13px}
.loop{border:3px solid var(--navy);background:var(--sheet);padding:12px;margin-top:16px}
.loop h2{font-family:"Dela Gothic One";font-weight:400;font-size:22px;color:var(--navy);margin:0 0 6px}
.loop .lp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
@media(max-width:760px){.loop .lp{grid-template-columns:1fr 1fr}}
.loop .st{border:2px solid var(--navy);background:var(--paper);padding:8px;position:relative}
.loop .st b{display:block;color:var(--red);font-family:"Dela Gothic One";font-weight:400;font-size:15px}
.loop .st span{font-size:13px;line-height:1.6;display:block}
.loop .st em{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:4px}
.loop .ex{font-size:13.5px;line-height:1.9;background:var(--soft);padding:8px 10px;border-left:5px solid var(--red)}
.loop .ex a{color:var(--navy);font-weight:700}
</style></head><body>
<header><button class="logo" id="home">河川工学<b>ラボ</b></button><span class="star-total" id="tot"></span></header>
<main id="main"></main>
<script>
"use strict";
// ================= 絵の部品 =================
const C={navy:'#12286B',blue:'#3286BE',red:'#C62422',mid:'#93BCD6',paper:'#F4F3EF',soil:'#D8CFBE',soil2:'#B9AD95',gray:'#8C92A0',green:'#6E9E6A',ink:'#1C3A7E'};
const person=(x,y,c=C.navy,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><circle cx="0" cy="-19" r="4.2" fill="${c}"/><path d="M-4.5,-14 h9 l1,9 h-2.5 v10 h-2.5 l-.5,-8 l-.5,8 h-2.5 v-10 h-2.5z" fill="${c}"/></g>`;
const tree=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-3" y="-22" width="6" height="22" fill="#8a6d4b"/><circle cx="0" cy="-34" r="16" fill="${C.green}"/><circle cx="-9" cy="-26" r="10" fill="${C.green}"/><circle cx="9" cy="-27" r="10" fill="${C.green}"/></g>`;
const car=(x,y,c=C.red,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><path d="M-30,-8 v-10 l10,-2 l8,-10 h22 l10,10 l12,2 v10z" fill="${c}"/><rect x="-10" y="-27" width="10" height="7" fill="#dfe9f2"/><rect x="3" y="-27" width="10" height="7" fill="#dfe9f2"/><circle cx="-17" cy="-6" r="6" fill="#222"/><circle cx="17" cy="-6" r="6" fill="#222"/></g>`;
const cloud=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})" fill="#fff" stroke="${C.mid}" stroke-width="1.5"><path d="M-30,0 a12,12 0 0 1 10,-16 a16,16 0 0 1 28,-4 a12,12 0 0 1 20,10 a9,9 0 0 1 2,10z"/></g>`;
function arrowsDown(x1,x2,y1,y2,n,c=C.red){ let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y1}" stroke="${c}" stroke-width="2.5"/>`; for(let i=0;i<=n;i++){ const x=x1+(x2-x1)*i/n; s+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-6}" stroke="${c}" stroke-width="2"/><path d="M${x},${y2} l-4,-8 h8z" fill="${c}"/>`; } return s; }
function arrowsSide(x,y1,y2,len1,len2,n,dir,c=C.red){ // pressure arrows pointing toward x; dir=-1 means coming from right side to left
 let pts=`${x},${y1} ${x-dir*len1},${y1} ${x-dir*len2},${y2} ${x},${y2}`; let s=`<polygon points="${pts}" fill="${c}" fill-opacity=".15" stroke="${c}" stroke-width="1.5"/>`;
 for(let i=0;i<=n;i++){ const t=i/n, y=y1+(y2-y1)*t, L=len1+(len2-len1)*t; if(L<7) continue; s+=`<line x1="${x-dir*L}" y1="${y}" x2="${x-dir*6}" y2="${y}" stroke="${c}" stroke-width="2"/><path d="M${x},${y} l${-dir*8},-4 v8z" fill="${c}"/>`; } return s; }
const pin=(x,y)=>`<path d="M${x},${y} l-12,20 h24z" fill="#fff" stroke="${C.navy}" stroke-width="2.5"/><line x1="${x-18}" y1="${y+20}" x2="${x+18}" y2="${y+20}" stroke="${C.navy}" stroke-width="2.5"/>${[0,1,2,3,4].map(i=>`<line x1="${x-16+i*8}" y1="${y+20}" x2="${x-22+i*8}" y2="${y+27}" stroke="${C.navy}" stroke-width="1.5"/>`).join('')}`;
const roller=(x,y)=>`<path d="M${x},${y} l-12,16 h24z" fill="#fff" stroke="${C.navy}" stroke-width="2.5"/><circle cx="${x-7}" cy="${y+20}" r="3.5" fill="#fff" stroke="${C.navy}" stroke-width="2"/><circle cx="${x+7}" cy="${y+20}" r="3.5" fill="#fff" stroke="${C.navy}" stroke-width="2"/><line x1="${x-18}" y1="${y+24}" x2="${x+18}" y2="${y+24}" stroke="${C.navy}" stroke-width="2.5"/>`;
const fixedWall=(x,y1,y2,side=-1)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${C.navy}" stroke-width="3.5"/>${Array.from({length:Math.floor((y2-y1)/9)+1},(_,i)=>`<line x1="${x}" y1="${y1+i*9}" x2="${x+side*9}" y2="${y1+i*9+7}" stroke="${C.navy}" stroke-width="1.5"/>`).join('')}`;
const dim=(x1,x2,y,t,c=C.navy)=>`<g stroke="${c}" stroke-width="1.3"><line x1="${x1}" y1="${y-6}" x2="${x1}" y2="${y+6}"/><line x1="${x2}" y1="${y-6}" x2="${x2}" y2="${y+6}"/><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/></g><path d="M${x1},${y} l8,-3.5 v7z M${x2},${y} l-8,-3.5 v7z" fill="${c}"/><text x="${(x1+x2)/2}" y="${y-6}" text-anchor="middle" font-size="14" font-weight="700" fill="${c}">${t}</text>`;
const vdim=(x,y1,y2,t,c=C.navy)=>`<g stroke="${c}" stroke-width="1.3"><line x1="${x-6}" y1="${y1}" x2="${x+6}" y2="${y1}"/><line x1="${x-6}" y1="${y2}" x2="${x+6}" y2="${y2}"/><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/></g><path d="M${x},${y1} l-3.5,8 h7z M${x},${y2} l-3.5,-8 h7z" fill="${c}"/><text x="${x+8}" y="${(y1+y2)/2+5}" font-size="14" font-weight="700" fill="${c}">${t}</text>`;
const label=(x,y,t,c=C.red,a='middle',fs=14)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${fs}" font-weight="900" fill="${c}" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</text>`;
const S=(r,inner)=>`<g data-s="${r}">${inner}</g>`;     // 段階 r="a-b" のときだけ見える
const R=(id,inner)=>`<g data-rm="${id}">${inner}</g>`; // そぎ落とせる物
const DEFS=`<defs><pattern id="hs" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${C.soil}"/><circle cx="3" cy="3" r="1.2" fill="${C.soil2}"/><circle cx="8" cy="7" r="1" fill="${C.soil2}"/></pattern><pattern id="hc" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#c7b9a0"/><path d="M0,6 h12" stroke="#a8977a" stroke-width="1.5"/></pattern><pattern id="hsand" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#eadfbf"/><circle cx="2" cy="2" r="1" fill="#c8b682"/><circle cx="6" cy="6" r="1" fill="#c8b682"/></pattern><pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#9e9a92"/><path d="M0,8 L8,0" stroke="#8a867e" stroke-width="1"/></pattern></defs>`;
const sky=(h=300)=>`<rect width="600" height="${h}" fill="#EAF2F8"/>`;
const wsm=(x,y)=>`<path d="M${x-7},${y-10} h14 l-7,10z" fill="none" stroke="${C.blue}" stroke-width="1.8"/><line x1="${x-10}" y1="${y+4}" x2="${x+10}" y2="${y+4}" stroke="${C.blue}" stroke-width="1.5"/><line x1="${x-6}" y1="${y+8}" x2="${x+6}" y2="${y+8}" stroke="${C.blue}" stroke-width="1.5"/>`;

// ================= ミッション =================
const peopleRow=(x1,x2,y,n)=>Array.from({length:n},(_,i)=>person(x1+(x2-x1)*i/(n-1)+(i%2?2:-2),y,[C.navy,C.red,C.blue,'#5E6B86'][i%4],.95)).join('');
const M=[
// ---------------------------------------------------- R1 川原の石（上流）
{id:'stone',field:'up',uses:['kasen','suiri','jiban'],title:'洪水が運ぶ石',sub:'山の川の洪水。どれくらいの石まで流される？',
 stages:['実物','水の流れを置きかえ','石を置きかえ','教科書の図'],
 scene:()=>`${sky()}
 ${S('0-1',`<path d="M0,140 L120,60 L220,120 L330,40 L460,110 L600,70 V300 H0Z" fill="#6E9E6A"/>${R('tree',tree(80,140,.8)+tree(500,150,.8)+tree(540,160,.7))}`)}
 ${R('cloud',cloud(260,40,1.2))}
 <path d="M0,300 V200 Q300,170 600,200 V300Z" fill="#c9b48f"/>
 ${S('0-3',`<path d="M0,215 Q300,185 600,215 V300 H0Z" fill="${C.mid}" opacity=".85"/>${wsm(470,205)}`)}
 ${S('0-1',`${[[60,270,14],[140,285,22],[230,262,10],[330,282,26],[420,270,12],[520,288,18]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.7}" fill="#8C92A0" stroke="${C.navy}" stroke-width="1.5"/>`).join('')}`)}
 ${R('fish',`<path d="M200,240 q14,-8 28,0 q-14,8 -28,0z M228,240 l8,-6 v12z" fill="${C.red}"/>`)}
 ${R('bridge',`<rect x="380" y="150" width="200" height="10" fill="${C.red}" stroke="${C.navy}" stroke-width="2"/><rect x="470" y="160" width="10" height="45" fill="#bfbab0" stroke="${C.navy}"/>`)}
 ${S('1-3',`<g stroke="${C.blue}" stroke-width="3">${[0,1,2,3].map(i=>`<line x1="${40+i*140}" y1="245" x2="${110+i*140}" y2="245"/><path d="M${118+i*140},245 l-10,-5 v10z" fill="${C.blue}"/>`).join('')}</g>`+label(300,180,'水深 h＝2 m、勾配 I＝1/100',C.blue))}
 ${S('2-3',`<ellipse cx="300" cy="282" rx="22" ry="16" fill="#8C92A0" stroke="${C.navy}" stroke-width="2"/><line x1="230" y1="266" x2="360" y2="266" stroke="${C.red}" stroke-width="3"/><path d="M366,266 l-10,-5 v10z" fill="${C.red}"/>`+label(300,250,'底をこする力 τ₀',C.red))}
 ${S('3-3',label(120,295,'石の直径 d は？',C.navy))}`,
 nazo:{q:'山の川で大雨。ふだんは小石ばかりの川原に、大きな石がごろごろ転がってきた。洪水はどれくらいの石まで運べる？',hint:'予想してみよう。',opts:['砂粒まで','こぶしくらい（5 cm）','人の頭くらい（25 cm）'],ans:2},
 remove:{text:'「どの大きさの石が動くか」を考えるとき、<b>関係ないもの</b>を消そう。',

function mapSvg(sel){

 let s=`<svg viewBox="0 0 600 425" id="cmap"><rect width="600" height="425" fill="#fff"/>`;
 s+=`<circle cx="300" cy="212" r="54" fill="${C.paper}" stroke="${C.navy}" stroke-width="2" stroke-dasharray="4 4"/><text x="300" y="206" text-anchor="middle" font-size="14" font-weight="900" fill="${C.navy}">まちを</text><text x="300" y="226" text-anchor="middle" font-size="14" font-weight="900" fill="${C.navy}">支え、守る</text>`;
 let lab=''; for(const [a,b,t] of EDGES){ const A=P0(a),B=P0(b); const on=sel&&(a===sel||b===sel); const S0p=a===sel?A:B, O0p=a===sel?B:A; const tt=Math.hypot(A.x-B.x,A.y-B.y)<200?0.5:0.66; let mx=S0p.x+(O0p.x-S0p.x)*tt, my=S0p.y+(O0p.y-S0p.y)*tt; if(tt===0.5){ const cx=300-mx, cy=212-my, cl=Math.hypot(cx,cy)||1; mx+=cx/cl*30; my+=cy/cl*30; }
  s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${on?C.red:C.mid}" stroke-width="${on?4:2.5}"/>`;
  if(on) lab+=`<text x="${mx}" y="${my+4}" text-anchor="middle" font-size="13" font-weight="900" fill="${C.red}" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${t}</text>`; }
 for(const [k,f] of Object.entries(FIELDS)){ const {x,y}=f[2]; const on=k===sel; const n=M.filter(m=>m.uses.includes(k)).length;
  s+=`<g data-f="${k}" style="cursor:pointer"><rect x="${x-52}" y="${y-20}" width="104" height="40" rx="20" fill="${on?C.red:C.navy}" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y-1}" text-anchor="middle" font-size="${f[0].length>6?11:13.5}" font-weight="900" fill="#fff">${f[0]}</text><text x="${x}" y="${y+15}" text-anchor="middle" font-size="10.5" fill="#fff">ミッション ${n}</text></g>`; }

}

  pn.innerHTML=`${dots()}<div class="clear"><div class="big">MISSION CLEAR</div><div class="st">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div style="font-size:12px">予想${hit?'的中 ★':'はずれ'}・${S0.miss===0&&!S0.usedHint?'ノーミス・ヒントなし ★':`まちがい ${S0.miss} 回${S0.usedHint?'・ヒントあり':''}`}・クリア ★</div></div>
  <div class="nazo">謎の答え：${c.ans}<small>あなたの予想：${m.nazo.opts[S0.pred]} ${hit?'→ 当たり！':'→ 残念！'}</small></div>
  <p>${c.text}</p>
  <div class="real"><h3>本物に戻すと</h3>${c.real}</div>
  <p style="font-size:14px">左の絵は本物に戻りました。さっきまでの「教科書の図」が、この中に隠れていたことを思い出してみよう。</p>
  ${PATH[m.id]?`<div class="road"><h3>この謎を、もっと深く解き明かす道順</h3><p>上から順に単元ページへ。触って確かめ、「なぜそうなる？」の証明で納得し、問題で腕試し。</p><ol>${PATH[m.id].map(p=>`<li><a href="${p[1]}" target="_blank" rel="noopener">${p[0]}</a><span>${p[2]}</span></li>`).join('')}</ol></div>`:''}
  <div class="real walk"><h3>街で探そう</h3>${m.find}<br><a href="../zukan/" target="_blank" rel="noopener">まちの構造図鑑で記録する →</a>　<a href="../../tokyo/sanpo/" target="_blank" rel="noopener">東京ドボクマップで本物を見に行く →</a></div>
  <div class="real"><h3>このミッションでつながった勉強</h3>${m.uses.map(k=>`<b>${fieldName(k)}</b>`).join(' ＋ ')}<br>${EDGES.filter(e=>m.uses.includes(e[0])&&m.uses.includes(e[1])).map(e=>`${fieldName(e[0])}と${fieldName(e[1])}：${e[2]}`).join('<br>')}<br><a href="#" id="tomap">つながりマップで見る →</a></div>
  ${c.link[1].startsWith('http')?`<p style="font-size:14px">もっと深く：<a href="${c.link[1]}" target="_blank" rel="noopener">${c.link[0]}</a></p>`:''}
  <div style="display:flex;gap:8px;flex-wrap:wrap">${nxt?`<button class="next" id="nm">次のミッション「${nxt.title}」→</button>`:''}<button class="ghost" id="hm">ミッション一覧へ</button><button class="ghost" id="rp">もう一度</button></div>`;
  if(nxt) document.getElementById('nm').onclick=()=>open(nxt.id);
  document.getElementById('hm').onclick=home; document.getElementById('tomap').onclick=e=>{e.preventDefault(); home(); bindMap('kasen'); document.querySelector('.cmap').scrollIntoView();}; document.getElementById('rp').onclick=()=>open(m.id);
 }
}
document.getElementById('home').onclick=home;
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(!h&&cur){ cur=null; home(); } });
updTot();
const h0=location.hash.slice(1); if(h0&&M.find(x=>x.id===h0)) open(h0); else home();
window.__sogi={M,P};
</script>
