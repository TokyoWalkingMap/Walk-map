<title>地盤力学ラボ</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* Layout: a study hub. Home = syllabus grid of 16 units; unit view = key points (left) + generated problem card (right). Shared risograph palette of the lab series. */
:root{
  --paper:#F4F3EF; --ink:#1C3A7E; --navy:#12286B; --blue:#3286BE; --red:#C62422; --mid:#93BCD6;
  --sheet:#FFFFFF; --line:#D9D6CC; --muted:#5E6B86; --soft:#EAF2F8;
  --f-disp:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink);font-family:var(--f-body)}
body{-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--navy)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.logo{font-family:var(--f-disp);font-size:18px;color:var(--navy);white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo b{color:var(--red);font-weight:400}
#crumb{font-weight:900;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,6vw,54px);line-height:1.1;margin:0;color:var(--navy);text-wrap:balance}
h1 b{color:var(--red);font-weight:400}
.lead{font-size:15px;line-height:1.8;max-width:64ch;margin:10px 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font-family:var(--f-body);font-weight:900;font-size:13px;border:2px solid var(--navy);background:var(--sheet);color:var(--navy);padding:5px 12px;cursor:pointer}
.chip.on{background:var(--navy);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.unit{background:var(--sheet);border:2px solid var(--navy);padding:10px 12px 12px;text-align:left;cursor:pointer;font-family:var(--f-body);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.unit .no{font-size:11px;font-weight:900;color:var(--red);letter-spacing:.08em;display:flex;justify-content:space-between;gap:6px}
.unit .nm{font-weight:900;font-size:17px}
.unit .ds{font-size:12px;color:var(--muted);line-height:1.6}
.unit .bar{height:5px;background:var(--line);margin-top:6px}
.unit .bar i{display:block;height:100%;background:var(--blue)}
.tag{font-size:10px;font-weight:900;padding:0 5px;border:1.5px solid currentColor;letter-spacing:0}
.tag.k{color:var(--red)} .tag.d{color:var(--blue)} .tag.c{color:var(--muted)}
.games{margin-top:22px;border-top:2px solid var(--navy);padding-top:12px}
.games h2{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:0 0 8px;color:var(--navy)}
.games ul{margin:0;padding-left:18px;line-height:1.9;font-size:14px}
a{color:var(--blue);font-weight:700}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}
/* unit view */
.uhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:12px}
.uhead h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(22px,4vw,32px);margin:0;color:var(--navy)}
.ucols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:18px;align-items:start}
@media (max-width:820px){.ucols{grid-template-columns:minmax(0,1fr)}.pcard{order:-1}}
.points{background:var(--sheet);border:2px solid var(--navy);padding:10px 14px}
.points h3,.pcard h3{font-size:13px;font-weight:900;color:var(--red);letter-spacing:.06em;margin:0 0 6px}
.points ul{margin:0;padding-left:18px;font-size:14px;line-height:1.85}
.points li{margin-bottom:2px}
.f{font-family:"Times New Roman",Times,serif;font-style:italic;font-weight:700;font-size:1.08em;white-space:nowrap}
.life{margin-top:10px;border-top:2px solid var(--navy);padding-top:6px}
.life h3{margin:6px 0 4px!important}
.life p{margin:0;font-size:14px;line-height:1.8;background:var(--soft);padding:6px 9px;border-left:4px solid var(--blue)}
.points .game{margin-top:8px;font-size:13px;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.pcard{background:var(--sheet);border:2px solid var(--navy);padding:10px 14px 14px}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.types .chip{font-size:12px;padding:3px 9px}
.fig{background:var(--paper);border:1.5px solid var(--line);margin:4px 0 8px}
.fig svg{display:block;width:100%;height:auto;max-height:300px}
.q{font-size:15px;line-height:1.8;margin:0 0 8px}
.ansrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:6px 0}
.ansrow label{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.ansrow input{font-family:var(--f-body);font-size:17px;font-weight:700;width:110px;padding:5px 8px;border:2px solid var(--navy);background:var(--paper);color:var(--ink)}
.ansrow input.ok{border-color:var(--red);background:#FBEDEC}
.ansrow input.ng{border-color:var(--muted);background:#EEEFF3}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button.b{font-family:var(--f-body);font-weight:900;font-size:14px;border:2px solid var(--navy);background:var(--paper);color:var(--navy);padding:7px 14px;cursor:pointer;min-height:38px}
button.b.main{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,input:focus-visible,.unit:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.res{font-family:var(--f-disp);font-size:20px;margin-top:8px}
.res.ok{color:var(--red)} .res.ng{color:var(--muted)}
.sol{margin-top:8px;border-left:4px solid var(--blue);padding:4px 0 4px 10px;font-size:14px;line-height:1.85}
.sol b{color:var(--navy)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
@media (max-width:520px){.logo{font-size:15px}}
.nqmwrap{margin-top:12px;border-top:2px solid var(--navy);padding-top:8px}
.nqmwrap h3{font-size:13px;font-weight:900;color:var(--red);letter-spacing:.06em;margin:0 0 4px}
.nqm{display:grid;gap:6px}
.dgm{background:var(--paper);border:1.5px solid var(--line);padding:4px 6px}
.dgt{font-weight:900;font-size:13px}.dgt small{font-weight:700;color:var(--muted);font-size:11px;margin-left:4px}
.dgm svg{display:block;width:100%;height:auto;max-height:320px}
.dgm.flat svg{max-height:60px}
.pf{margin-top:10px;border-top:2px solid var(--navy);padding-top:6px}
.pf h3{margin:6px 0 2px!important}.pf .pfl{margin:0 0 6px;font-size:12px;color:#5E6B86}
.pf details{border:1.5px solid var(--navy);background:#fff;margin:5px 0}
.pf summary{cursor:pointer;padding:6px 9px;font-weight:700;font-size:14px;color:var(--navy)}
.pf details[open] summary{background:var(--soft);border-bottom:1px solid var(--mid)}
.pf .pfb .f{white-space:normal;font-style:normal}
.pf .pfb{padding:8px 10px;font-size:14px;line-height:1.9}
.pf .pff svg{display:block;width:100%;max-width:320px;margin:0 auto 6px;border:1px solid var(--mid)}
.miss{border:3px solid var(--red);background:#fdf3f2;padding:8px 10px;margin-bottom:10px}
.miss h3{margin:0 0 4px!important;color:var(--red)!important;font-size:14px}
.mlink{display:block;text-decoration:none;color:var(--ink);padding:5px 0;border-top:1px dashed #e3b5b3}
.mlink:first-of-type{border-top:0}.mlink b{display:block;color:var(--navy);font-size:14px}.mlink span{font-size:12.5px;line-height:1.6;display:block}
.mlink:hover b{text-decoration:underline}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.xcard{background:var(--sheet);border:2px solid var(--red);padding:10px 14px 12px}
.xw h3{font-size:16px!important;font-weight:900;color:var(--navy)!important;margin:0 0 4px!important;letter-spacing:0!important}
.xw h3::before{content:"体験";font-size:11px;color:#fff;background:var(--red);padding:1px 6px;margin-right:8px;vertical-align:2px}
.xlead{font-size:13px;line-height:1.75;margin:0 0 6px;color:var(--ink)}
.xfig{background:var(--paper);border:1.5px solid var(--line)}
.xfig svg{display:block;width:100%;height:auto;max-height:340px}
.xfig .two{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);gap:4px}
.xctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px;margin:8px 0 4px}
.xs{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 8px;font-size:12px;font-weight:700}
.xs span{grid-column:1/-1;color:var(--muted)}
.xs input[type=range]{width:100%;accent-color:var(--red);min-width:0}
.xs b{font-size:13px;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.xs select{grid-column:1/-1;font-family:var(--f-body);font-weight:700;font-size:13px;border:1.5px solid var(--navy);background:var(--sheet);color:var(--ink);padding:3px}
.xctl .b{align-self:end;justify-self:start}
.kv{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 14px;font-size:13px;margin:6px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted);font-weight:700}.kv b{color:var(--navy)}.kv b.ng{color:var(--red)}
.xnote{font-size:13px;line-height:1.8;margin:4px 0 0;background:var(--soft);padding:6px 9px;border-left:4px solid var(--blue)}
.warn{font-size:13px;font-weight:700;color:var(--red);margin:6px 0}
@media (max-width:820px){.rcol{order:-1}}

</style>

<header>
  <button class="logo" id="logo" title="目次へ">地盤力学<b>ラボ</b></button>
  <div id="crumb"></div>
  <div id="prog"></div>
</header>
<main id="main"></main>

<script>
"use strict";
// ================= helpers =================
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function nf(x,dd){ if(!isFinite(x)) return '—'; if(x===0) return '0'; const a=Math.abs(x); let d= dd!=null? dd : (a>=1000?0: a>=100?1: a>=1?2: 3); let s=(Math.round(x*10**d)/10**d).toString(); if(s==='-0') s='0'; return s; }
const F=s=>`<span class="f">${String(s).replace(/_([A-Za-z0-9\u4e00-\u9fff]+)/g,'<sub>$1</sub>')}</span>`;
const sq=x=>x*x, cube=x=>x*x*x;
const PI=Math.PI;

// ================= SVG figure builder (world coords, y up) =================
function Fig(x0,y0,x1,y1,W=520){
  const s=W/(x1-x0), H=Math.round((y1-y0)*s); const out=[];
  const X=x=>((x-x0)*s).toFixed(1), Y=y=>((y1-y)*s).toFixed(1);
  const col={n:'#12286B',r:'#C62422',b:'#3286BE',m:'#5E6B86',g:'#B9AD95',e:'#D8CFBE'};
  const o={
    s,
    line(a,b,c,d,w=5,cl='n',dash){ out.push(`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col[cl]||cl}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`); return o; },
    poly(pts,cl='n',w=5,fill='none'){ out.push(`<polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="${fill}" stroke="${col[cl]||cl}" stroke-width="${w}" stroke-linejoin="round"/>`); return o; },
    rect(x,y,w,h,fill='#12286B',stroke='none'){ out.push(`<rect x="${X(x)}" y="${Y(y+h)}" width="${(w*s).toFixed(1)}" height="${(h*s).toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`); return o; },
    circ(x,y,r,fill='#fff',cl='n',w=2.5){ out.push(`<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${fill}" stroke="${col[cl]||cl}" stroke-width="${w}"/>`); return o; },
    text(x,y,t,cl='n',size=14,anchor='middle',dy=0){ out.push(`<text x="${X(x)}" y="${(+Y(y)+dy).toFixed(1)}" fill="${col[cl]||cl}" font-size="${size}" font-weight="900" text-anchor="${anchor}" dominant-baseline="middle" font-family="Zen Kaku Gothic New, sans-serif">${t}</text>`); return o; },
    // support at (x,y): pin, roller, fixedL/fixedR (wall), fixedB (ground)
    sup(t,x,y){ const px=+X(x), py=+Y(y), u=13;
      if(t==='pin'||t==='roller'){ out.push(`<path d="M${px},${py+3} L${px-u},${py+u*1.5} L${px+u},${py+u*1.5}Z" fill="#12286B"/>`);
        if(t==='roller') out.push(`<circle cx="${px-u*.55}" cy="${py+u*1.5+4}" r="3.5" fill="#12286B"/><circle cx="${px+u*.55}" cy="${py+u*1.5+4}" r="3.5" fill="#12286B"/>`);
        const yb=py+u*1.5+(t==='roller'?8:0); out.push(`<line x1="${px-u*1.4}" y1="${yb+1}" x2="${px+u*1.4}" y2="${yb+1}" stroke="#12286B" stroke-width="3"/>`); for(let i=-3;i<=2;i++) out.push(`<line x1="${px+i*8}" y1="${yb+3}" x2="${px+i*8+6}" y2="${yb+9}" stroke="#B9AD95" stroke-width="1.5"/>`); }
      else if(t==='fixedL'||t==='fixedR'){ const d=t==='fixedL'?-1:1; out.push(`<line x1="${px}" y1="${py-22}" x2="${px}" y2="${py+22}" stroke="#12286B" stroke-width="3.5"/>`); for(let i=-22;i<20;i+=7) out.push(`<line x1="${px}" y1="${py+i}" x2="${px+d*9}" y2="${py+i+7}" stroke="#B9AD95" stroke-width="1.5"/>`); }
      else if(t==='fixedB'){ out.push(`<line x1="${px-20}" y1="${py}" x2="${px+20}" y2="${py}" stroke="#12286B" stroke-width="3.5"/>`); for(let i=-20;i<18;i+=7) out.push(`<line x1="${px+i}" y1="${py+2}" x2="${px+i+7}" y2="${py+10}" stroke="#B9AD95" stroke-width="1.5"/>`); }
      return o; },
    hinge(x,y){ return o.circ(x,y,5.5,'#fff','n',2.5); },
    node(x,y){ return o.circ(x,y,4,'#12286B','n',1); },
    // arrow ending at (x,y) with direction (dx,dy) world; length in px
    P(x,y,dx,dy,label,cl='r',len=46,lp='tail'){ const px=+X(x),py=+Y(y), d=Math.hypot(dx,dy), ux=dx/d, uy=-dy/d; const tx=px-ux*len, ty=py-uy*len;
      out.push(`<line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${(px-ux*7).toFixed(1)}" y2="${(py-uy*7).toFixed(1)}" stroke="${col[cl]}" stroke-width="3"/>`);
      const a=Math.atan2(uy,ux); out.push(`<path d="M${px},${py} L${(px-11*Math.cos(a-.42)).toFixed(1)},${(py-11*Math.sin(a-.42)).toFixed(1)} L${(px-11*Math.cos(a+.42)).toFixed(1)},${(py-11*Math.sin(a+.42)).toFixed(1)}Z" fill="${col[cl]}"/>`);
      if(label){ const lx=tx-ux*12, ly=ty-uy*12; out.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${col[cl]}" font-size="14" font-weight="900" text-anchor="${Math.abs(ux)>.5?(ux>0?'end':'start'):'middle'}" dominant-baseline="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); }
      return o; },
    W(xa,xb,y,label,h=.9,cl='r',tri=false){ const n=Math.max(4,Math.round((xb-xa)*s/34)); const top=[]; for(let i=0;i<=n;i++){ const x=xa+(xb-xa)*i/n, hh= tri? h*i/n : h; if(hh*s>8) o.P(x,y,0,-1,null,cl,hh*s,'tail'); top.push([x,y+hh]); }
      o.poly(top,cl,2); if(label) o.text((xa+xb)/2+(tri?(xb-xa)*.12:0),y+h+(16/s),label,cl,14); return o; },
    M(x,y,cw,label,cl='r'){ const px=+X(x),py=+Y(y),r=20; const a0=cw?200:-20, a1=cw?-20:200; const p=a=>[px+r*Math.cos(a*PI/180),py-r*Math.sin(a*PI/180)];
      const [sx,sy]=p(cw?160:20),[ex,ey]=p(cw?20:160); out.push(`<path d="M${sx.toFixed(1)},${sy.toFixed(1)} A${r},${r} 0 0 ${cw?1:0} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="${col[cl]}" stroke-width="3"/>`);
      const tx= cw? 1:-1; out.push(`<path d="M${ex.toFixed(1)},${ey.toFixed(1)} l${(-7*tx).toFixed(1)},-9 l${(9*tx).toFixed(1)},-1Z" fill="${col[cl]}"/>`);
      if(label) out.push(`<text x="${px}" y="${py-r-12}" fill="${col[cl]}" font-size="14" font-weight="900" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); return o; },
    dim(xa,xb,y,label){ const a=+X(xa),b=+X(xb),yy=+Y(y); out.push(`<line x1="${a}" y1="${yy}" x2="${b}" y2="${yy}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${a}" y1="${yy-6}" x2="${a}" y2="${yy+6}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${b}" y1="${yy-6}" x2="${b}" y2="${yy+6}" stroke="#5E6B86" stroke-width="1.2"/>`);
      out.push(`<text x="${(a+b)/2}" y="${yy-8}" fill="#5E6B86" font-size="13" font-weight="700" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); return o; },
    dimV(x,ya,yb,label){ const xx=+X(x),a=+Y(ya),b=+Y(yb); out.push(`<line x1="${xx}" y1="${a}" x2="${xx}" y2="${b}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${xx-6}" y1="${a}" x2="${xx+6}" y2="${a}" stroke="#5E6B86" stroke-width="1.2"/><line x1="${xx-6}" y1="${b}" x2="${xx+6}" y2="${b}" stroke="#5E6B86" stroke-width="1.2"/>`);
      out.push(`<text x="${xx-8}" y="${(a+b)/2}" fill="#5E6B86" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" font-family="Zen Kaku Gothic New, sans-serif">${label}</text>`); return o; },
    raw(sv){ out.push(sv); return o; },
    svg(){ return `<svg viewBox="-30 -30 ${W+60} ${H+60}" xmlns="http://www.w3.org/2000/svg" role="img">${out.join('')}</svg>`; },
    X,Y
  };
  return o;
}
// common beam figure: supports [{x,t}], loads, dims
let lastBeam=null;
function beamDia(L,sups,loads,opt){ const ext=opt.ext||0; if((opt.dims||[]).some(d=>String(d[2]).includes('k='))) return null;
  const st={pts:[[0,0],[L+ext,0]],sup:[],hinges:[],loads:[]};
  for(const s of sups){ if(s.t==='hinge') st.hinges.push(s.x); else st.sup.push({s:s.x,t:s.t.startsWith('fixed')?'fixed':s.t,lab:s.lab||''}); }
  for(const l of loads){ const v=parseFloat(String(l.label).replace(/^[^0-9.\-]*/,'')); if(!isFinite(v)||l.tri) return null;
    if(l.t==='P') st.loads.push({k:'P',s:l.x,v,dir:'down'}); else if(l.t==='w') st.loads.push({k:'w',s0:l.x0,s1:l.x1,v,dir:'down'}); else if(l.t==='M') st.loads.push({k:'M',s:l.x,v:l.cw?v:-v}); }
  const ok=[...st.sup.map(x=>x.s),...st.hinges,...st.loads.flatMap(l=>l.k==='w'?[l.s0,l.s1]:[l.s])].every(x=>Math.abs(x*4-Math.round(x*4))<1e-9); return ok?st:null; }
function beamFig(L,sups,loads,opt={}){
  lastBeam=beamDia(L,sups,loads,opt);
  const ext=opt.ext||0; const f=Fig(-.6,-1.6,L+ext+.6,2.4);
  f.line(0,0,L+ext,0,7);
  for(const s of sups){ if(s.t==='hinge') f.hinge(s.x,0); else f.sup(s.t,s.x,0); if(s.lab) f.text(s.x,0,s.lab,'n',14,'middle',s.t==='fixedL'?-30:44); }

const XW={};
function xwBase(root,title,lead){ root.innerHTML=`<div class="xw"><h3>${title}</h3>${lead?`<p class="xlead">${lead}</p>`:''}<div class="xfig"></div><div class="xctl"></div><div class="xout"></div></div>`;
  return {fig:root.querySelector('.xfig'),ctl:root.querySelector('.xctl'),out:root.querySelector('.xout')}; }
function xwSliders(el,defs,on){ const st={}; el.innerHTML=defs.map(d=>{ st[d.k]=d.v; return d.opts? `<label class="xs"><span>${d.l}</span><select data-k="${d.k}">${d.opts.map(o=>`<option value="${o[0]}" ${o[0]===d.v?'selected':''}>${o[1]}</option>`).join('')}</select></label>`
   : `<label class="xs"><span>${d.l}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}" data-k="${d.k}"><b data-o="${d.k}"></b></label>`; }).join('');
  const fmt=d=>{ const v=st[d.k]; return (d.f?d.f(v):nf(v))+(d.u?' '+d.u:''); };
  const upd=()=>{ defs.forEach(d=>{ const o=el.querySelector(`[data-o="${d.k}"]`); if(o) o.textContent=fmt(d); }); on(st); };
  el.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{ const d=defs.find(x=>x.k===inp.dataset.k); st[d.k]= d.opts? (isNaN(+inp.value)?inp.value:+inp.value) : +inp.value; upd(); }));
  queueMicrotask(upd); return st; }
function axes(o){ // {W,H,x0,x1,y0,y1,xl,yl,ml,mb,mt,mr,yDown,xt,yt}
  const ml=o.ml??48, mr=o.mr??14, mt=o.mt??14, mb=o.mb??34; const W=o.W||520,H=o.H||300;
  const X=x=>ml+(x-o.x0)/(o.x1-o.x0)*(W-ml-mr); const Y= o.yDown? (y=>mt+(y-o.y0)/(o.y1-o.y0)*(H-mt-mb)) : (y=>H-mb-(y-o.y0)/(o.y1-o.y0)*(H-mt-mb));
  let s=`<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" fill="#fff" stroke="#D9D6CC"/>`;
  (o.xt||[]).forEach(t=>{ s+=`<line x1="${X(t)}" y1="${mt}" x2="${X(t)}" y2="${H-mb}" stroke="#EEE" /><text x="${X(t)}" y="${H-mb+14}" font-size="11" fill="#5E6B86" text-anchor="middle">${t}</text>`; });
  (o.yt||[]).forEach(t=>{ s+=`<line x1="${ml}" y1="${Y(t)}" x2="${W-mr}" y2="${Y(t)}" stroke="#EEE" /><text x="${ml-5}" y="${Y(t)+4}" font-size="11" fill="#5E6B86" text-anchor="end">${t}</text>`; });
  if(o.xl) s+=`<text x="${(ml+W-mr)/2}" y="${H-4}" font-size="12" font-weight="700" fill="#5E6B86" text-anchor="middle">${o.xl}</text>`;
  if(o.yl) s+=`<text x="12" y="${(mt+H-mb)/2}" font-size="12" font-weight="700" fill="#5E6B86" text-anchor="middle" transform="rotate(-90 12 ${(mt+H-mb)/2})">${o.yl}</text>`;
  return {X,Y,s,W,H,ml,mr,mt,mb}; }
const svgWrap=(W,H,s)=>`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Zen Kaku Gothic New, sans-serif">${s}</svg>`;
const pl=(pts,X,Y,cl='#12286B',w=2.5,dash)=>`<polyline points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${cl}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`;
const tx=(x,y,t,cl='#12286B',sz=12,an='middle',w=900)=>`<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" fill="${cl}" font-size="${sz}" font-weight="${w}" text-anchor="${an}" dominant-baseline="middle" paint-order="stroke" stroke="#fff" stroke-width="3">${t}</text>`;
const ar=(x1,y1,x2,y2,cl='#C62422',w=2.5)=>{ const a=Math.atan2(y2-y1,x2-x1); return `<line x1="${x1}" y1="${y1}" x2="${x2-8*Math.cos(a)}" y2="${y2-8*Math.sin(a)}" stroke="${cl}" stroke-width="${w}"/><path d="M${x2},${y2} L${x2-11*Math.cos(a-.4)},${y2-11*Math.sin(a-.4)} L${x2-11*Math.cos(a+.4)},${y2-11*Math.sin(a+.4)}Z" fill="${cl}"/>`; };
const D2R=Math.PI/180;
// 水面記号：▽（頂点が水面）と水面下の短い2本線
const wsm=(x,y,c='#3286BE')=>`<g class="wsm"><path d="M${(x-8).toFixed(1)},${(y-13).toFixed(1)} L${(x+8).toFixed(1)},${(y-13).toFixed(1)} L${(+x).toFixed(1)},${(y-1).toFixed(1)}Z" fill="#fff" stroke="${c}" stroke-width="1.8"/><line x1="${(x-9).toFixed(1)}" y1="${(y+4).toFixed(1)}" x2="${(x+9).toFixed(1)}" y2="${(y+4).toFixed(1)}" stroke="${c}" stroke-width="1.6"/><line x1="${(x-5).toFixed(1)}" y1="${(y+8).toFixed(1)}" x2="${(x+5).toFixed(1)}" y2="${(y+8).toFixed(1)}" stroke="${c}" stroke-width="1.6"/></g>`;
// 地盤記号：線と、土の側（side=1：進行方向の右）への斜線
const gnd=(x1,y1,x2,y2,side=1,c='#12286B',step=9)=>{ const L=Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/L, uy=(y2-y1)/L; const nx=-uy*side, ny=ux*side; let s=`<line x1="${(+x1).toFixed(1)}" y1="${(+y1).toFixed(1)}" x2="${(+x2).toFixed(1)}" y2="${(+y2).toFixed(1)}" stroke="${c}" stroke-width="2.2"/>`;
  for(let d=5;d<L-1;d+=step){ const px=x1+ux*d, py=y1+uy*d; s+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(px+nx*6-ux*6).toFixed(1)}" y2="${(py+ny*6-uy*6).toFixed(1)}" stroke="${c}" stroke-width="1.1"/>`; } return s; };

// ================= 地盤力学 体験 =================
XW.phase=root=>{ const b=xwBase(root,'土の中身を、粒・水・空気に分けてみる','土を体積で3つに分けた図です。間隙比と含水比を動かすと、飽和度や密度がどう変わるか見てください。');
  xwSliders(b.ctl,[{k:'e',l:'間隙比 e',min:.3,max:2,step:.05,v:.8},{k:'w',l:'含水比 w',min:0,max:80,step:1,v:20,u:'%'},{k:'Gs',l:'土粒子比重 Gs',min:2.5,max:2.8,step:.05,v:2.65}],st=>{
   const Vs=1,Vv=st.e,Vw0=st.w/100*st.Gs; const Vw=Math.min(Vw0,Vv), Va=Vv-Vw, Sr=Vw0/Vv; const over=Vw0>Vv+1e-9;
   const V=Vs+Vv, rt=(st.Gs+Vw)/V, rd=st.Gs/V; const H=260,top=14,sc=(H-30)/3.0;
   const bar=(y,h,c,l)=> h>0.004? `<rect x="120" y="${y}" width="150" height="${h}" fill="${c}" stroke="#12286B"/>${h>16?tx(195,y+h/2,l,'#12286B',13):''}`:'';
   let y=H-10-Vs*sc, s=bar(y,Vs*sc,'#B9AD95','土粒子'); const yw=y-Vw*sc; s+=bar(yw,Vw*sc,'#93BCD6','水'); const ya=yw-Va*sc; s+=bar(ya,Va*sc,'#FFFFFF','空気');
   s+=`<line x1="290" y1="${ya}" x2="290" y2="${H-10}" stroke="#5E6B86"/>`+tx(300,ya+(H-10-ya)/2,`全体 V＝${nf(V)}`,'#5E6B86',12,'start')+tx(100,H-10-Vs*sc/2,'Vs＝1','#5E6B86',12,'end')+tx(100,ya+Vv*sc/2,`Vv＝e＝${nf(st.e)}`,'#5E6B86',12,'end');
   b.fig.innerHTML=svgWrap(440,H,s);
   b.out.innerHTML= over? `<p class="warn">含水比が大きすぎて、すき間（間隙）に水が入りきりません。このe では含水比は最大 ${nf(st.e/st.Gs*100)}%（飽和）です。</p>`
    : `<div class="kv"><span>飽和度 S<sub>r</sub></span><b>${nf(Sr*100)}%</b><span>間隙率 n</span><b>${nf(st.e/(1+st.e)*100)}%</b><span>湿潤密度 ρ<sub>t</sub></span><b>${nf(rt,3)} g/cm³</b><span>乾燥密度 ρ<sub>d</sub></span><b>${nf(rd,3)} g/cm³</b></div><p class="xnote">e を小さくする（締め固める）と ρ<sub>d</sub> が上がる。すき間が水で満ちると S<sub>r</sub>＝100%（地下水位より下の土）。</p>`; }); };

XW.compact=root=>{ const b=xwBase(root,'締固めエネルギーと最適含水比','ローラーの回数（エネルギー）を変えると、締固め曲線がどう動くかを見る模式図です。');
  xwSliders(b.ctl,[{k:'E',l:'締固めエネルギー',min:.5,max:2,step:.1,v:1,f:v=>v<0.8?'小（軽い転圧）':v<1.4?'標準':'大（重い転圧）'},{k:'w',l:'現場の含水比',min:6,max:30,step:.5,v:14,u:'%'}],st=>{
   const Gs=2.68; const zav=w=>1/(1/Gs+w/100); const wopt=17-4.5*Math.log2(st.E), rmax=zav(wopt)*0.93;
   const curve=w=>{ const dw=(w-wopt)/(w<wopt?9:6.5); return Math.min(rmax*(1-0.5*dw*dw), zav(w)*.985); };
   const A=axes({W:520,H:300,x0:5,x1:32,y0:1.5,y1:2.15,xl:'含水比 w（%）',yl:'乾燥密度 ρd',xt:[5,10,15,20,25,30],yt:[1.6,1.8,2.0]});
   let s=A.s; const zz=[],cc=[]; for(let w=5;w<=32;w+=.5){ zz.push([w,zav(w)]); cc.push([w,Math.max(1.5,curve(w))]); }
   s+=pl(zz,A.X,A.Y,'#3286BE',2,'6 4')+tx(A.X(29),A.Y(zav(29))-12,'ゼロ空気間隙曲線','#3286BE',11);
   s+=pl(cc,A.X,A.Y,'#12286B',3); s+=`<circle cx="${A.X(wopt)}" cy="${A.Y(rmax)}" r="5" fill="#C62422"/>`+tx(A.X(wopt),A.Y(rmax)-14,`w_opt＝${nf(wopt)}%`,'#C62422',12);
   const rw=Math.max(1.5,curve(st.w)); s+=`<line x1="${A.X(st.w)}" y1="${A.Y(1.5)}" x2="${A.X(st.w)}" y2="${A.Y(rw)}" stroke="#C62422" stroke-dasharray="4 3"/><circle cx="${A.X(st.w)}" cy="${A.Y(rw)}" r="5" fill="#fff" stroke="#C62422" stroke-width="2.5"/>`;
   b.fig.innerHTML=svgWrap(520,300,s); const Dc=rw/rmax*100;
   b.out.innerHTML=`<div class="kv"><span>最大乾燥密度</span><b>${nf(rmax,3)} g/cm³</b><span>現場の乾燥密度</span><b>${nf(rw,3)} g/cm³</b><span>締固め度 D<sub>c</sub></span><b class="${Dc<90?'ng':''}">${nf(Dc)}%</b></div><p class="xnote">${st.w<wopt-2?'乾きすぎ：粒どうしがすべらず、詰まりにくい。':st.w>wopt+2?'湿りすぎ：すき間の水が逃げられず、押しても詰まらない。':'最適含水比の近く：一番よく詰まる。'} 道路の盛土では締固め度90%以上などが管理の目安。</p>`; }); };

XW.perm=root=>{ const b=xwBase(root,'下から水を流して、砂を浮かせる（ボイリング）','水槽の水位差 Δh を上げると、砂の中を上向きに水が流れます。有効応力が0になると砂は支えを失って沸き立ちます。');
  let anim=null; const P=Array.from({length:70},(_,i)=>({x:Math.random(),y:Math.random(),ph:Math.random()*6}));
  const st=xwSliders(b.ctl,[{k:'dh',l:'水位差 Δh',min:0,max:3,step:.05,v:.5,u:'m'},{k:'L',l:'砂層の厚さ L',min:1,max:3,step:.1,v:2,u:'m'},{k:'e',l:'間隙比 e',min:.5,max:1,step:.05,v:.7}],draw);
  function draw(){ const Gs=2.65, ic=(Gs-1)/(1+st.e), i=st.dh/st.L, Fs=i>0?ic/i:Infinity, gp=(Gs-1)/(1+st.e)*9.8, sig=gp*st.L-9.8*st.dh; const boil=sig<=0;
    const W=520,H=300, bx=150,bw=220, by=270, sh=st.L*55; let s=`<rect x="${bx}" y="${by-sh-70}" width="${bw}" height="${sh+70}" fill="#EAF2F8" stroke="#12286B" stroke-width="3"/>`;
    const t=performance.now()/1000; s+=`<rect x="${bx}" y="${by-sh}" width="${bw}" height="${sh}" fill="#E3D6B8"/>`;
    P.forEach(p=>{ const lift= boil? (Math.sin(t*3+p.ph)*6 - Math.min(40,(i-ic)*60+8)*((t*0.5+p.ph)%1)) : Math.sin(t*2+p.ph)*Math.min(1.5,i/ic*1.2); s+=`<circle cx="${bx+8+p.x*(bw-16)}" cy="${by-6-p.y*(sh-10)+lift}" r="3.2" fill="#A68B5B"/>`; });
    // inlet tank
    const hin=by-sh-40-st.dh*40; s+=`<rect x="40" y="${hin}" width="60" height="${by-hin}" fill="#93BCD6" stroke="#12286B" stroke-width="2"/><rect x="100" y="${by-14}" width="50" height="14" fill="#93BCD6" stroke="#12286B" stroke-width="2"/>`;
    s+=`<line x1="${bx}" y1="${by-sh-40}" x2="${bx+bw}" y2="${by-sh-40}" stroke="#3286BE" stroke-width="2"/>`+tx(bx+bw+8,by-sh-40,'流出側の水位','#3286BE',11,'start')+tx(70,hin-10,'流入側','#3286BE',11);
    s+=`<line x1="110" y1="${hin}" x2="110" y2="${by-sh-40}" stroke="#C62422" stroke-width="2"/>`+tx(116,(hin+by-sh-40)/2,`Δh＝${nf(st.dh)}m`,'#C62422',12,'start');
    for(let k=0;k<4;k++){ const xx=bx+30+k*55; s+=ar(xx,by-8,xx,by-sh+8,'#3286BE',1.5); }
    if(boil) s+=tx(bx+bw/2,by-sh-55,'ボイリング！','#C62422',18);
    s+=wsm(60,hin)+wsm(bx+bw-40,by-sh-40); b.fig.innerHTML=svgWrap(W,H,s);
    b.out.innerHTML=`<div class="kv"><span>動水勾配 i＝Δh/L</span><b>${nf(i,3)}</b><span>限界動水勾配 i<sub>c</sub></span><b>${nf(ic,3)}</b><span>安全率 i<sub>c</sub>/i</span><b class="${Fs<1?'ng':''}">${isFinite(Fs)?nf(Fs):'∞'}</b><span>砂層下面の σ'</span><b class="${boil?'ng':''}">${nf(Math.max(sig,0))} kN/m²</b></div><p class="xnote">${F("σ' = γ'L − γ_wΔh")}。水が上向きに流れる力（浸透力）が、砂の水中での重さを打ち消す。土留めの掘削底や、河川堤防の裏側で起きる現象。</p>`; }
  const loop=()=>{ if(!root.isConnected){ cancelAnimationFrame(anim); return; } draw(); anim=requestAnimationFrame(loop); }; loop(); };

XW.eff=root=>{ const b=xwBase(root,'地下水位を下げると、地盤はどうなる？','深さ方向の全応力 σ・間隙水圧 u・有効応力 σ\' のグラフです。地下水位を動かしてみてください。');
  xwSliders(b.ctl,[{k:'zw',l:'地下水位の深さ',min:0,max:10,step:.25,v:2,u:'m'},{k:'gt',l:'水位より上の γt',min:15,max:19,step:.5,v:17,u:'kN/m³'},{k:'gs',l:'水位より下の γsat',min:17,max:21,step:.5,v:19,u:'kN/m³'}],st=>{
   const Hd=10; const sig=z=> z<=st.zw? st.gt*z : st.gt*st.zw+st.gs*(z-st.zw), u=z=>Math.max(0,z-st.zw)*9.8;
   const A=axes({W:520,H:320,x0:0,x1:200,y0:0,y1:Hd,yDown:true,xl:'応力（kN/m²）',yl:'深さ（m）',xt:[0,50,100,150,200],yt:[0,2,4,6,8,10]});
   let s=A.s; const zs=[]; for(let z=0;z<=Hd+1e-9;z+=.25) zs.push(z);
   s+=`<rect x="${A.X(0)}" y="${A.Y(st.zw)}" width="${A.X(200)-A.X(0)}" height="${A.Y(Hd)-A.Y(st.zw)}" fill="rgba(147,188,214,.18)"/>`+`<line x1="${A.X(0)}" y1="${A.Y(st.zw)}" x2="${A.X(200)}" y2="${A.Y(st.zw)}" stroke="#3286BE" stroke-dasharray="6 4" stroke-width="2"/>`+wsm(A.X(186),A.Y(st.zw))+tx(A.X(174),A.Y(st.zw)-8,'地下水位','#3286BE',11,'end');
   s+=pl(zs.map(z=>[sig(z),z]),A.X,A.Y,'#12286B',2.5)+pl(zs.map(z=>[u(z),z]),A.X,A.Y,'#3286BE',2.5,'6 3')+pl(zs.map(z=>[sig(z)-u(z),z]),A.X,A.Y,'#C62422',3.5);
   s+=tx(A.X(sig(Hd))-4,A.Y(Hd)-12,'σ','#12286B',13,'end')+tx(A.X(u(Hd))+4,A.Y(Hd)-26,'u','#3286BE',13,'start')+tx(A.X(sig(Hd)-u(Hd)),A.Y(Hd)-40,"σ'",'#C62422',14);
   b.fig.innerHTML=svgWrap(520,320,s); const se=sig(Hd)-u(Hd);
   b.out.innerHTML=`<div class="kv"><span>深さ10mの σ</span><b>${nf(sig(Hd))}</b><span>u</span><b>${nf(u(Hd))}</b><span>σ'</span><b>${nf(se)} kN/m²</b></div><p class="xnote">水位を下げると u が減り、σ' が増える。粘土層では、この増えた有効応力で水がしぼり出されて沈下する（圧密）。昭和の大阪や東京の下町で地下水を汲み上げすぎて地盤沈下が起きたのはこの仕組み。いまは汲み上げが規制されている。</p>`; }); };

XW.stressdist=root=>{ const b=xwBase(root,'荷重は地中でどう広がる？（圧力球根）','地表の集中荷重 Q による鉛直応力の増分 Δσz の分布です。濃いほど大きい。点線は 2:1 分散法の広がり方。');
  xwSliders(b.ctl,[{k:'Q',l:'荷重 Q',min:50,max:500,step:10,v:200,u:'kN'},{k:'z',l:'調べる深さ',min:.5,max:8,step:.25,v:3,u:'m'},{k:'r',l:'水平距離',min:0,max:5,step:.25,v:0,u:'m'}],st=>{
   const W=520,H=300,sx=W/12,sy=(H-20)/9, X=x=>W/2+x*sx, Y=z=>10+z*sy; const bq=(r,z)=>3*st.Q/(2*Math.PI*z*z)*Math.pow(1/(1+(r/z)**2),2.5);
   let s=''; for(let i=-24;i<24;i++) for(let j=0;j<36;j++){ const x=(i+.5)*.25,z=(j+.5)*.25; const v=bq(Math.abs(x),z); const a=Math.min(1,v/40); s+=`<rect x="${X(i*.25)}" y="${Y(j*.25)}" width="${sx*.25+.5}" height="${sy*.25+.5}" fill="rgba(198,36,34,${(a*.85).toFixed(3)})"/>`; }
   [5,10,20].forEach(lv=>{ const pts=[]; for(let z=.2;z<=9;z+=.05){ const v0=3*st.Q/(2*Math.PI*z*z); if(v0<lv) break; const rr=z*Math.sqrt(Math.pow(v0/lv,.4)-1); pts.push([rr,z]); } if(pts.length>2){ s+=`<polyline points="${[...pts.map(p=>[-p[0],p[1]]).reverse(),...pts].map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#12286B" stroke-width="1.5"/>`; const p=pts[pts.length-1]; s+=tx(X(0)+4,Y(p[1])+8,lv+'kN/m²','#12286B',10,'start',700); } });
   s+=gnd(X(-6),Y(0),X(6),Y(0))+`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(-4.5)}" y2="${Y(9)}" stroke="#3286BE" stroke-dasharray="5 4"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(4.5)}" y2="${Y(9)}" stroke="#3286BE" stroke-dasharray="5 4"/>`;
   s+=ar(X(0),Y(0)-0+(-0),X(0),Y(0),'#C62422',3); s=`<g transform="translate(0,22)">${s}${ar(X(0),-20,X(0),Y(0)-2,'#C62422',3)}<circle cx="${X(st.r)}" cy="${Y(st.z)}" r="6" fill="#fff" stroke="#12286B" stroke-width="3"/></g>`;
   b.fig.innerHTML=svgWrap(W,H+22,s); const v=bq(st.r,st.z), v21=st.Q/((st.z)*(st.z)*1.0+1e-9)/1;
   b.out.innerHTML=`<div class="kv"><span>◯の位置の Δσz</span><b>${nf(v,3)} kN/m²</b><span>荷重の真下・同じ深さ</span><b>${nf(bq(0,st.z),3)} kN/m²</b></div><p class="xnote">深さが2倍になると真下の応力は1/4（${F('1/z²')}）。荷重のすぐ下ほど大きく、横へ広がりながら弱まる。隣の建物の基礎の下の応力が重なると、建物が傾く原因になる。</p>`; }); };

XW.consol=root=>{ const b=xwBase(root,'粘土から水がしぼり出される（圧密）','荷重をかけた直後は水が荷重を受け持ち（過剰間隙水圧）、時間とともに水が抜けて土に荷重が移ります。時間を進めてください。');
  xwSliders(b.ctl,[{k:'lt',l:'経過時間',min:-1,max:3.5,step:.05,v:0,f:v=>{ const d=10**v; return d<365? nf(d,1)+' 日' : nf(d/365,1)+' 年'; }},{k:'H',l:'粘土層の厚さ',min:2,max:20,step:1,v:8,u:'m'},{k:'dr',l:'排水',v:2,opts:[[2,'上下に砂層（両面排水）'],[1,'下が岩（片面排水）']]},{k:'cv',l:'圧密係数 cv',min:20,max:500,step:10,v:100,u:'cm²/日'},{k:'S',l:'最終沈下量',min:10,max:100,step:5,v:50,u:'cm'}],st=>{
   const t=10**st.lt, Hd=(st.dr==2?st.H/2:st.H)*100; const Tv=st.cv*t/(Hd*Hd);
   const uz=Z=>{ let v=0; for(let m=0;m<60;m++){ const M=Math.PI*(2*m+1)/2; v+=2/M*Math.sin(M*Z)*Math.exp(-M*M*Tv); } return Math.max(0,Math.min(1,v)); };
   const Uav=T=>{ let v=0; for(let m=0;m<60;m++){ const M=Math.PI*(2*m+1)/2; v+=2/(M*M)*Math.exp(-M*M*T); } return Math.max(0,1-v); };
   const U=Uav(Tv);
   const A=axes({W:250,H:300,x0:0,x1:1,y0:0,y1:st.H,yDown:true,xl:'過剰間隙水圧 u/u₀',yl:'深さ（m）',xt:[0,.5,1],yt:[0,st.H/2,st.H],ml:42});
   let s=A.s; const pts=[]; for(let k=0;k<=60;k++){ const z=st.H*k/60; const Z= st.dr==2? (z<=st.H/2? z/(st.H/2): (st.H-z)/(st.H/2)) : z/st.H; pts.push([uz(Z),z]); }
   s+=`<polygon points="${[[0,0],...pts,[0,st.H]].map(p=>A.X(p[0]).toFixed(1)+','+A.Y(p[1]).toFixed(1)).join(' ')}" fill="rgba(50,134,190,.3)"/>`+pl(pts,A.X,A.Y,'#3286BE',2.5)+tx(A.X(.5),A.Y(st.H*.5),'水が受け持つ','#12286B',11);
   const B=axes({W:290,H:300,x0:-1,x1:3.5,y0:0,y1:st.S*1.05,yDown:true,xl:'時間（log 日）',yl:'沈下量（cm）',xt:[-1,0,1,2,3],yt:[0,Math.round(st.S/2),st.S],ml:44});
   let s2=B.s; const cv=[]; for(let l=-1;l<=3.5;l+=.05){ cv.push([l,st.S*Uav(st.cv*10**l/(Hd*Hd))]); } s2+=pl(cv,B.X,B.Y,'#12286B',2.5)+`<circle cx="${B.X(st.lt)}" cy="${B.Y(st.S*U)}" r="6" fill="#C62422"/>`;
   b.fig.innerHTML=`<div class="two">${svgWrap(250,300,s)}${svgWrap(290,300,s2)}</div>`;
   const t90=.848*Hd*Hd/st.cv;
   b.out.innerHTML=`<div class="kv"><span>時間係数 T<sub>v</sub></span><b>${nf(Tv,4)}</b><span>圧密度 U</span><b>${nf(U*100)}%</b><span>いまの沈下量</span><b>${nf(st.S*U)} cm</b><span>90%に達する時間</span><b>${t90<365?nf(t90,0)+' 日':nf(t90/365,1)+' 年'}</b></div><p class="xnote">排水距離が半分になると時間は1/4。だから軟らかい粘土地盤では、砂の柱（サンドドレーン）や排水材（プラスチックボードドレーン）を打って排水距離を短くし、工事中に沈下を終わらせる。関西国際空港の埋立地でも大規模に使われた。</p>`; }); };

XW.shear=root=>{ const b=xwBase(root,'モールの応力円と破壊','三軸圧縮試験のように、側圧 σ₃ を一定にして σ₁ を増やします。円が破壊線（c と φ で決まる直線）に触れると土は破壊します。');
  xwSliders(b.ctl,[{k:'s3',l:'側圧 σ₃',min:0,max:200,step:5,v:100,u:'kN/m²'},{k:'s1',l:'軸圧 σ₁',min:0,max:800,step:5,v:250,u:'kN/m²'},{k:'c',l:'粘着力 c',min:0,max:50,step:1,v:10,u:'kN/m²'},{k:'phi',l:'内部摩擦角 φ',min:0,max:45,step:1,v:30,u:'°'}],st=>{
   const s1=Math.max(st.s1,st.s3), C=(s1+st.s3)/2, R=(s1-st.s3)/2; const tp=Math.tan(st.phi*D2R);
   const Kp=Math.tan((45+st.phi/2)*D2R)**2, s1f=st.s3*Kp+2*st.c*Math.sqrt(Kp); const fail=s1>=s1f-1e-6;
   const A=axes({W:520,H:300,x0:0,x1:800,y0:0,y1:450,xl:'垂直応力 σ（kN/m²）',yl:'せん断応力 τ',xt:[0,200,400,600,800],yt:[0,200,400]});
   let s=A.s; s+=pl([[0,st.c],[800,st.c+800*tp]],A.X,A.Y,'#C62422',2.5)+tx(A.X(700),A.Y(st.c+700*tp)-12,'破壊線 τ＝c＋σtanφ','#C62422',11,'end');
   const arc=[]; for(let a=0;a<=180;a+=3) arc.push([C+R*Math.cos(a*D2R),R*Math.sin(a*D2R)]); s+=pl(arc,A.X,A.Y,fail?'#C62422':'#12286B',3);
   const Cf=(s1f+st.s3)/2,Rf=(s1f-st.s3)/2; const arcf=[]; for(let a=0;a<=180;a+=3) arcf.push([Cf+Rf*Math.cos(a*D2R),Rf*Math.sin(a*D2R)]); if(!fail) s+=pl(arcf,A.X,A.Y,'#93BCD6',1.5,'5 4');
   if(fail){ const th=(90+st.phi)*D2R; s+=`<circle cx="${A.X(Cf-Rf*Math.sin(st.phi*D2R))}" cy="${A.Y(Rf*Math.cos(st.phi*D2R))}" r="6" fill="#C62422"/>`+tx(A.X(Cf),A.Y(Rf)-16,'破壊！','#C62422',16); }
   b.fig.innerHTML=svgWrap(520,300,s);
   b.out.innerHTML=`<div class="kv"><span>この σ₃ で破壊する σ₁</span><b>${nf(s1f)} kN/m²</b><span>破壊面の角度</span><b>${nf(45+st.phi/2)}°</b></div><p class="xnote">側圧 σ₃ が大きいほど（深い場所ほど）土は強い。砂は c≒0 でφが大きく、粘土は短期的には φ≒0 で c だけ。杭の支持や斜面の安定は、すべてこの破壊線で判定する。</p>`; }); };

XW.earthp=root=>{ const b=xwBase(root,'壁が動くと土圧が変わる','擁壁が土から離れる（主働）と土圧は小さくなり、土を押す（受働）と大きくなります。壁の動きを変えてみてください。');
  xwSliders(b.ctl,[{k:'mv',l:'壁の動き',min:-1,max:1,step:.02,v:-1,f:v=>v<-.05?'土から離れる（主働側）':v>.05?'土を押す（受働側）':'動かない（静止）'},{k:'phi',l:'内部摩擦角 φ',min:20,max:40,step:1,v:30,u:'°'},{k:'H',l:'壁の高さ H',min:2,max:8,step:.5,v:5,u:'m'},{k:'g',l:'土の γ',min:16,max:20,step:.5,v:18,u:'kN/m³'}],st=>{
   const Ka=Math.tan((45-st.phi/2)*D2R)**2, Kp=Math.tan((45+st.phi/2)*D2R)**2, K0=1-Math.sin(st.phi*D2R);
   const m=st.mv; const K= m<0? K0+(Ka-K0)*Math.min(1,-m/0.25) : K0+(Kp-K0)*(1-Math.exp(-m*3.2))/(1-Math.exp(-3.2));
   const P=.5*K*st.g*st.H*st.H; const W=520,H=300,sc=230/8, gx=200, gy=270; const wx=gx+m*14;
   let s=`<rect x="${gx}" y="${gy-st.H*sc}" width="${W-gx-10}" height="${st.H*sc}" fill="#E3D6B8"/>`+gnd(0,gy,W,gy)+gnd(gx,gy-st.H*sc,W-10,gy-st.H*sc);
   s+=`<rect x="${wx-18}" y="${gy-st.H*sc-6}" width="18" height="${st.H*sc+6}" fill="#12286B"/>`;
   const ang= m<=0? 45+st.phi/2 : 45-st.phi/2; const L=st.H*sc/Math.tan(ang*D2R); s+=`<line x1="${gx}" y1="${gy}" x2="${gx+L}" y2="${gy-st.H*sc}" stroke="#C62422" stroke-width="2" stroke-dasharray="6 4"/>`+tx(gx+L+6,gy-st.H*sc+12,m<0?'すべり面（主働）':m>0?'すべり面（受働）':'','#C62422',11,'start');
   const ps=K*st.g*st.H, pw=Math.min(170,ps*1.1); s+=`<polygon points="${wx-18},${gy-st.H*sc} ${wx-18-pw},${gy} ${wx-18},${gy}" fill="rgba(198,36,34,.25)" stroke="#C62422" stroke-width="2"/>`;
   s+=ar(wx-18-pw*0.7-30,gy-st.H*sc/3,wx-18,gy-st.H*sc/3,'#C62422',3)+tx(wx-18-pw*0.7-36,gy-st.H*sc/3,`${nf(P)} kN/m`,'#C62422',13,'end');
   s+=ar(wx+30,gy-st.H*sc-26,wx+(m>=0?60:0)+(m<0?-0:0),gy-st.H*sc-26,'#3286BE',0);
   b.fig.innerHTML=svgWrap(W,H,s);
   b.out.innerHTML=`<div class="kv"><span>土圧係数 K</span><b>${nf(K,3)}</b><span>K<sub>a</sub> / K₀ / K<sub>p</sub></span><b>${nf(Ka,3)} / ${nf(K0,3)} / ${nf(Kp,3)}</b><span>合力（底から H/3）</span><b>${nf(P)} kN/m</b></div><p class="xnote">主働土圧になるのは、壁がほんの少し（高さの0.1〜0.5%程度）動いただけで十分。受働土圧を出し切るにはずっと大きな動きが要る。擁壁は主働土圧で設計し、根元の前面の受働土圧は割り引いて考える。</p>`; }); };

XW.bearing=root=>{ const b=xwBase(root,'基礎の支持力は何で決まる？','テルツァギの式の3つの項の大きさを棒グラフで比べます。根入れや幅、φ を変えると、どの項が効くかが変わります。');
  const T={0:[5.7,1.0,0],5:[7.3,1.6,.5],10:[9.6,2.7,1.2],15:[12.9,4.4,2.5],20:[17.7,7.4,5.0],25:[25.1,12.7,9.7],30:[37.2,22.5,19.7],35:[57.8,41.4,42.4]};
  xwSliders(b.ctl,[{k:'phi',l:'内部摩擦角 φ',min:0,max:35,step:5,v:20,u:'°'},{k:'c',l:'粘着力 c',min:0,max:50,step:5,v:10,u:'kN/m²'},{k:'B',l:'基礎の幅 B',min:.5,max:4,step:.25,v:2,u:'m'},{k:'Df',l:'根入れ深さ Df',min:0,max:3,step:.25,v:1,u:'m'}],st=>{
   const t=T[st.phi], g=18; const a=st.c*t[0], q=g*st.Df*t[1], r=.5*g*st.B*t[2], qu=a+q+r; const mx=Math.max(400,qu*1.05);
   const W=520,H=280; let s=''; const bar=(i,v,l,c)=>{ const w=(W-170)*v/mx; s+=`<rect x="150" y="${30+i*60}" width="${w}" height="36" fill="${c}"/>`+tx(144,48+i*60,l,'#12286B',12,'end')+tx(156+w,48+i*60,nf(v),'#12286B',12,'start'); };
   bar(0,a,'粘着力 cNc','#93BCD6'); bar(1,q,'根入れ γDfNq','#3286BE'); bar(2,r,'幅 ½γBNγ','#12286B'); bar(3,qu,'合計 qu','#C62422');
   b.fig.innerHTML=svgWrap(W,H,s);
   b.out.innerHTML=`<div class="kv"><span>N<sub>c</sub> / N<sub>q</sub> / N<sub>γ</sub></span><b>${t.join(' / ')}</b><span>極限支持力 q<sub>u</sub></span><b>${nf(qu)} kN/m²</b><span>許容支持力（安全率3）</span><b>${nf(qu/3)} kN/m²</b></div><p class="xnote">砂（φが大きい）では根入れと幅の項が効き、粘土（φ≒0）では粘着力の項がほぼすべて。だから砂地盤では基礎を深く・広くするのが有効。地盤が弱く支持力が足りないときは、杭で深い硬い層まで荷重を伝える。</p>`; }); };

XW.slope=root=>{ const b=xwBase(root,'斜面はどこまで急にできる？','長く続く斜面のすべりを考えます。雨で地下水が上がる（斜面に平行に水が流れる）と、安全率がどう変わるか見てください。');
  let anim=null,slide=0; const st=xwSliders(b.ctl,[{k:'b',l:'斜面の角度 β',min:10,max:50,step:1,v:30,u:'°'},{k:'phi',l:'内部摩擦角 φ',min:20,max:45,step:1,v:35,u:'°'},{k:'c',l:'粘着力 c',min:0,max:20,step:1,v:3,u:'kN/m²'},{k:'z',l:'すべり面の深さ z',min:.5,max:4,step:.25,v:1.5,u:'m'},{k:'m',l:'地下水（雨）',min:0,max:1,step:.05,v:0,f:v=>v<.05?'なし':v>.95?'地表まで':nf(v*100,0)+'%'}],draw);
  function fs(){ const br=st.b*D2R,g=18,gs=20; const gt= g*(1-st.m)+gs*st.m; const sn=gt*st.z*Math.cos(br)**2, tau=gt*st.z*Math.sin(br)*Math.cos(br), u=9.8*st.m*st.z*Math.cos(br)**2; return (st.c+(sn-u)*Math.tan(st.phi*D2R))/tau; }
  function draw(){ const F_=fs(); const W=520,H=280, br=st.b*D2R; const x0=40,y0=250, L=440; const x1=x0+L*Math.cos(br)*0.85, y1=y0-L*Math.sin(br)*0.85;
    if(F_<1) slide=Math.min(80,slide+1.5); else slide=Math.max(0,slide-4);
    let s=`<polygon points="${x0},${y0} ${x1},${y1} ${W},${y1} ${W},${y0}" fill="#D8CFBE"/>`; const d=st.z*14; const nx=Math.sin(br),ny=Math.cos(br);
    const ox=-slide*Math.cos(br), oy=slide*Math.sin(br);
    s+=`<polygon points="${x0+60+ox},${y0-60*Math.tan(br)+oy} ${x1-60+ox},${y1+60*Math.tan(br)+oy} ${x1-60+nx*d},${y1+60*Math.tan(br)+ny*d} ${x0+60+nx*d},${y0-60*Math.tan(br)+ny*d}" fill="${F_<1?'#E9A6A4':'#E3D6B8'}" stroke="#12286B" stroke-width="1.5"/>`;
    s+=`<line x1="${x0+60+nx*d}" y1="${y0-60*Math.tan(br)+ny*d}" x2="${x1-60+nx*d}" y2="${y1+60*Math.tan(br)+ny*d}" stroke="#C62422" stroke-width="2" stroke-dasharray="6 4"/>`;
    if(st.m>0){ const dw=d*(1-st.m); s+=`<line x1="${x0+60+nx*dw}" y1="${y0-60*Math.tan(br)+ny*dw}" x2="${x1-60+nx*dw}" y2="${y1+60*Math.tan(br)+ny*dw}" stroke="#3286BE" stroke-width="2"/>`; }
    s+=tx(W-10,24,`安全率 Fs＝${nf(F_,3)}`,F_<1?'#C62422':'#12286B',18,'end')+(F_<1?tx(W-10,50,'すべる！','#C62422',16,'end'):'');
    s+=gnd(x0,y0,x1,y1)+gnd(x1,y1,W,y1); if(st.m>0){ const dw=d*(1-st.m), mx=(x0+x1)/2+nx*dw, my=(y0+y1)/2+ny*dw; s+=wsm(mx,my); } b.fig.innerHTML=svgWrap(W,H,s);
    b.out.innerHTML=`<p class="xnote">乾いた砂なら ${F('F_s = tanφ / tanβ')}：斜面の角度が φ（安息角）を超えると崩れる。水が入ると間隙水圧で有効応力が減り、安全率はおよそ半分まで下がる。大雨で斜面が崩れるのはこのため。道路の切土斜面では、水抜きのパイプや排水路で地下水を下げて安定させる。</p>`; }
  const loop=()=>{ if(!root.isConnected){ cancelAnimationFrame(anim); return; } if(slide>0||fs()<1) draw(); anim=requestAnimationFrame(loop); }; loop(); };

XW.nliq=root=>{ const b=xwBase(root,'液状化しやすい地盤を見つける','深さごとの液状化抵抗率 F<sub>L</sub> を計算します（F<sub>L</sub>≦1 で液状化の可能性）。地震の強さ、地下水位、N値を変えてみてください。');
  xwSliders(b.ctl,[{k:'kh',l:'地震の強さ（水平震度）',min:.1,max:.6,step:.02,v:.3},{k:'zw',l:'地下水位の深さ',min:0,max:5,step:.25,v:1,u:'m'},{k:'N',l:'砂のN値',min:2,max:30,step:1,v:8,u:'回'}],st=>{
   const zs=[]; for(let z=1;z<=20;z+=.5) zs.push(z); const res=zs.map(z=>{ if(z<=st.zw) return [z,null]; const sv=18*st.zw+19*(z-st.zw), se=sv-9.8*(z-st.zw); const rd=1-.015*z; const L=rd*st.kh*sv/se; const N1=170*st.N/(se+70); const R= N1<14? .0882*Math.sqrt(N1/1.7) : .0882*Math.sqrt(14/1.7)+1.6e-6*(N1-14)**4.5; return [z,R/L]; });
   const A=axes({W:520,H:320,x0:0,x1:3,y0:0,y1:20,yDown:true,xl:'液状化抵抗率 FL',yl:'深さ（m）',xt:[0,1,2,3],yt:[0,5,10,15,20]});
   let s=A.s+`<rect x="${A.X(0)}" y="${A.Y(0)}" width="${A.X(1)-A.X(0)}" height="${A.Y(20)-A.Y(0)}" fill="rgba(198,36,34,.10)"/>`+`<line x1="${A.X(1)}" y1="${A.Y(0)}" x2="${A.X(1)}" y2="${A.Y(20)}" stroke="#C62422" stroke-width="2"/>`+tx(A.X(.5),A.Y(19),'液状化の可能性','#C62422',11);
   s+=`<line x1="${A.X(0)}" y1="${A.Y(st.zw)}" x2="${A.X(3)}" y2="${A.Y(st.zw)}" stroke="#3286BE" stroke-dasharray="6 4"/>`+wsm(A.X(2.85),A.Y(st.zw))+tx(A.X(2.72),A.Y(st.zw)-8,'地下水位','#3286BE',11,'end');
   res.forEach(([z,f])=>{ if(f==null) return; const ff=Math.min(3,f); s+=`<rect x="${A.X(0)}" y="${A.Y(z-.22)}" width="${A.X(ff)-A.X(0)}" height="${A.Y(.44)-A.Y(0)}" fill="${f<=1?'#C62422':'#3286BE'}"/>`; });
   b.fig.innerHTML=svgWrap(520,320,s); const bad=res.filter(r=>r[1]!=null&&r[1]<=1).length;
   b.out.innerHTML=`<p class="xnote">${bad?`<b style="color:#C62422">${bad*0.5} m 分の層が F<sub>L</sub>≦1</b>。`:'どの深さも F<sub>L</sub>＞1。'} 緩い砂（N値が小さい）、浅い地下水位、強い揺れがそろうと液状化する。東日本大震災では千葉県浦安市などの埋立地で広く液状化した。対策は、締め固める（N値を上げる）、地下水位を下げる、固化材で固める、など。R は道路橋示方書の旧式に基づく簡易な目安。</p>`; }); };

XW.class=root=>{ const b=xwBase(root,'粒度分布で土を見分ける','粒径加積曲線です。D₁₀・D₃₀・D₆₀ を動かすと、曲線の形と判定が変わります。');
  xwSliders(b.ctl,[{k:'d10',l:'D₁₀',min:-2.5,max:0,step:.05,v:-1.3,f:v=>nf(10**v,3)+' mm'},{k:'r30',l:'D₃₀／D₁₀',min:1,max:10,step:.1,v:3},{k:'r60',l:'D₆₀／D₁₀',min:1.2,max:60,step:.2,v:15}],st=>{
   const D10=10**st.d10, D30=D10*st.r30, D60=D10*Math.max(st.r60,st.r30*1.05); const Uc=D60/D10, Uc2=D30*D30/(D10*D60); const good=Uc>=10&&Uc2>1&&Uc2<=Math.sqrt(Uc);
   const A=axes({W:520,H:280,x0:-3,x1:2,y0:0,y1:100,xl:'粒径（mm、対数）',yl:'通過質量百分率（%）',xt:[-3,-2,-1,0,1,2],yt:[0,10,30,60,100]});
   const P=[[Math.log10(D10)-1,0],[Math.log10(D10),10],[Math.log10(D30),30],[Math.log10(D60),60],[Math.log10(D60)+.6,100]];
   let s=A.s+pl(P,A.X,A.Y,'#12286B',3); P.slice(1,4).forEach((p,i)=>{ s+=`<circle cx="${A.X(p[0])}" cy="${A.Y(p[1])}" r="5" fill="#C62422"/>`+tx(A.X(p[0])+8,A.Y(p[1])+10,['D₁₀','D₃₀','D₆₀'][i],'#C62422',11,'start'); });

// ================= 地盤力学 units =================
const GW=9.8; // γw kN/m³
function layerFig(layers,opt={}){ // layers: [{h,label,col}], top at 0 going down; wt: depth of water table
  const tot=layers.reduce((a,b)=>a+b.h,0); const f=Fig(-1,-tot-.6,9,opt.top||1.2); let y=0;
  f.raw(gnd(+f.X(0),+f.Y(0),+f.X(6),+f.Y(0)));
  for(const L of layers){ f.rect(0,y-L.h,6,L.h,L.col||'#D8CFBE','#12286B'); f.text(3,y-L.h/2,L.label,'n',13); f.dimV(-.3,y-L.h,y,`${L.h}m`); y-=L.h; }
  if(opt.wt!=null){ f.line(0,-opt.wt,6,-opt.wt,2,'b','6 4'); f.raw(wsm(+f.X(5.3),+f.Y(-opt.wt))); f.text(6.2,-opt.wt,'地下水位','b',12,'start'); }
  if(opt.mark!=null){ f.line(6,-opt.mark,7,-opt.mark,2,'r'); f.text(7.1,-opt.mark,opt.markLabel||'点X','r',13,'start'); }
  if(opt.q){ f.W(0,6,0,opt.q,.7); }
  return f.svg(); }

const PF={
 phase:[
  {t:'考え方：土粒子の体積を1とおく',f:'phase',b:`比の式はすべて「土粒子の体積 ${F('V_s = 1')}」とおいた図で出せる。すると間隙は ${F('V_v = e')}、全体は ${F('V = 1 + e')}。<br>土粒子の質量は ${F('m_s = G_sρ_w × 1')}、水の質量は ${F('m_w = w m_s = wG_sρ_w')}。水の体積は ${F('V_w = m_w/ρ_w = wG_s')}。`},
  {t:'間隙率 n＝e/(1＋e)',b:`${F('n = V_v/V')} に、上の図の ${F('V_v = e')}、${F('V = 1 + e')} を入れるだけ。`},
  {t:'乾燥密度 ρ_d＝ρ_t/(1＋w)',b:`全体の質量は ${F('m = m_s + m_w = m_s(1 + w)')}。両辺を体積 V で割ると ${F('ρ_t = ρ_d(1 + w)')}。<br>また ${F('ρ_d = m_s/V = G_sρ_w/(1 + e)')} なので、e について解くと ${F('e = ρ_s/ρ_d − 1')}（${F('ρ_s = G_sρ_w')}）。`},
  {t:'S_r e＝w G_s',b:`${F('S_r = V_w/V_v = wG_s/e')}。両辺に e をかける。飽和（${F('S_r = 1')}）なら ${F('e = wG_s')}：含水比から間隙比がすぐわかる。`},
  {t:'水中単位体積重量 γ′＝γ_sat−γ_w',b:`地下水位より下の土は、水の中に沈んでいるので浮力を受ける。体積1の土の重さ ${F('γ_sat')} から、押しのけた水の重さ ${F('γ_w × 1')} を引いたものが、土の骨組みにかかる正味の重さ。<br>上の図から ${F('γ_sat = (G_s + e)γ_w/(1 + e)')}、${F("γ' = (G_s − 1)γ_w/(1 + e)")}。`},
 ],
 class:[
  {t:'均等係数 U_c＝D_60/D_10',b:`粒径の幅を表す比。全部が同じ大きさの粒なら D<sub>60</sub>＝D<sub>10</sub> で ${F('U_c = 1')}。大小が混ざるほど大きくなる。大きい粒のすき間に小さい粒が入り込めるので、よく締まる土になる。定義なので証明はなく、10以上を「粒度が良い」とするのは経験から決めた基準。`},
  {t:'曲率係数 U_c′＝D_30²/(D_10 D_60)',b:`${F('D_30')} が ${F('D_10')} と ${F('D_60')} の「掛け算の真ん中」（幾何平均 ${F('√(D_10 D_60)')}）にあると ${F("U_c' = 1")}。中間の粒が抜けて曲線が段になると1から外れる。`},
  {t:'液性指数 I_L＝(w−w_P)/I_p',b:`含水比 w が、塑性限界 w<sub>P</sub>（0）と液性限界 w<sub>L</sub>（1）の間のどこにあるかを表す目盛り。${F('w = w_P')} なら0、${F('w = w_L')} なら1。1に近いほど、乱すと液体に近い状態になる。${F('I_c = 1 − I_L')} はその裏返し。`},
 ],
 compact:[
  {t:'ゼロ空気間隙曲線 ρ_d＝ρ_w/(1/G_s＋w)',b:`空気がない（${F('S_r = 1')}）なら ${F('e = wG_s')}。これを ${F('ρ_d = G_sρ_w/(1 + e)')} に入れると ${F('ρ_d = G_sρ_w/(1 + wG_s)')}。分母分子を G<sub>s</sub> で割ると式になる。どんなに締め固めても空気は0より減らないので、締固め曲線は必ずこの曲線の下にある。`},
  {t:'最適含水比があるわけ',b:`乾きすぎると、粒どうしの摩擦が大きく動きにくい。水が増えると、水が潤滑剤になって粒が詰まりやすくなり ρ<sub>d</sub> が上がる。さらに増えると、水が粒の間を占めて押し出せない（ゼロ空気間隙曲線に沿って下がる）。この2つの効果の境目が最適含水比。実験（JIS A 1210）で決める。`},
 ],
 perm:[
  {t:'ダルシーの法則 v＝ki',b:`ダルシーが砂の柱で実験して見つけた法則。流量は水頭差 h と断面積 A に比例し、流れる距離 L に反比例した：${F('Q = kA(h/L) = kiA')}。土の中の流れは遅く、粘性が支配する層流なので、速さが動水勾配に比例する。`},
  {t:'定水位透水試験 k＝QL/(hAt)',b:`時間 t の間に集めた水の量が Q（体積）なら、流量は Q/t。ダルシーの ${F('Q/t = k(h/L)A')} を k について解く。`},
  {t:'変水位透水試験 k＝(aL/(At)) ln(h₁/h₂)',b:`細い管（断面 a）の水位 h が下がる速さは、試料を通る流量と等しい：${F('−a dh/dt = k(h/L)A')}。<br>${F('dh/h = −(kA/(aL)) dt')} を、時刻0（h₁）から t（h₂）まで積分すると ${F('ln(h₁/h₂) = kAt/(aL)')}。k について解く。`},
  {t:'層に平行 k_h＝Σk_i H_i/ΣH_i',b:`水平に流れるとき、どの層も同じ動水勾配 i。全流量は各層の流量の和：${F('k_h i ΣH_i = Σk_i i H_i')}。i を消すと式になる（厚さの重み付き平均）。`},
  {t:'層に直角 k_v＝ΣH_i/Σ(H_i/k_i)',b:`上下に流れるとき、どの層も同じ流速 v（水がたまらないので）。全体の水頭差は各層の水頭差の和：${F('h = Σ(vH_i/k_i)')}。一方 ${F('h = vΣH_i/k_v')}。等しいとおいて k<sub>v</sub> を解く。透水性の低い層が全体を決める（電気の直列抵抗と同じ）。`},
  {t:'流線網 q＝kH N_f/N_d',b:`流線網の1マスはほぼ正方形（幅＝長さ）。1つの流路（流線の間）を流れる量は、1マスについてダルシーで ${F('Δq = k(Δh/l)·l = kΔh')}。<br>水頭差 H を等ポテンシャル線で N<sub>d</sub> 等分するので ${F('Δh = H/N_d')}。流路が N<sub>f</sub> 本あるので ${F('q = N_f · kH/N_d')}。`},

 eff:[
  {t:'有効応力の原理 σ′＝σ−u',f:'column',b:`深さ z の水平面にかかる全体の重さ σ は、土粒子の骨組み（粒どうしの接触）と、間隙の水圧 u の2つで分け合って支えている。水圧はどの向きにも同じで、粒をずらしたり押しつぶしたりしない。粒の接触で伝わる分 ${F("σ' = σ − u")} だけが、土の強さ（摩擦）や変形を決める。テルツァギが実験から確かめた原理。`},
  {t:'全応力 σ＝Σγ_i z_i',b:`その深さより上にある土と水の柱の重さ（単位面積あたり）。静水圧 ${F('p = ρgh')} と同じ考え方で、層ごとに「単位体積重量 × 厚さ」を足す。`},
  {t:'地下水位以下 σ′＝Σγ′z',b:`地下水位より下で厚さ z の層：${F('σ = γ_sat z')}、${F('u = γ_w z')}。引くと ${F("σ' = (γ_sat − γ_w)z = γ' z")}。浮力を差し引いた重さ、と考えても同じ。`},
  {t:'上向き浸透 σ′＝γ′z−γ_wΔh',b:`下から水が押し上げられると、間隙水圧は静水圧より ${F('γ_w Δh')} 大きい。${F("σ' = γ_sat z − γ_w(z + Δh) = γ'z − γ_w Δh")}。これが0になる Δh/z が限界動水勾配。`},
 ],
 stressdist:[
  {t:'ブーシネスク Δσ_z＝3Q/(2πz²)',b:`弾性体の表面に集中荷重 Q がかかったときの解（ブーシネスク、1885年）。弾性論の釣り合いの式を解いて得られるもので、導出は大学院レベル。ここでは確かめ方を示す：<br>深さ z の水平面全体で Δσ<sub>z</sub> を足すと、必ず Q になる。${F('∫_0^∞ (3Q/(2πz²))(1 + r²/z²)^{−5/2} · 2πr dr')}、${F('s = r²/z²')} とおくと ${F('= (3Q/2)∫_0^∞ (1 + s)^{−5/2} ds = (3Q/2)(2/3) = Q')}。<br>同じ力が、深いほど広い面に配られるので ${F('1/z²')} で小さくなる。`},
  {t:'2:1分散法 Δσ＝qBL/((B＋z)(L＋z))',b:`荷重 qBL が、深さ1につき横に½ずつ（縦2：横1）広がると考える近似。深さ z では、各辺が両側に ${F('z/2')} ずつ広がり ${F('(B + z) × (L + z)')} の面に配られる。力の合計は変わらないので「全荷重 ÷ 広がった面積」。帯状なら L 方向は広がらず ${F('qB/(B + z)')}。`},
 ],
 consol:[
  {t:'最終沈下量 S＝C_c H/(1＋e₀) log((σ₀′＋Δσ)/σ₀′)',b:`土粒子の体積は変わらず、間隙だけが減る。体積1＋e₀ の土で間隙比が Δe 減ると、高さは ${F('Δe/(1 + e₀)')} の割合で縮む。厚さ H なら ${F('S = H Δe/(1 + e₀)')}。<br>正規圧密粘土では、実験で e と ${F("log σ'")} がほぼ直線になる（傾き C<sub>c</sub>：圧縮指数）。${F("Δe = C_c log((σ_0' + Δσ)/σ_0')")} を代入する。`},
  {t:'S＝m_vΔσH',b:`体積圧縮係数 m<sub>v</sub> は「応力が1増えたときのひずみ（体積の縮む割合）」。ひずみ ${F('m_v Δσ')} に厚さ H をかけると沈下量。`},
  {t:'圧密時間 t＝T_v H′²/c_v',b:`テルツァギの圧密方程式 ${F('∂u/∂t = c_v ∂²u/∂z²')}（水が抜けた分だけ体積が減る、というつりあいとダルシーの法則から作る）を、無次元の時間 ${F("T_v = c_v t/H'²")} で書くと、どの粘土層でも同じ形の解になる。<br>その解から、圧密度50%で ${F('T_v = 0.197')}、90%で ${F('T_v = 0.848')} と決まる。時間は ${F("H'²")} に比例：排水距離が2倍なら4倍の時間。`},
  {t:'両面排水なら排水距離は層厚の半分',b:`上下に砂層があると、水は近いほうへ抜ける。一番遠い点は層の中央で、そこから端までが H/2。片面排水では反対側の端まで H。`},
 ],
 shear:[
  {t:'モール・クーロン τ_f＝c＋σ′tanφ',b:`クーロンの摩擦の法則「すべり出す力＝摩擦係数 × 押しつける力」を土に使う。摩擦係数を ${F('tanφ')} と書き（斜面に置いた物が φ ですべり出すのと同じ）、押しつける力は有効応力 σ′。粘土の粒どうしの結びつきの分を c として足す。`},
  {t:'c_u＝q_u/2',f:'mohr',b:`一軸圧縮試験では横からの力 ${F('σ_3 = 0')}、縦が ${F('σ_1 = q_u')}。モールの円の半径は ${F('(σ_1 − σ_3)/2 = q_u/2')}。φ＝0 の粘土では、破壊線が水平線 τ＝c なので、円の頂点がちょうど c に届く：${F('c_u = q_u/2')}。`},
  {t:'sinφ＝(σ₁−σ₃)/(σ₁＋σ₃)',f:'mohr',b:`c＝0 なら破壊線は原点を通る直線 ${F("τ = σ' tanφ")}。破壊時のモールの円は、中心 ${F('(σ_1 + σ_3)/2')}、半径 ${F('R = (σ_1 − σ_3)/2')} で、この直線に接する。<br>原点・中心・接点の直角三角形で ${F('sinφ = 半径/中心までの距離 = (σ_1 − σ_3)/(σ_1 + σ_3)')}。`},
  {t:'σ₁＝σ₃tan²(45°＋φ/2)',b:`上の式を σ₁ について解くと ${F('σ_1 = σ_3(1 + sinφ)/(1 − sinφ)')}。三角関数の公式で ${F('(1 + sinφ)/(1 − sinφ) = tan²(45° + φ/2)')}。<br>粘着力 c があるときは、破壊線を σ 軸の負の側 ${F('c/tanφ')} から引いた直線と考えて同じ計算をすると ${F('+ 2c tan(45° + φ/2)')} の項が加わる。`},
  {t:'破壊面の角度 45°＋φ/2',b:`モールの円の上で、円の中心から接点までの線と σ 軸の角度は ${F('90° + φ')}（直角三角形の外角）。円の上の角度は、実際の面の角度の2倍なので、破壊面は最大主応力面と ${F('(90° + φ)/2 = 45° + φ/2')}。`},
 ],
 earthp:[
  {t:'ランキン K_a＝tan²(45°−φ/2)',f:'wall',b:`背後の土の深さ z では、鉛直の応力 ${F('σ_v = γz')} は決まっている。壁が離れると水平の応力 σ<sub>h</sub> が減っていき、土が破壊する（モールの円が破壊線に接する）ところで止まる。<br>このとき最大主応力 ${F('σ_1 = σ_v')}、最小 ${F('σ_3 = σ_h')}。せん断の単元の式から ${F('σ_h = σ_v / tan²(45° + φ/2) = σ_v tan²(45° − φ/2)')}。比が ${F('K_a')}。<br>壁が土を押すと逆に ${F('σ_h')} が σ<sub>1</sub> になり ${F('K_p = tan²(45° + φ/2)')}。`},
  {t:'合力 P_a＝½K_aγH²、作用点 H/3',b:`土圧は深さに比例：${F('p = K_aγz')}。底で ${F('K_aγH')} の三角形分布なので、面積は ${F('½ × H × K_aγH')}。三角形の重心は底から H/3。`},
  {t:'上載荷重 q：＋qK_a H（作用点 H/2）',b:`地表に q が載ると、どの深さでも鉛直応力が q 増え、水平には ${F('qK_a')} 増える。深さによらない長方形分布なので、合力は ${F('qK_a H')}、作用点は中央。`},
  {t:'引張亀裂 z_c＝2c/(γ√K_a)',b:`粘着力があるとき、ランキンの主働土圧は ${F('p = K_aγz − 2c√K_a')}。浅い所では負（土が壁を引っ張る）になるが、土は引っ張りに弱く亀裂が入る。p＝0 となる深さ：${F('K_aγz_c = 2c√K_a')} → ${F('z_c = 2c/(γ√K_a)')}。`},
  {t:'静止土圧 K₀≒1−sinφ',b:`壁が動かないときは、土は破壊していないので理論では決まらない。ヤーキー（1944年）が理論的な考察と実験から得た近似式で、正規圧密の土でよく合う。`},
 ],
 bearing:[
  {t:'テルツァギの支持力式 q_u＝cN_c＋γD_f N_q＋½γBN_γ',b:`基礎の下の土が、くさび形にすべって押し出されるときの力のつりあいから作る式。すべりに抵抗するものは3つ：<br>①すべり面に沿った粘着力 c → ${F('cN_c')}<br>②基礎の横の土（根入れ D<sub>f</sub>）が押さえる重さ ${F('γD_f')} → ${F('γD_f N_q')}<br>③すべるくさびの土自身の重さ（幅 B に比例）→ ${F('½γBN_γ')}<br>係数 N はすべり面の形から φ だけで決まる。例えば ${F('N_q = e^{πtanφ} tan²(45° + φ/2)')}（プラントルの解）、${F('N_c = (N_q − 1)/tanφ')}。重ね合わせは近似で、安全側の値になる。`},
  {t:'φ＝0 なら N_c＝5.14',b:`${F('N_c = (N_q − 1)/tanφ')} で φ→0 の極限を取ると ${F('π + 2 = 5.14')}（プラントル）。粘土の帯基礎の短期の支持力は ${F('q_u ≒ 5.14c')}。`},
  {t:'許容支持力 q_a＝q_u/F_s',b:`土のばらつきや沈下を考えて、極限の値を安全率で割る。長期3、短期（地震時）2 とするのが一般的。建築の告示式は、この ⅓ をはじめから中に入れた形。`},
 ],
 slope:[
  {t:'乾いた砂の無限斜面 F_s＝tanφ/tanβ',f:'slope',b:`斜面に平行なすべり面の上の土のかたまり（重さ W）を考える。<br>・すべらせる力：重さの斜面方向成分 ${F('W sinβ')}<br>・押しつける力：${F('W cosβ')}、摩擦で抵抗できる最大の力 ${F('W cosβ tanφ')}<br>${F('F_s = W cosβ tanφ/(W sinβ) = tanφ/tanβ')}。深さによらない。β＝φ でちょうど安全率1（安息角）。`},
  {t:'粘着力あり F_s＝(c＋γz cos²β tanφ)/(γz sinβ cosβ)',b:`すべり面の面積あたりで考える。斜面方向に長さ1の柱（幅1）は、すべり面の長さ1・鉛直の高さ z で、重さは ${F('γz cosβ')}（柱の水平幅が cosβ）。<br>すべり面に垂直な応力 ${F('σ = γz cos²β')}、平行な応力 ${F('τ = γz sinβ cosβ')}。抵抗 ${F('c + σ tanφ')} を τ で割る。`},
  {t:'平行な浸透流で約半分（γ′/γ_sat 倍）',b:`斜面に平行に水が流れると、すべり面の水圧 ${F('u = γ_w z cos²β')} の分だけ押しつける力が減る：${F("σ' = γ' z cos²β")}。すべらせる力は飽和した重さ ${F('γ_sat z sinβ cosβ')}。<br>${F("F_s = (γ'/γ_sat)(tanφ/tanβ)")}。${F("γ' ≒ γ_sat/2")} なので約半分。`},
  {t:'円弧すべり F_s＝cLR/(Wd)',b:`円の中心のまわりのモーメントで考える。すべらせる：土の重さ W × 中心からの水平距離 d。抵抗する：円弧に沿った粘着力 c × 長さ L（力）× 半径 R（腕）。比が安全率。`},
 ],
 nliq:[
  {t:'N値の換算式（大崎・テルツァギ・ペック）',b:`${F('φ = √(20N) + 15')}、${F('q_u ≒ 12.5N')} は、多くの現場でN値と土質試験を両方行った結果を、グラフにして当てはめた経験式。理論から導いたものではないので、ばらつきが大きく、目安として使う。`},
  {t:'抵抗率 F_L＝R/L',b:`安全率と同じ考え方。R は、その砂が液状化せずに耐えられるせん断応力比（試験やN値から求める）。L は、地震で実際にかかるせん断応力比。耐えられる力 ÷ かかる力 が1以下なら液状化のおそれ。`},
  {t:'地震時せん断応力比 L＝r_d k_hc σ_v/σ_v′',b:`深さ z の土の柱（重さ σ<sub>v</sub>）が、水平に加速度 ${F('k_hc g')} で揺さぶられる。ニュートンの法則で、底面には ${F('τ = (σ_v/g)(k_hc g) = k_hcσ_v')} のせん断応力がかかる。<br>地盤は剛体ではなく深いほど揺れが小さいので、低減係数 ${F('r_d = 1 − 0.015z')} をかける。土の強さは有効応力で決まるので σ<sub>v</sub>′ で割って比にする。`},
 ],
};
